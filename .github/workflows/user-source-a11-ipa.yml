name: ZHIROX User A11 Integrated IPA

on:
  push:
    branches:
      - user-source-a11-integrated
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: cd ios && pod install
      - name: Analyze A11 integration
        run: flutter analyze --no-fatal-infos lib/main_user_a11.dart lib/services/a11_camera_service.dart lib/services/a11_camera_coordinator.dart lib/screens/admin/camera_source_settings_screen.dart
      - name: Build ZHIROX User iOS release
        run: flutter build ios --release --no-codesign -t lib/main_user_a11.dart
      - name: Verify User identity
        run: |
          APP=build/ios/iphoneos/Runner.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")" = "ZHIROX User"
      - name: Package unsigned IPA
        run: |
          rm -rf Payload ZHIROX-User-A11-Integrated.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload ZHIROX-User-A11-Integrated.ipa
          test -s ZHIROX-User-A11-Integrated.ipa
          shasum -a 256 ZHIROX-User-A11-Integrated.ipa > ZHIROX-User-A11-Integrated.ipa.sha256
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZHIROX-User-A11-Integrated-unsigned-ipa
          path: |
            ZHIROX-User-A11-Integrated.ipa
            ZHIROX-User-A11-Integrated.ipa.sha256
          if-no-files-found: error
          retention-days: 7
