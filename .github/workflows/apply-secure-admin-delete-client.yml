name: Apply Secure Admin Delete Client

on:
  push:
    branches: [owner-source]
    paths:
      - 'scripts/apply_secure_admin_delete_client.py'
      - '.github/workflows/apply-secure-admin-delete-client.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout owner-source
        uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0

      - name: Preserve helper and Edge source
        run: |
          cp scripts/apply_secure_admin_delete_client.py /tmp/apply_secure_admin_delete_client.py
          cp supabase/functions/delete-account/index.ts /tmp/delete_account_index.ts

      - name: Patch Owner
        run: python scripts/apply_secure_admin_delete_client.py

      - name: Commit Owner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/pb_service.dart scripts/verify_online_only.py
          if ! git diff --cached --quiet; then
            git commit -m 'Use secure System Owner admin deletion function'
            git push origin HEAD:owner-source
          fi

      - name: Checkout user-source
        run: |
          git fetch origin user-source
          git checkout -B user-source origin/user-source
          mkdir -p supabase/functions/delete-account
          cp /tmp/delete_account_index.ts supabase/functions/delete-account/index.ts

      - name: Patch User
        run: python /tmp/apply_secure_admin_delete_client.py

      - name: Commit User
        run: |
          git add lib/services/pb_service.dart scripts/verify_online_only.py supabase/functions/delete-account/index.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Use secure System Owner admin deletion function'
            git push origin HEAD:user-source
          fi
