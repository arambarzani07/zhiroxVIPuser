name: Customer Push Task 7 Profile Wire

on:
  push:
    branches: [user-source]
    paths:
      - '.github/workflows/customer-push-task7-wire.yml'

permissions:
  contents: write

jobs:
  wire-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: user-source
          fetch-depth: 0
      - name: Wire customer push card into customer overview
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/shared/user_profile_screen.dart')
          text = path.read_text()

          import_line = "import 'package:zhirox/widgets/customer_push_card.dart';\n"
          if import_line not in text:
              anchor = "import 'package:zhirox/services/connectivity_service.dart';\n"
              if text.count(anchor) != 1:
                  raise SystemExit('profile import anchor mismatch')
              text = text.replace(anchor, anchor + import_line, 1)

          old = "      if (!totalsComplete) _buildCurrencySummaryWarning(),\n      _buildDebtLimitCard(),\n    ];"
          new = "      if (!totalsComplete) _buildCurrencySummaryWarning(),\n      _buildDebtLimitCard(),\n      if (auth.canSendNotifications)\n        SliverToBoxAdapter(\n          child: Padding(\n            padding: const EdgeInsets.fromLTRB(16, 6, 16, 2),\n            child: CustomerPushCard(customerId: widget.userId),\n          ),\n        ),\n    ];"
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('customer overview anchor mismatch')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          rm .github/workflows/customer-push-task7-wire.yml
      - name: Commit profile integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/shared/user_profile_screen.dart .github/workflows/customer-push-task7-wire.yml
          git diff --cached --check
          git commit -m 'feat(user): wire customer push QR controls'
          git push origin HEAD:user-source
