name: iOS Unsigned IPA

on:
  push:
    branches: [owner-source, user-source]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply debt restore source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          detail_path = Path('lib/screens/shared/debt_detail_screen.dart')
          detail = detail_path.read_text()
          old_message = "message: 'دڵنیایت لە سڕینەوەی ئەم قەرزە؟',"
          new_message = "message: 'قەرزەکە دەخرێتە سەبەتە و دەتوانیت دواتر بیگەڕێنیتەوە. دڵنیایت؟',"
          if old_message in detail:
              detail = detail.replace(old_message, new_message, 1)
          old_call = "      await PBService.deleteDebt(widget.debtId);"
          new_call = """      final response = await PBService.client.functions.invoke(
                'debt-restore-admin',
                body: {'action': 'delete', 'debt_id': widget.debtId},
              );
              final data = response.data;
              if (data is! Map || data['deleted'] != true) {
                final code = data is Map ? data['error']?.toString() : null;
                throw Exception(code ?? 'delete_failed');
              }"""
          if old_call in detail:
              detail = detail.replace(old_call, new_call, 1)
          elif "'action': 'delete'" not in detail:
              raise SystemExit('debt delete marker not found')
          detail_path.write_text(detail)

          restore_path = Path('lib/screens/admin/debt_restore_screen.dart')
          restore = restore_path.read_text()
          confirm_block = """    final customerName = item['customer_name']?.toString().trim() ?? '';
              final confirm = await AppHelpers.showConfirmDialog(
                context,
                title: 'گەڕاندنەوەی قەرز',
                message: customerName.isEmpty
                    ? 'دڵنیایت دەتەوێت ئەم قەرزە بگەڕێنیتەوە؟'
                    : 'دڵنیایت دەتەوێت قەرزی $customerName بگەڕێنیتەوە؟',
              );
              if (!mounted || !confirm) return;

          """
          if confirm_block in restore:
              restore = restore.replace(confirm_block, '', 1)
          restore_path.write_text(restore)
          PY

          if ! git diff --quiet -- lib/screens/shared/debt_detail_screen.dart lib/screens/admin/debt_restore_screen.dart; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/screens/shared/debt_detail_screen.dart lib/screens/admin/debt_restore_screen.dart
            git commit -m "Finish admin debt restore flow"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Resolve app edition
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            owner-source)
              echo "APP_EDITION=Owner" >> "$GITHUB_ENV"
              echo "BUNDLE_ID=com.karoxghafoor.zhirox.owner" >> "$GITHUB_ENV"
              echo "DISPLAY_NAME=ZHIROX Owner" >> "$GITHUB_ENV"
              echo "BUNDLE_NAME=zhirox_owner" >> "$GITHUB_ENV"
              echo "IPA_FILE=ZHIROX-Owner.ipa" >> "$GITHUB_ENV"
              echo "ARTIFACT_NAME=zhirox-owner-unsigned-ipa" >> "$GITHUB_ENV"
              ;;
            user-source)
              echo "APP_EDITION=User" >> "$GITHUB_ENV"
              echo "BUNDLE_ID=com.karoxghafoor.zhirox.user" >> "$GITHUB_ENV"
              echo "DISPLAY_NAME=ZHIROX User" >> "$GITHUB_ENV"
              echo "BUNDLE_NAME=zhirox_user" >> "$GITHUB_ENV"
              echo "IPA_FILE=ZHIROX-User.ipa" >> "$GITHUB_ENV"
              echo "ARTIFACT_NAME=zhiroxVIPuser-unsigned-ipa" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported source branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Verify online-only policy
        run: python3 scripts/verify_online_only.py

      - name: Verify FIB payment security
        run: python3 scripts/verify_fib_payment_security.py

      - name: Prepare independent iOS identity
        run: |
          sed -i '' "s/com.karoxghafoor.zhirox/${BUNDLE_ID}/g" ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${DISPLAY_NAME}" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName ${BUNDLE_NAME}" ios/Runner/Info.plist

      - name: Prepare iOS 15 deployment target
        run: |
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '15.0'/" ios/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'/IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'/" ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Wire CocoaPods xcconfig
        run: |
          printf '%s\n%s\n' '#include? "Pods/Target Support Files/Pods-Runner/Pods-Runner.debug.xcconfig"' '#include "Generated.xcconfig"' > ios/Flutter/Debug.xcconfig
          printf '%s\n%s\n' '#include? "Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"' '#include "Generated.xcconfig"' > ios/Flutter/Release.xcconfig

      - name: Analyze strictly
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign

      - name: Verify app identity
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ios/iphoneos/Runner.app/Info.plist | grep -Fx "$BUNDLE_ID"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' build/ios/iphoneos/Runner.app/Info.plist | grep -Fx "$DISPLAY_NAME"

      - name: Package unsigned IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload "$IPA_FILE"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.IPA_FILE }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish permanent IPA download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            owner-source)
              TAG="owner-latest"
              TITLE="ZHIROX Owner - Latest"
              ;;
            user-source)
              TAG="user-latest"
              TITLE="ZHIROX User - Latest"
              ;;
          esac

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA_FILE" --clobber
          else
            gh release create "$TAG" "$IPA_FILE" \
              --title "$TITLE" \
              --notes "Latest unsigned IPA. Updated automatically by GitHub Actions." \
              --target "$GITHUB_SHA"
          fi
