name: iOS Supabase Unsigned IPA

on:
  push:
    branches: [ipa-supabase-connected]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build payload
        uses: actions/checkout@v4

      - name: Extract exact Supabase-connected source
        run: |
          rm -rf /tmp/zhirox-src
          mkdir -p /tmp/zhirox-src
          unzip -q .ipa_source/zhirox-source.zip -d /tmp/zhirox-src
          test -f /tmp/zhirox-src/zhirox/pubspec.yaml
          test -f /tmp/zhirox-src/zhirox/ios/Runner.xcodeproj/project.pbxproj

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: /tmp/zhirox-src/zhirox
        run: flutter pub get

      - name: Prepare iOS 15 deployment target
        working-directory: /tmp/zhirox-src/zhirox
        run: |
          if [ -f ios/Podfile ]; then
            sed -i '' "s/platform :ios, '13.0'/platform :ios, '15.0'/" ios/Podfile || true
          fi
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj || true

      - name: Install CocoaPods
        working-directory: /tmp/zhirox-src/zhirox/ios
        run: pod install

      - name: Analyze Dart compile issues
        working-directory: /tmp/zhirox-src/zhirox
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build iOS without signing
        working-directory: /tmp/zhirox-src/zhirox
        run: flutter build ios --release --no-codesign

      - name: Verify new Supabase backend is embedded
        working-directory: /tmp/zhirox-src/zhirox
        run: |
          APP=build/ios/iphoneos/Runner.app
          grep -R -a -q 'zfuvnczdqifihsnrhqzj' "$APP"
          if grep -R -a -q 'hsoyfbtpvwfmjokudznx' "$APP"; then
            echo 'Old Supabase project detected in binary' >&2
            exit 1
          fi
          if grep -R -a -q 'zhirox.duckdns.org' "$APP"; then
            echo 'Old PocketBase backend detected in binary' >&2
            exit 1
          fi

      - name: Package unsigned IPA
        working-directory: /tmp/zhirox-src/zhirox
        run: |
          rm -rf Payload zhiroxVIPuser-SUPABASE-unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload zhiroxVIPuser-SUPABASE-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhiroxVIPuser-SUPABASE-unsigned-ipa
          path: /tmp/zhirox-src/zhirox/zhiroxVIPuser-SUPABASE-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
