name: iOS Unsigned IPA

on:
  push:
    branches: [user-source]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare independent User iOS identity
        run: |
          sed -i '' 's/com.karoxghafoor.zhirox/com.karoxghafoor.zhirox.user/g' ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ZHIROX User" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName zhirox_user" ios/Runner/Info.plist

      - name: Prepare iOS 15 deployment target
        run: |
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '15.0'/" ios/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'/IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'/" ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Wire CocoaPods xcconfig
        run: |
          printf '%s\n%s\n' '#include? "Pods/Target Support Files/Pods-Runner/Pods-Runner.debug.xcconfig"' '#include "Generated.xcconfig"' > ios/Flutter/Debug.xcconfig
          printf '%s\n%s\n' '#include? "Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"' '#include "Generated.xcconfig"' > ios/Flutter/Release.xcconfig

      - name: Analyze for compile errors
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign

      - name: Verify User app identity
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ios/iphoneos/Runner.app/Info.plist | grep -Fx 'com.karoxghafoor.zhirox.user'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' build/ios/iphoneos/Runner.app/Info.plist | grep -Fx 'ZHIROX User'

      - name: Package public user unsigned IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload ZHIROX-User.ipa

      - name: Upload public user IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhiroxVIPuser-unsigned-ipa
          path: ZHIROX-User.ipa
          if-no-files-found: error
          retention-days: 7
