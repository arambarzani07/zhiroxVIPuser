name: iOS Unsigned IPA

on:
  push:
    branches: [owner-source, user-source]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve app edition
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            owner-source)
              echo "APP_EDITION=Owner" >> "$GITHUB_ENV"
              echo "UPDATE_EDITION=owner" >> "$GITHUB_ENV"
              echo "UPDATE_TAG=owner-latest" >> "$GITHUB_ENV"
              echo "UPDATE_TITLE=ZHIROX Owner - Latest" >> "$GITHUB_ENV"
              echo "UPDATE_MANIFEST=owner-update.json" >> "$GITHUB_ENV"
              echo "BUNDLE_ID=com.karoxghafoor.zhirox.owner" >> "$GITHUB_ENV"
              echo "DISPLAY_NAME=ZHIROX Owner" >> "$GITHUB_ENV"
              echo "BUNDLE_NAME=zhirox_owner" >> "$GITHUB_ENV"
              echo "IPA_FILE=ZHIROX-Owner.ipa" >> "$GITHUB_ENV"
              echo "ARTIFACT_NAME=zhirox-owner-unsigned-ipa" >> "$GITHUB_ENV"
              ;;
            user-source)
              echo "APP_EDITION=User" >> "$GITHUB_ENV"
              echo "UPDATE_EDITION=user" >> "$GITHUB_ENV"
              echo "UPDATE_TAG=user-latest" >> "$GITHUB_ENV"
              echo "UPDATE_TITLE=ZHIROX User - Latest" >> "$GITHUB_ENV"
              echo "UPDATE_MANIFEST=user-update.json" >> "$GITHUB_ENV"
              echo "BUNDLE_ID=com.karoxghafoor.zhirox.user" >> "$GITHUB_ENV"
              echo "DISPLAY_NAME=ZHIROX User" >> "$GITHUB_ENV"
              echo "BUNDLE_NAME=zhirox_user" >> "$GITHUB_ENV"
              echo "IPA_FILE=ZHIROX-User.ipa" >> "$GITHUB_ENV"
              echo "ARTIFACT_NAME=zhiroxVIPuser-unsigned-ipa" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported source branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Verify online-only policy
        run: python3 scripts/verify_online_only.py

      - name: Verify FIB payment security
        run: python3 scripts/verify_fib_payment_security.py

      - name: Verify Auto Update Center
        run: python3 scripts/verify_auto_update.py

      - name: Prepare independent iOS identity
        run: |
          sed -i '' "s/com.karoxghafoor.zhirox/${BUNDLE_ID}/g" ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${DISPLAY_NAME}" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName ${BUNDLE_NAME}" ios/Runner/Info.plist

      - name: Prepare iOS 15 deployment target
        run: |
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '15.0'/" ios/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'/IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'/" ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Wire CocoaPods xcconfig
        run: |
          printf '%s\n%s\n' '#include? "Pods/Target Support Files/Pods-Runner/Pods-Runner.debug.xcconfig"' '#include "Generated.xcconfig"' > ios/Flutter/Debug.xcconfig
          printf '%s\n%s\n' '#include? "Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"' '#include "Generated.xcconfig"' > ios/Flutter/Release.xcconfig

      - name: Analyze strictly
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build iOS without signing
        run: |
          flutter build ios --release --no-codesign \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define=ZHIROX_BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
            --dart-define=ZHIROX_APP_EDITION="$UPDATE_EDITION"

      - name: Verify app identity
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ios/iphoneos/Runner.app/Info.plist | grep -Fx "$BUNDLE_ID"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' build/ios/iphoneos/Runner.app/Info.plist | grep -Fx "$DISPLAY_NAME"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/ios/iphoneos/Runner.app/Info.plist | grep -Fx "$GITHUB_RUN_NUMBER"

      - name: Package unsigned IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload "$IPA_FILE"

      - name: Generate update manifest
        shell: bash
        run: |
          set -euo pipefail
          export IPA_SHA256="$(shasum -a 256 "$IPA_FILE" | awk '{print $1}')"
          python3 - <<'PY'
          import datetime
          import json
          import os
          import subprocess
          from pathlib import Path

          version_line = next(
              line for line in Path('pubspec.yaml').read_text().splitlines()
              if line.startswith('version:')
          )
          semantic_version = version_line.split(':', 1)[1].strip().split('+', 1)[0]
          notes = subprocess.check_output(
              ['git', 'log', '-1', '--pretty=%s'], text=True
          ).strip()
          download_url = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/"
              f"{os.environ['UPDATE_TAG']}/{os.environ['IPA_FILE']}"
          )
          manifest = {
              'schema': 1,
              'edition': os.environ['UPDATE_EDITION'],
              'version': semantic_version,
              'build_number': int(os.environ['GITHUB_RUN_NUMBER']),
              'commit': os.environ['GITHUB_SHA'],
              'published_at': datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat().replace('+00:00', 'Z'),
              'download_url': download_url,
              'mandatory': False,
              'notes': notes,
              'sha256': os.environ['IPA_SHA256'],
          }
          Path(os.environ['UPDATE_MANIFEST']).write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n'
          )
          PY

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.IPA_FILE }}
            ${{ env.UPDATE_MANIFEST }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish permanent IPA download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$UPDATE_TAG" >/dev/null 2>&1; then
            gh release upload "$UPDATE_TAG" "$IPA_FILE" "$UPDATE_MANIFEST" --clobber
          else
            gh release create "$UPDATE_TAG" "$IPA_FILE" "$UPDATE_MANIFEST" \
              --title "$UPDATE_TITLE" \
              --notes "Latest unsigned IPA and Auto Update Center manifest. Updated automatically by GitHub Actions." \
              --target "$GITHUB_SHA"
          fi
