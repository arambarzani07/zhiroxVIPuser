name: iOS Unsigned IPA

on:
  push:
    branches: [owner-source, user-source]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve app edition
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            owner-source)
              echo "APP_EDITION=Owner" >> "$GITHUB_ENV"
              echo "UPDATE_EDITION=owner" >> "$GITHUB_ENV"
              echo "UPDATE_TAG=owner-latest" >> "$GITHUB_ENV"
              echo "UPDATE_TITLE=ZHIROX Owner - Latest" >> "$GITHUB_ENV"
              echo "UPDATE_MANIFEST=owner-update.json" >> "$GITHUB_ENV"
              echo "BUNDLE_ID=com.karoxghafoor.zhirox.owner" >> "$GITHUB_ENV"
              echo "DISPLAY_NAME=ZHIROX Owner" >> "$GITHUB_ENV"
              echo "BUNDLE_NAME=zhirox_owner" >> "$GITHUB_ENV"
              echo "IPA_FILE=ZHIROX-Owner-${GITHUB_RUN_NUMBER}.ipa" >> "$GITHUB_ENV"
              echo "ARTIFACT_NAME=zhirox-owner-unsigned-ipa" >> "$GITHUB_ENV"
              ;;
            user-source)
              echo "APP_EDITION=User" >> "$GITHUB_ENV"
              echo "UPDATE_EDITION=user" >> "$GITHUB_ENV"
              echo "UPDATE_TAG=user-latest" >> "$GITHUB_ENV"
              echo "UPDATE_TITLE=ZHIROX User - Latest" >> "$GITHUB_ENV"
              echo "UPDATE_MANIFEST=user-update.json" >> "$GITHUB_ENV"
              echo "BUNDLE_ID=com.karoxghafoor.zhirox.user" >> "$GITHUB_ENV"
              echo "DISPLAY_NAME=ZHIROX User" >> "$GITHUB_ENV"
              echo "BUNDLE_NAME=zhirox_user" >> "$GITHUB_ENV"
              echo "IPA_FILE=ZHIROX-User-${GITHUB_RUN_NUMBER}.ipa" >> "$GITHUB_ENV"
              echo "ARTIFACT_NAME=zhiroxVIPuser-unsigned-ipa" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported source branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Verify online-only policy
        run: python3 scripts/verify_online_only.py

      - name: Verify FIB payment security
        run: python3 scripts/verify_fib_payment_security.py

      - name: Verify financial-event tenant isolation
        run: python3 scripts/verify_financial_event_tenant_isolation.py

      - name: Verify Auto Update Center
        run: python3 scripts/verify_auto_update.py

      - name: Verify customer cumulative payment totals
        run: python3 scripts/verify_customer_payment_totals.py

      - name: Verify Receipt Studio governance
        run: python3 scripts/verify_receipt_studio_governance.py

      - name: Verify admin dashboard recent activity
        run: python3 scripts/verify_admin_dashboard_activity.py

      - name: Verify debt restore admin
        run: python3 scripts/verify_debt_restore_admin.py

      - name: Verify Daftar Qarz connection lock
        if: github.ref_name == 'user-source'
        run: python3 scripts/verify_daftar_sync_lock.py

      - name: Verify Daftar multi-tenant runtime
        run: python3 scripts/verify_daftar_multitenant_runtime.py

      - name: Verify Daftar raw mirror
        if: github.ref_name == 'user-source'
        run: python3 scripts/verify_daftar_mirror.py

      - name: Verify Daftar shadow reconciliation
        if: github.ref_name == 'user-source'
        run: python3 scripts/verify_daftar_reconciliation.py

      - name: Verify Daftar cutover rehearsal
        if: github.ref_name == 'user-source'
        run: python3 scripts/verify_daftar_cutover_rehearsal.py

      - name: Verify Daftar failover readiness
        if: github.ref_name == 'user-source'
        run: python3 scripts/verify_daftar_failover_ready.py

      - name: Verify Daftar planned primary cutover
        if: github.ref_name == 'user-source'
        run: python3 scripts/verify_daftar_planned_primary_cutover.py

      - name: Verify Daftar primary inbound sync
        if: github.ref_name == 'user-source'
        run: python3 scripts/verify_daftar_primary_inbound_sync.py

      - name: Verify Daftar exact projection
        if: github.ref_name == 'user-source'
        run: python3 scripts/verify_daftar_exact_projection.py

      - name: Verify Daftar customer link backfill
        if: github.ref_name == 'user-source'
        run: python3 scripts/verify_daftar_customer_link_backfill.py

      - name: Verify Daftar customer identity integrity
        if: github.ref_name == 'user-source'
        run: python3 scripts/verify_daftar_customer_identity_guard.py

      - name: Verify Daftar outbound sync
        if: github.ref_name == 'user-source'
        run: python3 scripts/verify_daftar_outbound_sync.py

      - name: Verify Daftar bidirectional mutations
        if: github.ref_name == 'user-source'
        run: python3 scripts/verify_daftar_bidirectional_mutations.py

      - name: Verify Daftar credit-limit gateway
        if: github.ref_name == 'user-source'
        run: python3 scripts/verify_daftar_credit_limit_gateway.py

      - name: Verify Daftar outage qualification
        if: github.ref_name == 'user-source'
        run: python3 scripts/verify_daftar_outage_qualification.py

      - name: Verify Daftar read-path independence
        if: github.ref_name == 'user-source'
        run: python3 scripts/verify_daftar_read_path_independence.py

      - name: Verify Daftar customer live reads
        if: github.ref_name == 'user-source'
        run: python3 scripts/verify_daftar_customer_live_reads.py

      - name: Verify Daftar admin live reads
        if: github.ref_name == 'user-source'
        run: python3 scripts/verify_daftar_admin_live_reads.py

      - name: Verify Daftar live-primary reads
        if: github.ref_name == 'user-source'
        run: |
          python3 scripts/verify_daftar_live_primary_read.py
          python3 scripts/verify_daftar_customer_live_reads.py
          python3 scripts/verify_daftar_admin_live_reads.py

      - name: Verify dashboard primary resilience
        if: github.ref_name == 'user-source'
        run: python3 scripts/verify_dashboard_primary_resilience.py

      - name: Verify customer QR web push policy
        if: github.ref_name == 'user-source'
        run: python3 scripts/verify_customer_push.py

      - name: Setup Deno
        if: github.ref_name == 'user-source'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test customer push Edge Functions
        if: github.ref_name == 'user-source'
        run: |
          deno test --allow-env supabase/functions/_shared/customer_push \
                    supabase/functions/customer-push-admin \
                    supabase/functions/customer-push \
                    supabase/functions/customer-push-worker \
                    supabase/functions/customer-push-events \
                    supabase/functions/record-payment

      - name: Test Daftar live-read policy
        if: github.ref_name == 'user-source'
        run: deno test supabase/functions/_shared/daftar_live_read/policy_test.ts

      - name: Test Daftar live freshness and worker auth
        if: github.ref_name == 'user-source'
        run: |
          deno test supabase/functions/_shared/daftar_live_read/freshness_test.ts
          deno test supabase/functions/_shared/daftar_sync_auth_test.ts

      - name: Test Daftar live-read Edge Function
        if: github.ref_name == 'user-source'
        run: |
          deno test supabase/functions/_shared/daftar_live_read
          deno test supabase/functions/_shared/daftar_sync_auth_test.ts

      - name: Check Daftar live-read Edge Function
        if: github.ref_name == 'user-source'
        run: deno check supabase/functions/daftar-live-read/index.ts

      - name: Check Daftar sync Edge Functions
        if: github.ref_name == 'user-source'
        run: |
          deno check supabase/functions/daftar-sync/index.ts
          deno check supabase/functions/daftar-sync-gateway/index.ts

      - name: Test Daftar outbound sync
        if: github.ref_name == 'user-source'
        run: |
          deno test supabase/functions/_shared/daftar_outbound/client_test.ts
          deno check supabase/functions/daftar-outbound-sync/index.ts

      - name: Check Daftar credit-limit gateway
        if: github.ref_name == 'user-source'
        run: deno check supabase/functions/daftar-credit-gateway/index.ts

      - name: Prepare independent iOS identity
        run: |
          sed -i '' "s/com.karoxghafoor.zhirox/${BUNDLE_ID}/g" ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${DISPLAY_NAME}" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName ${BUNDLE_NAME}" ios/Runner/Info.plist

      - name: Prepare iOS 15 deployment target
        run: |
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '15.0'/" ios/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'/IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'/" ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Wire CocoaPods xcconfig
        run: |
          printf '%s\n%s\n' '#include? "Pods/Target Support Files/Pods-Runner/Pods-Runner.debug.xcconfig"' '#include "Generated.xcconfig"' > ios/Flutter/Debug.xcconfig
          printf '%s\n%s\n' '#include? "Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"' '#include "Generated.xcconfig"' > ios/Flutter/Release.xcconfig

      - name: Analyze strictly
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build iOS without signing
        run: |
          flutter build ios --release --no-codesign \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define=ZHIROX_BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
            --dart-define=ZHIROX_APP_EDITION="$UPDATE_EDITION"

      - name: Verify app identity
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ios/iphoneos/Runner.app/Info.plist | grep -Fx "$BUNDLE_ID"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' build/ios/iphoneos/Runner.app/Info.plist | grep -Fx "$DISPLAY_NAME"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/ios/iphoneos/Runner.app/Info.plist | grep -Fx "$GITHUB_RUN_NUMBER"

      - name: Package signer-safe unsigned IPA
        run: |
          set -euo pipefail
          rm -rf Payload "$IPA_FILE"
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          find Payload -type d -name _CodeSignature -prune -exec rm -rf {} \;
          find Payload -type f -name CodeResources -delete
          find Payload -type f -name embedded.mobileprovision -delete
          xattr -cr Payload || true
          /usr/bin/zip -qry "$IPA_FILE" Payload
          unzip -t "$IPA_FILE"

      - name: Generate update manifest
        shell: bash
        run: |
          set -euo pipefail
          export IPA_SHA256="$(shasum -a 256 "$IPA_FILE" | awk '{print $1}')"
          python3 - <<'PY'
          import datetime
          import json
          import os
          import subprocess
          from pathlib import Path

          version_line = next(
              line for line in Path('pubspec.yaml').read_text().splitlines()
              if line.startswith('version:')
          )
          semantic_version = version_line.split(':', 1)[1].strip().split('+', 1)[0]
          notes = subprocess.check_output(
              ['git', 'log', '-1', '--pretty=%s'], text=True
          ).strip()
          download_url = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/"
              f"{os.environ['UPDATE_TAG']}/{os.environ['IPA_FILE']}"
          )
          manifest = {
              'schema': 1,
              'edition': os.environ['UPDATE_EDITION'],
              'version': semantic_version,
              'build_number': int(os.environ['GITHUB_RUN_NUMBER']),
              'commit': os.environ['GITHUB_SHA'],
              'published_at': datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat().replace('+00:00', 'Z'),
              'download_url': download_url,
              'mandatory': False,
              'notes': notes,
              'sha256': os.environ['IPA_SHA256'],
          }
          Path(os.environ['UPDATE_MANIFEST']).write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n'
          )
          PY

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.IPA_FILE }}
            ${{ env.UPDATE_MANIFEST }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish permanent IPA download
        if: github.ref_name == 'owner-source'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4; do
            echo "Release publish attempt ${attempt}/4"

            if gh release view "$UPDATE_TAG" >/dev/null 2>&1; then
              if gh release upload "$UPDATE_TAG" "$IPA_FILE" "$UPDATE_MANIFEST" --clobber; then
                echo "Release assets published successfully."
                exit 0
              fi
            else
              if gh release create "$UPDATE_TAG" "$IPA_FILE" "$UPDATE_MANIFEST" \
                --title "$UPDATE_TITLE" \
                --notes "Latest unsigned IPA and Auto Update Center manifest. Updated automatically by GitHub Actions." \
                --target "$GITHUB_SHA"; then
                echo "Release created and assets published successfully."
                exit 0
              fi
            fi

            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 15))
              echo "GitHub release publish failed; retrying in ${delay}s..." >&2
              sleep "$delay"
            fi
          done

          echo "GitHub release publish failed after 4 attempts." >&2
          exit 1

      - name: Capture immutable rollback-ready user release
        if: github.ref_name == 'user-source'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          immutable_tag="user-r${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          python3 scripts/rollback/release_bundle.py validate-policy --repo .
          python3 scripts/rollback/release_bundle.py build --repo . --output rollback-bundle \
            --tag "$immutable_tag" --commit "$GITHUB_SHA" --build "$GITHUB_RUN_NUMBER" \
            --ipa "$IPA_FILE" --manifest "$UPDATE_MANIFEST"
          python3 scripts/rollback/release_bundle.py validate --bundle rollback-bundle \
            --tag "$immutable_tag" --commit "$GITHUB_SHA"
          if gh release view "$immutable_tag" >/dev/null 2>&1; then
            echo "Immutable rollback tag already exists; refusing rewrite." >&2; exit 1
          fi
          gh release create "$immutable_tag" rollback-bundle/* \
            --title "ZHIROX User rollback ${GITHUB_RUN_NUMBER}" \
            --notes "Validated immutable rollback-ready release." --target "$GITHUB_SHA"
          gh release download user-latest -p rollback-index.json -D previous-index || true
          if [ -f previous-index/rollback-index.json ]; then
            python3 scripts/rollback/release_bundle.py index \
              --metadata rollback-bundle/release-metadata.json \
              --existing previous-index/rollback-index.json --output rollback-index.json
          else
            python3 scripts/rollback/release_bundle.py index \
              --metadata rollback-bundle/release-metadata.json --output rollback-index.json
          fi
          python3 scripts/rollback/release_bundle.py active-release \
            --metadata rollback-bundle/release-metadata.json --output active-release.json \
            --kind normal_release --actor "$GITHUB_ACTOR" --run-id "$GITHUB_RUN_ID"
          if gh release view user-latest >/dev/null 2>&1; then
            gh release upload user-latest "$IPA_FILE" "$UPDATE_MANIFEST" active-release.json rollback-index.json --clobber
          else
            gh release create user-latest "$IPA_FILE" "$UPDATE_MANIFEST" active-release.json rollback-index.json \
              --title "$UPDATE_TITLE" \
              --notes "Active user manifest and retained rollback index." --target "$GITHUB_SHA"
          fi

      - name: Verify rollback release contracts
        if: github.ref_name == 'user-source'
        run: |
          python3 -m unittest -v scripts.rollback.test_release_bundle
          python3 scripts/rollback/verify_workflows.py
