name: Add Telegram customer entry

on:
  push:
    branches: [user-source]
    paths:
      - .github/workflows/telegram-customer-entry-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: user-source
          fetch-depth: 0

      - name: Add Telegram entry to customer dashboard
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/screens/customer/customer_dashboard.dart')
          s = p.read_text()
          imp = "import 'package:zhirox/screens/customer/notifications_screen.dart';\n"
          add_imp = imp + "import 'package:zhirox/screens/customer/telegram_settings_dialog.dart';\n"
          if 'telegram_settings_dialog.dart' not in s:
              assert imp in s, 'notifications import not found'
              s = s.replace(imp, add_imp, 1)

          marker = "                      Stack(\n                        clipBehavior: Clip.none,"
          button = """                      IconButton(
                        tooltip: 'Telegram',
                        onPressed: () => showDialog<void>(
                          context: context,
                          builder: (_) => const TelegramSettingsDialog(),
                        ),
                        icon: Icon(
                          Icons.telegram_rounded,
                          color: textPrimary,
                        ),
                      ),
                      Stack(
                        clipBehavior: Clip.none,"""
          if 'const TelegramSettingsDialog()' not in s:
              assert marker in s, 'customer header notification stack not found'
              s = s.replace(marker, button, 1)
          p.write_text(s)

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/customer/customer_dashboard.dart
          git diff --cached --quiet || git commit -m "add Telegram connect entry to customer dashboard"
          git push origin HEAD:user-source
