name: Compact Debt Sections Once
'on':
  push:
    branches:
      - owner-source
    paths:
      - .github/workflows/compact-debt-sections-once.yml

permissions:
  contents: write

jobs:
  patch-both:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Patch Owner sections
        run: |
          python scripts/compact_debt_sections_patch.py
          git add lib/screens/shared/debt_detail_screen.dart
          git commit -m "Compact payment receipt and items sections"
          git push origin HEAD:owner-source
      - name: Patch User sections
        run: |
          git show origin/owner-source:scripts/compact_debt_sections_patch.py > /tmp/compact_debt_sections_patch.py
          git checkout user-source
          python /tmp/compact_debt_sections_patch.py
          git add lib/screens/shared/debt_detail_screen.dart
          git commit -m "Compact payment receipt and items sections"
          git push origin HEAD:user-source
