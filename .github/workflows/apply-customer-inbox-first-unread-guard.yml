name: Apply Customer Inbox First Unread Guard

on:
  push:
    branches: [owner-source]
    paths:
      - 'scripts/apply_customer_inbox_first_unread_guard.py'
      - '.github/workflows/apply-customer-inbox-first-unread-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout owner-source
        uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0

      - name: Preserve helper
        run: cp scripts/apply_customer_inbox_first_unread_guard.py /tmp/apply_customer_inbox_first_unread_guard.py

      - name: Patch Owner verifier
        run: python scripts/apply_customer_inbox_first_unread_guard.py

      - name: Commit Owner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify_online_only.py
          if ! git diff --cached --quiet; then
            git commit -m 'Guard Customer Inbox first-unread baseline'
            git push origin HEAD:owner-source
          fi

      - name: Checkout user-source
        run: |
          git fetch origin user-source
          git checkout -B user-source origin/user-source

      - name: Patch User verifier
        run: python /tmp/apply_customer_inbox_first_unread_guard.py

      - name: Commit User
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify_online_only.py
          if ! git diff --cached --quiet; then
            git commit -m 'Guard Customer Inbox first-unread baseline'
            git push origin HEAD:user-source
          fi
