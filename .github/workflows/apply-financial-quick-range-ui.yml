name: Apply financial quick range UI patch

on:
  push:
    branches: [user-source]
    paths:
      - .github/workflows/apply-financial-quick-range-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: user-source
          fetch-depth: 0

      - name: Apply bounded source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/shared/user_profile_screen.dart')
          text = path.read_text()

          clear_marker = "  void _clearFinancialFilters() {"
          if text.count(clear_marker) != 1:
              raise SystemExit('clear filter marker mismatch')
          quick_method = """  void _applyFinancialQuickRange(FinancialQuickRange preset) {
    final resolved = resolveFinancialQuickRange(preset, DateTime.now());
    setState(() {
      _financialDateRange = DateTimeRange(
        start: resolved.start,
        end: resolved.end,
      );
      _financialTypeFilter = 'all';
    });
    unawaited(_hydrateFinancialHistoryForFilters());
  }

"""
          text = text.replace(clear_marker, quick_method + clear_marker, 1)

          tools_start = text.index('  Widget _buildFinancialChatTools({')
          tools_end = text.index('  Widget _buildFilteredTimelineEmptyState', tools_start)
          tools = text[tools_start:tools_end]

          return_marker = """    return Column(
      crossAxisAlignment: CrossAxisAlignment.stretch,
      children: [
        TextField("""
          if tools.count(return_marker) != 1:
              raise SystemExit('financial tools return marker mismatch')
          quick_chip = """    Widget quickChip(FinancialQuickRange preset, String label) {
      final resolved = resolveFinancialQuickRange(preset, DateTime.now());
      final active = _financialDateRange;
      final selected = active != null &&
          active.start.year == resolved.start.year &&
          active.start.month == resolved.start.month &&
          active.start.day == resolved.start.day &&
          active.end.year == resolved.end.year &&
          active.end.month == resolved.end.month &&
          active.end.day == resolved.end.day;
      return Padding(
        padding: const EdgeInsetsDirectional.only(end: 7),
        child: ChoiceChip(
          selected: selected,
          onSelected: (_) => _applyFinancialQuickRange(preset),
          label: Text(
            label,
            style: TextStyle(
              fontSize: 10.25,
              fontWeight: selected ? FontWeight.w800 : FontWeight.w600,
            ),
          ),
          visualDensity: VisualDensity.compact,
          side: BorderSide(
            color: selected
                ? AppColors.primary.withValues(alpha: 0.30)
                : (isDark
                    ? Colors.white.withValues(alpha: 0.08)
                    : const Color(0xFFE4E7EC)),
          ),
        ),
      );
    }

"""
          tools = tools.replace(return_marker, quick_chip + return_marker, 1)

          type_row = """        SingleChildScrollView(
          scrollDirection: Axis.horizontal,
          child: Row(
            children: [
              typeChip('all', 'هەموو', Icons.all_inclusive_rounded),
              typeChip('debt', 'قەرز', Icons.north_east_rounded),
              typeChip('payment', 'پارە وەرگرتنەوە', Icons.south_west_rounded),
              typeChip('system', 'مێژووی گۆڕانکاری', Icons.history_rounded),
            ],
          ),
        ),
        const SizedBox(height: 9),
        Row("""
          if tools.count(type_row) != 1:
              raise SystemExit('financial type row marker mismatch')
          enhanced_rows = """        SingleChildScrollView(
          scrollDirection: Axis.horizontal,
          child: Row(
            children: [
              typeChip('all', 'هەموو', Icons.all_inclusive_rounded),
              typeChip('debt', 'قەرز', Icons.north_east_rounded),
              typeChip('payment', 'پارە وەرگرتنەوە', Icons.south_west_rounded),
              typeChip('system', 'مێژووی گۆڕانکاری', Icons.history_rounded),
            ],
          ),
        ),
        const SizedBox(height: 7),
        SingleChildScrollView(
          scrollDirection: Axis.horizontal,
          child: Row(
            children: [
              quickChip(FinancialQuickRange.today, 'ئەمڕۆ'),
              quickChip(FinancialQuickRange.yesterday, 'دوێنێ'),
              quickChip(FinancialQuickRange.last7Days, '7 ڕۆژ'),
              quickChip(FinancialQuickRange.last30Days, '30 ڕۆژ'),
              quickChip(FinancialQuickRange.thisMonth, 'ئەم مانگە'),
              quickChip(FinancialQuickRange.lastMonth, 'مانگی ڕابردوو'),
              quickChip(FinancialQuickRange.thisYear, 'ئەم ساڵە'),
            ],
          ),
        ),
        const SizedBox(height: 9),
        Row("""
          tools = tools.replace(type_row, enhanced_rows, 1)
          text = text[:tools_start] + tools + text[tools_end:]

          summary_start = text.index('  Widget _buildFinancialRangeSummary(')
          summary_end = text.index('  Widget _buildChatSummaryValue(', summary_start)
          new_summary = """  Widget _buildFinancialRangeSummary(
    FinancialRangeSummary summary,
    bool isDark,
  ) {
    final netColor = summary.net > 0 ? Colors.red : Colors.green;
    final closingColor =
        summary.closingBalance > 0 ? Colors.red : Colors.green;
    return Container(
      width: double.infinity,
      padding: const EdgeInsets.fromLTRB(10, 9, 10, 10),
      decoration: BoxDecoration(
        color: AppColors.primary.withValues(alpha: isDark ? 0.08 : 0.045),
        borderRadius: BorderRadius.circular(13),
        border: Border.all(
          color: AppColors.primary.withValues(alpha: 0.16),
        ),
      ),
      child: Column(
        crossAxisAlignment: CrossAxisAlignment.stretch,
        children: [
          Row(
            children: [
              const Icon(
                Icons.date_range_rounded,
                size: 16,
                color: AppColors.primary,
              ),
              const SizedBox(width: 6),
              const Expanded(
                child: Text(
                  'پوختەی مەودای هەڵبژێردراو',
                  style: TextStyle(
                    fontSize: 11,
                    fontWeight: FontWeight.w800,
                    color: AppColors.primary,
                  ),
                ),
              ),
              Text(
                '${summary.transactionCount} مامەڵە',
                style: TextStyle(
                  fontSize: 9.5,
                  fontWeight: FontWeight.w700,
                  color: isDark
                      ? AppDarkColors.textSecondary
                      : const Color(0xFF667085),
                ),
              ),
            ],
          ),
          const SizedBox(height: 8),
          Row(
            children: [
              _buildChatSummaryValue(
                label: 'باڵانسی سەرەتا',
                value: summary.openingBalance,
                color: AppColors.primary,
                isDark: isDark,
              ),
              const SizedBox(width: 6),
              _buildChatSummaryValue(
                label: 'باڵانسی کۆتایی',
                value: summary.closingBalance,
                color: closingColor,
                isDark: isDark,
              ),
            ],
          ),
          const SizedBox(height: 6),
          Row(
            children: [
              _buildChatSummaryValue(
                label: 'قەرزی نوێ',
                value: summary.debtTotal,
                color: Colors.orange,
                isDark: isDark,
              ),
              const SizedBox(width: 6),
              _buildChatSummaryValue(
                label: 'پارەدانەوە',
                value: summary.paymentTotal,
                color: Colors.green,
                isDark: isDark,
              ),
              const SizedBox(width: 6),
              _buildChatSummaryValue(
                label: 'گۆڕانی خالص',
                value: summary.net,
                color: netColor,
                isDark: isDark,
              ),
            ],
          ),
          const SizedBox(height: 6),
          Text(
            '${summary.debtCount} قەرز • ${summary.paymentCount} پارەدانەوە',
            textAlign: TextAlign.center,
            style: TextStyle(
              fontSize: 9.5,
              fontWeight: FontWeight.w600,
              color: isDark
                  ? AppDarkColors.textSecondary
                  : const Color(0xFF98A2B3),
            ),
          ),
        ],
      ),
    );
  }

"""
          text = text[:summary_start] + new_summary + text[summary_end:]
          path.write_text(text)
          PY

      - name: Commit source patch and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/shared/user_profile_screen.dart
          git rm .github/workflows/apply-financial-quick-range-ui.yml
          git commit -m "feat(user): add quick financial ranges and opening closing balances"
          git push origin HEAD:user-source
