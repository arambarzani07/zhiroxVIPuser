name: Apply Financial Quick Range UI

on:
  push:
    branches:
      - user-source
    paths:
      - .github/workflows/apply-financial-quick-range-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: user-source
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/apply_financial_quick_range_ui_patch.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/shared/user_profile_screen.dart
          git rm scripts/apply_financial_quick_range_ui_patch.py
          git rm .github/workflows/apply-financial-quick-range-ui.yml
          git commit -m "feat(user): add quick financial ranges and opening closing balances"
          git push origin HEAD:user-source
