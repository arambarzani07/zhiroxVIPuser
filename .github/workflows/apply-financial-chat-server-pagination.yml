name: Apply Financial Chat Server Pagination

on:
  push:
    branches: [owner-source]
    paths:
      - '.github/workflows/apply-financial-chat-server-pagination.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Patch owner-source
        run: |
          set -euo pipefail
          cp scripts/apply_financial_chat_server_pagination.py /tmp/apply_financial_chat_server_pagination.py
          python3 scripts/apply_financial_chat_server_pagination.py
          git add lib/services/pb_service.dart lib/screens/shared/user_profile_screen.dart scripts/verify_online_only.py
          if ! git diff --cached --quiet; then
            git commit -m 'Paginate Financial Chat from server'
            git push origin owner-source
          fi

      - name: Patch user-source
        run: |
          set -euo pipefail
          git reset --hard
          git clean -fd
          git fetch origin user-source
          git checkout -B user-source origin/user-source
          cp /tmp/apply_financial_chat_server_pagination.py scripts/.apply_financial_chat_server_pagination.tmp.py
          REPO_ROOT="$PWD" python3 scripts/.apply_financial_chat_server_pagination.tmp.py
          rm -f scripts/.apply_financial_chat_server_pagination.tmp.py
          git add lib/services/pb_service.dart lib/screens/shared/user_profile_screen.dart scripts/verify_online_only.py
          if ! git diff --cached --quiet; then
            git commit -m 'Paginate Financial Chat from server'
            git push origin user-source
          fi
