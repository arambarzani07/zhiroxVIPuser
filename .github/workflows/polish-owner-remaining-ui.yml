name: Polish Owner Remaining UI

on:
  push:
    branches: [owner-source]
    paths:
      - 'scripts/polish_owner_remaining_ui.py'
      - '.github/workflows/polish-owner-remaining-ui.yml'

permissions:
  contents: write

jobs:
  polish-owner-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0

      - name: Apply Owner UI polish
        run: python3 scripts/polish_owner_remaining_ui.py

      - name: Verify changed Dart files are formatted
        run: |
          git diff --check

      - name: Commit polished Owner UI
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No UI changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/widgets/app_design.dart lib/screens/auth
          git commit -m "Polish remaining Owner interface states"
          git push origin HEAD:owner-source
