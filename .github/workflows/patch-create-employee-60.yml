name: Patch Create Employee 60 Permissions

on:
  push:
    branches:
      - user-source
    paths:
      - .github/workflows/patch-create-employee-60.yml
      - scripts/patch_create_employee_60.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: user-source

      - name: Patch create employee permissions
        run: python3 scripts/patch_create_employee_60.py

      - name: Verify patch
        run: |
          set -euo pipefail
          git diff --check
          test -f test/add_employee_permissions_60_test.dart
          grep -F "60 دەسەڵات بەردەستن" lib/screens/shared/add_user_screen.dart
          grep -F "PBService.updateUser(" lib/screens/shared/add_user_screen.dart
          grep -F "PBService.deleteUser(createdUser.id)" lib/screens/shared/add_user_screen.dart

      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/shared/add_user_screen.dart test/add_employee_permissions_60_test.dart
          git commit -m "Expose all 60 permissions when creating employees"
          git push origin HEAD:user-source
