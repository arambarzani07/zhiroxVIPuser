name: Generate General Payment Migration Name

on:
  push:
    branches: [general-payment-outbound-sync-20260925]

permissions:
  contents: read

concurrency:
  group: general-payment-migration-name-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Generate migration name
        shell: bash
        run: |
          set -euo pipefail
          supabase migration new general_payment_outbound_sync
          generated="$(ls -1t supabase/migrations/*_general_payment_outbound_sync.sql | head -n 1)"
          echo "GENERATED_MIGRATION=$generated"
