name: Patch Lazy Tabs Once

on:
  push:
    branches: [owner-source]
    paths:
      - '.github/workflows/patch-lazy-tabs-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0
      - name: Patch lazy tabs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          d=lambda s: base64.b64decode(s).decode()
          p=Path('lib/screens/admin/admin_dashboard.dart')
          t=p.read_text()
          old=d('ICBpbnQgX2N1cnJlbnRJbmRleCA9IDA7CiAgTWFwPFN0cmluZywgZHluYW1pYz4gX3N0YXRzID0ge307')
          new=d('ICBpbnQgX2N1cnJlbnRJbmRleCA9IDA7CiAgZmluYWwgU2V0PGludD4gX3Zpc2l0ZWRUYWJzID0gPGludD57MH07CiAgTWFwPFN0cmluZywgZHluYW1pYz4gX3N0YXRzID0ge307')
          assert old in t
          t=t.replace(old,new,1)
          old=d('ICAgICAgYm9keTogQW5pbWF0ZWRTd2l0Y2hlcigKICAgICAgICBkdXJhdGlvbjogY29uc3QgRHVyYXRpb24obWlsbGlzZWNvbmRzOiAzMDApLAogICAgICAgIHN3aXRjaEluQ3VydmU6IEN1cnZlcy5lYXNlT3V0LAogICAgICAgIHN3aXRjaE91dEN1cnZlOiBDdXJ2ZXMuZWFzZUluLAogICAgICAgIGNoaWxkOiBzY3JlZW5zW19jdXJyZW50SW5kZXhdLAogICAgICApLA==')
          new=d('')
          assert old in t
          t=t.replace(old,new,1)
          old=d('ICAgICAgb25UYXA6ICgpIHsKICAgICAgICBpZiAoX2N1cnJlbnRJbmRleCA9PSBpbmRleCkgcmV0dXJuOwogICAgICAgIHNldFN0YXRlKCgpID0+IF9jdXJyZW50SW5kZXggPSBpbmRleCk7CiAgICAgICAgaWYgKGluZGV4ID09IDApIHVuYXdhaXRlZChfbG9hZFN0YXRzKCkpOwogICAgICB9LA==')
          new=d('ICAgICAgb25UYXA6ICgpIHsKICAgICAgICBpZiAoX2N1cnJlbnRJbmRleCA9PSBpbmRleCkgcmV0dXJuOwogICAgICAgIHNldFN0YXRlKCgpIHsKICAgICAgICAgIF92aXNpdGVkVGFicy5hZGQoaW5kZXgpOwogICAgICAgICAgX2N1cnJlbnRJbmRleCA9IGluZGV4OwogICAgICAgIH0pOwogICAgICAgIGlmIChpbmRleCA9PSAwKSB1bmF3YWl0ZWQoX2xvYWRTdGF0cygpKTsKICAgICAgfSw=')
          assert old in t
          t=t.replace(old,new,1)
          assert 'body: AnimatedSwitcher(' not in t
          p.write_text(t)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/admin/admin_dashboard.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Preserve admin dashboard tabs lazily'
          git push origin owner-source
