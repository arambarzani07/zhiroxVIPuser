name: Employee UI Redesign Once
'on':
  push:
    branches:
      - owner-source
    paths:
      - .github/workflows/employee-ui-redesign-once.yml

permissions:
  contents: write

jobs:
  patch-both:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Patch Owner employee UI
        run: |
          python scripts/employee_ui_redesign.py
          git add lib/screens/shared/user_list_screen.dart lib/screens/shared/user_profile_screen.dart
          git commit -m "Organize employee list and profile UI"
          git push origin owner-source
      - name: Patch User employee UI
        run: |
          cp scripts/employee_ui_redesign.py /tmp/employee_ui_redesign.py
          git fetch origin user-source
          git checkout user-source
          python /tmp/employee_ui_redesign.py
          git add lib/screens/shared/user_list_screen.dart lib/screens/shared/user_profile_screen.dart
          git commit -m "Organize employee list and profile UI"
          git push origin user-source
