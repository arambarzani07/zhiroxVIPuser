name: Customer Push Portal Pages

on:
  push:
    branches:
      - user-source
    paths:
      - 'customer-push-web/**'
      - 'supabase/functions/customer-push/**'
      - 'supabase/functions/customer-push-admin/**'
      - 'supabase/migrations/*customer_push*'
      - 'lib/services/customer_push_service.dart'
      - 'lib/widgets/customer_push_card.dart'
      - 'lib/screens/admin/admin_notifications_screen.dart'
      - 'scripts/verify_customer_push.py'
      - '.github/workflows/customer-push-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: customer-push-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user-source
        uses: actions/checkout@v6

      - name: Verify customer push policy
        run: python3 scripts/verify_customer_push.py

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user-source
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload customer portal
        uses: actions/upload-pages-artifact@v4
        with:
          path: customer-push-web

      - name: Deploy customer portal
        id: deployment
        uses: actions/deploy-pages@v4
