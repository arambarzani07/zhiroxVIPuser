name: Customer Push Portal Pages

on:
  push:
    branches:
      - user-source
    paths:
      - 'customer-push-web/**'
      - '.github/workflows/customer-push-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: customer-push-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user-source
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload customer portal
        uses: actions/upload-pages-artifact@v4
        with:
          path: customer-push-web

      - name: Deploy customer portal
        id: deployment
        uses: actions/deploy-pages@v4
