name: Financial Chat Phase 5 Once

on:
  push:
    branches:
      - owner-source
    paths:
      - '.github/workflows/financial-chat-phase5-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0
      - name: Preserve migration helper
        run: cp scripts/financial_chat_phase5.py /tmp/financial_chat_phase5.py
      - name: Patch Owner source
        run: |
          python3 /tmp/financial_chat_phase5.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/shared/user_profile_screen.dart lib/screens/shared/user_list_screen.dart scripts/verify_online_only.py
          if ! git diff --cached --quiet; then
            git commit -m 'Make Financial Chat the customer transaction hub'
            git push origin HEAD:owner-source
          fi
      - name: Patch User source
        run: |
          git fetch origin user-source
          git checkout -B user-source origin/user-source
          python3 /tmp/financial_chat_phase5.py
          git add lib/screens/shared/user_profile_screen.dart lib/screens/shared/user_list_screen.dart scripts/verify_online_only.py
          if ! git diff --cached --quiet; then
            git commit -m 'Make Financial Chat the customer transaction hub'
            git push origin HEAD:user-source
          fi
