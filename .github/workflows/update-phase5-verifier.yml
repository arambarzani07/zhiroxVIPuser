name: Update Phase 5 Verifier

on:
  push:
    paths:
      - '.github/workflows/update-phase5-verifier.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp scripts/update_phase5_verifier.py /tmp/update_phase5_verifier.py
      - name: Update Owner verifier
        run: |
          python /tmp/update_phase5_verifier.py
          git add scripts/verify_online_only.py
          git commit -m "Verify Financial Chat quick payment presets"
          git push origin HEAD:owner-source
      - name: Update User verifier
        run: |
          git fetch origin user-source
          git checkout -B user-source origin/user-source
          python /tmp/update_phase5_verifier.py
          git add scripts/verify_online_only.py
          git commit -m "Verify Financial Chat quick payment presets"
          git push origin HEAD:user-source
