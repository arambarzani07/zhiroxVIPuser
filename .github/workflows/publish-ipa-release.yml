name: Publish IPA Release

on:
  workflow_run:
    workflows: ["iOS Unsigned IPA"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-ipa-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download IPA artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
            gh run download "$RUN_ID" \
              --repo "${{ github.repository }}" \
              --name zhiroxVIPuser-unsigned-ipa \
              --dir out
          else
            ARTIFACT_ID="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${{ github.repository }}/actions/artifacts?name=zhiroxVIPuser-unsigned-ipa&per_page=20" \
              --jq '.artifacts[] | select(.expired == false) | .id' | head -n 1)"
            test -n "$ARTIFACT_ID"
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" \
              > out/artifact.zip
            unzip -o out/artifact.zip -d out
          fi

          test -f out/zhiroxVIPuser-unsigned.ipa

      - name: Create or update public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view safari-download --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload safari-download out/zhiroxVIPuser-unsigned.ipa \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create safari-download out/zhiroxVIPuser-unsigned.ipa \
              --repo "${{ github.repository }}" \
              --target main \
              --title "ZHIROX Admin — Safari Download" \
              --notes "Latest unsigned iOS IPA for the Admin build. Sign before installing on a physical device."
          fi

      - name: Print direct Safari URL
        run: |
          echo "https://github.com/${{ github.repository }}/releases/download/safari-download/zhiroxVIPuser-unsigned.ipa"
