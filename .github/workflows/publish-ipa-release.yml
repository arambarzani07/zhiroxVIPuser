name: Publish IPA Release

on:
  workflow_run:
    workflows: ["iOS Unsigned IPA"]
    types: [completed]
  workflow_dispatch:
    inputs:
      edition:
        description: App edition to publish
        required: true
        type: choice
        options:
          - user
          - owner

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'user-source' ||
        github.event.workflow_run.head_branch == 'owner-source'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release metadata
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EDITION="${{ inputs.edition }}"
          else
            case "${{ github.event.workflow_run.head_branch }}" in
              owner-source) EDITION="owner" ;;
              user-source) EDITION="user" ;;
              *) echo "Unsupported source branch" >&2; exit 1 ;;
            esac
          fi

          case "$EDITION" in
            owner)
              echo "ARTIFACT_NAME=zhirox-owner-unsigned-ipa" >> "$GITHUB_ENV"
              echo "IPA_FILE=ZHIROX-Owner.ipa" >> "$GITHUB_ENV"
              echo "LEGACY_IPA_FILE=zhirox-owner-unsigned.ipa" >> "$GITHUB_ENV"
              echo "TARGET_BRANCH=owner-source" >> "$GITHUB_ENV"
              echo "RELEASE_TAG=owner-safari-download" >> "$GITHUB_ENV"
              echo "RELEASE_TITLE=ZHIROX Owner — Safari Download" >> "$GITHUB_ENV"
              echo "RELEASE_NOTES=Independent public Owner app. Bundle ID: com.karoxghafoor.zhirox.owner. Admin creation remains protected by System Owner authentication. Unsigned IPA; sign before installation." >> "$GITHUB_ENV"
              ;;
            user)
              echo "ARTIFACT_NAME=zhiroxVIPuser-unsigned-ipa" >> "$GITHUB_ENV"
              echo "IPA_FILE=ZHIROX-User.ipa" >> "$GITHUB_ENV"
              echo "LEGACY_IPA_FILE=zhiroxVIPuser-unsigned.ipa" >> "$GITHUB_ENV"
              echo "TARGET_BRANCH=user-source" >> "$GITHUB_ENV"
              echo "RELEASE_TAG=safari-download" >> "$GITHUB_ENV"
              echo "RELEASE_TITLE=ZHIROX User — Safari Download" >> "$GITHUB_ENV"
              echo "RELEASE_NOTES=Independent public User app. Bundle ID: com.karoxghafoor.zhirox.user. Admin account creation is controlled by the system owner. Unsigned IPA; sign before installation." >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported edition: $EDITION" >&2
              exit 1
              ;;
          esac

      - name: Download matching IPA artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
            gh run download "$RUN_ID" \
              --repo "${{ github.repository }}" \
              --name "$ARTIFACT_NAME" \
              --dir out
          else
            ARTIFACT_ID="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${{ github.repository }}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=50" \
              --jq "first(.artifacts[] | select(.expired == false and .workflow_run.head_branch == \"${TARGET_BRANCH}\") | .id)")"
            test -n "$ARTIFACT_ID"
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" \
              > out/artifact.zip
            unzip -o out/artifact.zip -d out
          fi

          test -f "out/${IPA_FILE}"

      - name: Create or update public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "out/${IPA_FILE}" \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create "$RELEASE_TAG" "out/${IPA_FILE}" \
              --repo "${{ github.repository }}" \
              --target "$TARGET_BRANCH" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
          fi

          gh release edit "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES"

      - name: Remove legacy IPA alias
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --json assets \
              --jq '.assets[].name' | grep -Fxq "$LEGACY_IPA_FILE"; then
            gh release delete-asset "$RELEASE_TAG" "$LEGACY_IPA_FILE" \
              --repo "${{ github.repository }}" --yes
          fi

      - name: Print direct Safari URL
        run: |
          echo "https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${IPA_FILE}"
