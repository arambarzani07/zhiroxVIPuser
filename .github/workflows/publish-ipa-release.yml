name: Publish IPA Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-ipa-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download IPA artifact from fixed iOS build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          gh run download 34399840674 \
            --repo "${{ github.repository }}" \
            --name zhiroxVIPuser-unsigned-ipa \
            --dir out
          test -f out/zhiroxVIPuser-unsigned.ipa

      - name: Create or update public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view safari-download --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload safari-download out/zhiroxVIPuser-unsigned.ipa \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create safari-download out/zhiroxVIPuser-unsigned.ipa \
              --repo "${{ github.repository }}" \
              --target main \
              --title "ZHIROX VIP User — Safari Download" \
              --notes "Unsigned iOS IPA. Sign before installing on a physical device."
          fi

      - name: Print direct Safari URL
        run: |
          echo "https://github.com/${{ github.repository }}/releases/download/safari-download/zhiroxVIPuser-unsigned.ipa"
