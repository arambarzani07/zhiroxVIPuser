name: Audit40 Profile Verifier Check

on:
  push:
    branches: [audit40-profile-verifier-20260925]

permissions:
  contents: read

concurrency:
  group: audit40-profile-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify online-only policy
        run: python3 scripts/verify_online_only.py
      - name: Verify Audit40 source contracts
        run: python3 scripts/verify_audit40_contracts.py
