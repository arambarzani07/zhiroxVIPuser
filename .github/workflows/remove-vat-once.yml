name: Remove VAT once

on:
  push:
    paths:
      - .github/workflows/remove-vat-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'Start VAT removal' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Remove VAT and keep discount-only receipts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          screen_path = Path('lib/screens/admin/receipt_settings_screen.dart')
          screen = screen_path.read_text()
          screen = replace_once(screen, '  final _vatController = TextEditingController();\n', '', 'vat controller')
          screen = replace_once(screen, '    _vatController.dispose();\n', '', 'vat dispose')
          screen = replace_once(screen, '        _vatController.text = settings.vatPercent.toStringAsFixed(2);\n', '', 'vat load')
          screen = replace_once(screen, '      vatPercent: double.tryParse(_vatController.text.trim()) ?? 0,\n', '      vatPercent: 0,\n', 'vat draft')
          screen = replace_once(screen, "                      _section('باج، داشکاندن و پارەدان', Icons.calculate_outlined, [\n", "                      _section('داشکاندن و پارەدان', Icons.calculate_outlined, [\n", 'section title')
          vat_field = re.compile(
              r"\s{24}TextFormField\(\n"
              r"\s{26}controller: _vatController,\n"
              r".*?"
              r"\s{24}\),\n"
              r"\s{24}_gap\(\),\n",
              re.S,
          )
          screen, count = vat_field.subn('', screen, count=1)
          if count != 1:
              raise SystemExit(f'vat field: expected 1 match, got {count}')
          screen = replace_once(screen, "'ژمارەی تۆمار / باج'", "'ژمارەی تۆمار'", 'registration label')
          screen = replace_once(screen, "hint: 'لق=دۆرێ\\nژمارەی باج=12345'", "hint: 'لق=دۆرێ\\nکۆدی فرۆشگا=12345'", 'custom field hint')
          screen_path.write_text(screen)

          receipt_path = Path('lib/services/official_receipt_service.dart')
          receipt = receipt_path.read_text()
          receipt = replace_once(receipt, "      'vat': ['باج / VAT', 'الضريبة / VAT', 'VAT'],\n", '', 'vat label')
          vat_render = re.compile(
              r"\s{16}if \(settings\.vatPercent > 0\)\n"
              r"\s{18}infoLine\(\n"
              r"\s{20}_label\('vat', language\),\n"
              r"\s{20}'\$\{settings\.vatPercent\.toStringAsFixed\(2\)\}%',\n"
              r"\s{20}ltr: true,\n"
              r"\s{18}\),\n"
          )
          receipt, count = vat_render.subn('', receipt, count=1)
          if count != 1:
              raise SystemExit(f'vat render: expected 1 match, got {count}')
          receipt_path.write_text(receipt)

          migration_sql = (
              "update public.market_receipt_settings\n"
              "set vat_percent = 0\n"
              "where vat_percent <> 0;\n\n"
              "alter table public.market_receipt_settings\n"
              "  alter column vat_percent set default 0;\n\n"
              "alter table public.market_receipt_settings\n"
              "  drop constraint if exists market_receipt_settings_vat_percent_check;\n\n"
              "create or replace function private.force_receipt_vat_zero()\n"
              "returns trigger\n"
              "language plpgsql\n"
              "set search_path to 'pg_catalog'\n"
              "as $function$\n"
              "begin\n"
              "  new.vat_percent := 0;\n"
              "  return new;\n"
              "end;\n"
              "$function$;\n\n"
              "drop trigger if exists trg_market_receipt_settings_vat_zero\n"
              "on public.market_receipt_settings;\n\n"
              "create trigger trg_market_receipt_settings_vat_zero\n"
              "before insert or update of vat_percent on public.market_receipt_settings\n"
              "for each row execute function private.force_receipt_vat_zero();\n\n"
              "alter table public.market_receipt_settings\n"
              "  add constraint market_receipt_settings_vat_percent_check\n"
              "  check (vat_percent = 0);\n"
          )
          Path('supabase/migrations/20260912061000_remove_vat_from_receipts.sql').write_text(migration_sql)
          Path('.github/workflows/remove-vat-once.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove VAT from receipt system"
          git push origin "HEAD:${GITHUB_REF_NAME}"
