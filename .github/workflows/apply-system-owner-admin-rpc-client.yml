name: Apply System Owner Admin RPC Client

on:
  push:
    branches: [owner-source]
    paths:
      - 'scripts/apply_system_owner_admin_rpc_client.py'
      - '.github/workflows/apply-system-owner-admin-rpc-client.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout owner-source
        uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0

      - name: Preserve patch helper
        run: cp scripts/apply_system_owner_admin_rpc_client.py /tmp/apply_system_owner_admin_rpc_client.py

      - name: Patch Owner
        run: python scripts/apply_system_owner_admin_rpc_client.py

      - name: Commit Owner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/pb_service.dart scripts/verify_online_only.py
          if ! git diff --cached --quiet; then
            git commit -m 'Use set-based System Owner admin RPCs'
            git push origin HEAD:owner-source
          fi

      - name: Checkout user-source
        run: |
          git fetch origin user-source
          git checkout -B user-source origin/user-source

      - name: Patch User
        run: python /tmp/apply_system_owner_admin_rpc_client.py

      - name: Commit User
        run: |
          git add lib/services/pb_service.dart scripts/verify_online_only.py
          if ! git diff --cached --quiet; then
            git commit -m 'Use set-based System Owner admin RPCs'
            git push origin HEAD:user-source
          fi
