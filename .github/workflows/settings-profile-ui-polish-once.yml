name: Settings Profile UI Polish Once
'on':
  push:
    branches:
      - owner-source
    paths:
      - .github/workflows/settings-profile-ui-polish-once.yml

permissions:
  contents: write

jobs:
  patch-both:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Patch Owner settings and profile UI
        run: |
          python scripts/settings_profile_ui_polish.py
          git add lib/screens/admin/admin_dashboard.dart lib/screens/shared/user_profile_screen.dart
          git commit -m "Polish settings and profile actions"
          git push origin owner-source
      - name: Patch User settings and profile UI
        run: |
          cp scripts/settings_profile_ui_polish.py /tmp/settings_profile_ui_polish.py
          git fetch origin user-source
          git checkout user-source
          python /tmp/settings_profile_ui_polish.py
          git add lib/screens/admin/admin_dashboard.dart lib/screens/shared/user_profile_screen.dart
          git commit -m "Polish settings and profile actions"
          git push origin user-source
