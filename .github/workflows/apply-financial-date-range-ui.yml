name: Apply financial date range UI patch

on:
  push:
    branches: [user-source]
    paths:
      - .github/workflows/apply-financial-date-range-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: user-source
          fetch-depth: 0

      - name: Apply bounded source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/shared/user_profile_screen.dart')
          text = path.read_text()

          replacements = [
              (
                  "import 'package:zhirox/services/pb_service.dart';\nimport 'package:zhirox/services/pdf_service.dart';",
                  "import 'package:zhirox/services/pb_service.dart';\nimport 'package:zhirox/services/financial_date_range_summary.dart';\nimport 'package:zhirox/services/pdf_service.dart';",
              ),
              (
                  """      if (range != null) {\n        final day = DateTime(item.date.year, item.date.month, item.date.day);\n        final start = DateTime(\n          range.start.year,\n          range.start.month,\n          range.start.day,\n        );\n        final end = DateTime(range.end.year, range.end.month, range.end.day);\n        if (day.isBefore(start) || day.isAfter(end)) return false;\n      }""",
                  """      if (range != null &&\n          !isWithinFinancialDateRange(\n            item.date,\n            start: range.start,\n            end: range.end,\n          )) {\n        return false;\n      }""",
              ),
              (
                  """    if (!mounted || picked == null) return;\n    setState(() => _financialDateRange = picked);\n    unawaited(_hydrateFinancialHistoryForFilters());""",
                  """    if (!mounted || picked == null) return;\n    setState(() {\n      _financialDateRange = picked;\n      // A date range means \"show the customer's financial activity in this\n      // period\". Reset a previous single-kind chip so debt and payment rows\n      // are both visible immediately.\n      _financialTypeFilter = 'all';\n    });\n    unawaited(_hydrateFinancialHistoryForFilters());""",
              ),
              (
                  """    final allTimelineItems = _buildTimelineItems();\n    final timelineItems = _filterFinancialTimeline(allTimelineItems);\n    // A partial newest-page window has no trustworthy opening ledger balance.""",
                  """    final allTimelineItems = _buildTimelineItems();\n    final timelineItems = _filterFinancialTimeline(allTimelineItems);\n    final selectedRange = _financialDateRange;\n    final rangeSummary = selectedRange == null\n        ? null\n        : summarizeFinancialDateRange(\n            entries: allTimelineItems.map(\n              (item) => FinancialRangeEntry(\n                kind: item.kind,\n                amount: item.isSystem\n                    ? 0\n                    : item.record.getDoubleValue('amount'),\n                date: item.date,\n              ),\n            ),\n            start: selectedRange.start,\n            end: selectedRange.end,\n          );\n    // A partial newest-page window has no trustworthy opening ledger balance.""",
              ),
              (
                  """                  _buildFinancialChatTools(\n                    totalDebt: totalDebt,\n                    totalRemaining: totalRemaining,\n                    totalPaid: totalPaid,\n                  ),\n                ],""",
                  """                  _buildFinancialChatTools(\n                    totalDebt: totalDebt,\n                    totalRemaining: totalRemaining,\n                    totalPaid: totalPaid,\n                  ),\n                  if (rangeSummary != null &&\n                      !waitingForFullFilterHistory) ...[\n                    const SizedBox(height: 10),\n                    _buildFinancialRangeSummary(rangeSummary, isDark),\n                  ],\n                ],""",
              ),
              (
                  """  Widget _buildChatSummaryValue({\n    required String label,""",
                  """  Widget _buildFinancialRangeSummary(\n    FinancialRangeSummary summary,\n    bool isDark,\n  ) {\n    final netColor = summary.net > 0 ? Colors.red : Colors.green;\n    return Container(\n      width: double.infinity,\n      padding: const EdgeInsets.fromLTRB(10, 9, 10, 10),\n      decoration: BoxDecoration(\n        color: AppColors.primary.withValues(alpha: isDark ? 0.08 : 0.045),\n        borderRadius: BorderRadius.circular(13),\n        border: Border.all(\n          color: AppColors.primary.withValues(alpha: 0.16),\n        ),\n      ),\n      child: Column(\n        crossAxisAlignment: CrossAxisAlignment.stretch,\n        children: [\n          Row(\n            children: [\n              const Icon(\n                Icons.date_range_rounded,\n                size: 16,\n                color: AppColors.primary,\n              ),\n              const SizedBox(width: 6),\n              const Expanded(\n                child: Text(\n                  'پوختەی مەودای هەڵبژێردراو',\n                  style: TextStyle(\n                    fontSize: 11,\n                    fontWeight: FontWeight.w800,\n                    color: AppColors.primary,\n                  ),\n                ),\n              ),\n              Text(\n                '${summary.transactionCount} مامەڵە',\n                style: TextStyle(\n                  fontSize: 9.5,\n                  fontWeight: FontWeight.w700,\n                  color: isDark\n                      ? AppDarkColors.textSecondary\n                      : const Color(0xFF667085),\n                ),\n              ),\n            ],\n          ),\n          const SizedBox(height: 8),\n          Row(\n            children: [\n              _buildChatSummaryValue(\n                label: 'قەرز',\n                value: summary.debtTotal,\n                color: Colors.orange,\n                isDark: isDark,\n              ),\n              const SizedBox(width: 6),\n              _buildChatSummaryValue(\n                label: 'پارەدانەوە',\n                value: summary.paymentTotal,\n                color: Colors.green,\n                isDark: isDark,\n              ),\n              const SizedBox(width: 6),\n              _buildChatSummaryValue(\n                label: 'جیاوازی',\n                value: summary.net,\n                color: netColor,\n                isDark: isDark,\n              ),\n            ],\n          ),\n          const SizedBox(height: 6),\n          Text(\n            '${summary.debtCount} قەرز • ${summary.paymentCount} پارەدانەوە',\n            textAlign: TextAlign.center,\n            style: TextStyle(\n              fontSize: 9.5,\n              fontWeight: FontWeight.w600,\n              color: isDark\n                  ? AppDarkColors.textSecondary\n                  : const Color(0xFF98A2B3),\n            ),\n          ),\n        ],\n      ),\n    );\n  }\n\n  Widget _buildChatSummaryValue({\n    required String label,""",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one source match, got {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit source patch and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/shared/user_profile_screen.dart
          git rm .github/workflows/apply-financial-date-range-ui.yml
          git commit -m "feat(user): show debt and payments for selected date range"
          git push origin HEAD:user-source
