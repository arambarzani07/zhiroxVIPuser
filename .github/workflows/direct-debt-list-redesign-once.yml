name: Direct Debt List Redesign Once
'on':
  push:
    branches:
      - owner-source
    paths:
      - .github/workflows/direct-debt-list-redesign-once.yml

permissions:
  contents: write

jobs:
  patch-both:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0
      - name: Patch Owner debt list
        run: |
          python3 scripts/debt_list_direct_rows_patch.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/shared/debt_list_screen.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Replace grouped debt modal with direct debt rows'
            git push origin owner-source
          fi
          cp scripts/debt_list_direct_rows_patch.py /tmp/debt_list_direct_rows_patch.py
      - name: Patch User debt list
        run: |
          git fetch origin user-source
          git checkout -B user-source origin/user-source
          python3 /tmp/debt_list_direct_rows_patch.py
          git diff --check
          git add lib/screens/shared/debt_list_screen.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Replace grouped debt modal with direct debt rows'
            git push origin user-source
          fi
