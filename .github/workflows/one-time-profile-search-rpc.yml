name: One-time profile search RPC
on:
  push:
    branches: [owner-source]
    paths:
      - '.github/workflows/one-time-profile-search-rpc.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0
      - name: Route profile search through RPC
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('lib/services/pb_service.dart')
          text = path.read_text()
          start = text.index('    if (search != null && search.isNotEmpty) {')
          end = text.index('    await ensureInitialized();', start)
          lines = [
            '    if (search != null && search.isNotEmpty) {',
            '      await ensureInitialized();',
            '      const pageSize = 100;',
            '      var offset = 0;',
            '      final users = <RecordModel>[];',
            '      while (true) {',
            "        final raw = await client.rpc('search_profiles_page', params: {",
            "          'p_search': search,",
            "          'p_role': role,",
            "          'p_admin_id': adminId,",
            "          'p_approved': approved,",
            "          'p_limit': pageSize,",
            "          'p_offset': offset,",
            '        });',
            "        if (raw is! List) throw const FormatException('invalid profile search');",
            '        for (final item in raw) {',
            '          if (item is Map) {',
            '            users.add(_profileRecord(Map<String, dynamic>.from(item)));',
            '          }',
            '        }',
            '        if (raw.length < pageSize) break;',
            '        offset += pageSize;',
            '      }',
            '      return users;',
            '    }',
            '',
          ]
          replacement = '\n'.join(lines)
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-profile-search-rpc.yml
          git add lib/services/pb_service.dart
          git diff --cached --check
          git commit -m 'perf(owner): page profile search through RPC'
          git push origin owner-source
