name: Add User Validation Fix Once
'on':
  push:
    branches:
      - owner-source
    paths:
      - .github/workflows/add-user-validation-fix-once.yml

permissions:
  contents: write

jobs:
  patch-both:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Patch Owner validation
        run: |
          python scripts/add_user_validation_fix.py
          git add lib/screens/shared/add_user_screen.dart
          git commit -m "Harden add user form validation"
          git push origin owner-source
      - name: Patch User validation
        run: |
          cp scripts/add_user_validation_fix.py /tmp/add_user_validation_fix.py
          git fetch origin user-source
          git checkout user-source
          python /tmp/add_user_validation_fix.py
          git add lib/screens/shared/add_user_screen.dart
          git commit -m "Harden add user form validation"
          git push origin user-source
