name: New DB Recovery Check

on:
  push:
    branches: [newdb-user]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newdb-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Preserve ZHIROX User app identity
        run: |
          sed -i '' "s/com.karoxghafoor.zhirox/com.karoxghafoor.zhirox.user/g" ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ZHIROX User" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName zhirox_user" ios/Runner/Info.plist

      - name: Prepare iOS 15 deployment target
        run: |
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '15.0'/" ios/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'/IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'/" ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Wire CocoaPods xcconfig
        run: |
          printf '%s\n%s\n' '#include? "Pods/Target Support Files/Pods-Runner/Pods-Runner.debug.xcconfig"' '#include "Generated.xcconfig"' > ios/Flutter/Debug.xcconfig
          printf '%s\n%s\n' '#include? "Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"' '#include "Generated.xcconfig"' > ios/Flutter/Release.xcconfig

      - name: Build recovery iOS app
        run: flutter build ios --release --no-codesign --dart-define=ZHIROX_APP_EDITION=user

      - name: Verify recovery app identity
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ios/iphoneos/Runner.app/Info.plist | grep -Fx "com.karoxghafoor.zhirox.user"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' build/ios/iphoneos/Runner.app/Info.plist | grep -Fx "ZHIROX User"

      - name: Package recovery IPA
        run: |
          set -euo pipefail
          rm -rf Payload ZHIROX-User-Recovery.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          find Payload -type d -name _CodeSignature -prune -exec rm -rf {} \;
          find Payload -type f -name CodeResources -delete
          find Payload -type f -name embedded.mobileprovision -delete
          xattr -cr Payload || true
          /usr/bin/zip -qry ZHIROX-User-Recovery.ipa Payload
          unzip -t ZHIROX-User-Recovery.ipa

      - name: Upload recovery IPA
        uses: actions/upload-artifact@v4
        with:
          name: zhirox-user-recovery-ipa
          path: ZHIROX-User-Recovery.ipa
          if-no-files-found: error
          retention-days: 7
