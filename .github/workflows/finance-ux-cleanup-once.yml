          old = "                                setSheetState(() {\n                                  selectedDebtId = value;\n                                  localError = null;\n                                });"
          new = "                                setSheetState(() {\n                                  selectedDebtId = value;\n                                  localError = null;\n                                  reviewMode = false;\n                                });"
          assert old in s
          s = s.replace(old, new, 1)
          old = "onChanged: (_) => setSheetState(() => localError = null),"
          new = "onChanged: (_) => setSheetState(() {\n                        localError = null;\n                        reviewMode = false;\n                      }),"
          assert old in s
          s = s.replace(old, new, 1)
          marker = "                    const SizedBox(height: 10),\n                    if (showNote)\n                      TextField("
          insert = "                    if (reviewMode && typedStorageAmount > 0 && typedStorageAmount <= remainingStorage + 0.0001) ...[\n                      const SizedBox(height: 10),\n                      _buildInlineReview(isAll: isAll, debt: debt, before: remainingStorage, amount: typedStorageAmount, after: remainingAfter, allocationCount: previewAllocationCount, isDark: isDark),\n                    ],\n                    const SizedBox(height: 10),\n                    if (showNote)\n                      TextField("
          assert marker in s
          s = s.replace(marker, insert, 1)
          old_confirm = r'''                              var allocationCount = 1;
                              bool confirmed;
                              if (isAll) {
                                try {
                                  allocationCount = _customerAllocations(
                                    openDebts,
                                    storageAmount,
                                  ).length;
                                } catch (_) {
                                  setSheetState(() => localError =
                                      'بڕی پارەدانەوە لە کۆی ماوەی کڕیار زیاترە.');
                                  return;
                                }
                                confirmed = await _confirmCustomer(
                                  context: sheetContext,
                                  currentBalance: customerBalance,
                                  amount: storageAmount,
                                  allocationCount: allocationCount,
                                );
                              } else {
                                confirmed = await _confirmSingle(
                                  context: sheetContext,
                                  debt: debt!,
                                  storageAmount: storageAmount,
                                );
                              }
                              if (!confirmed || !sheetContext.mounted) return;

                              setSheetState(() {
                                saving = true;
                                localError = null;
                              });
'''
          new_confirm = r'''                              var allocationCount = 1;
                              if (isAll) {
                                try {
                                  allocationCount = _customerAllocations(
                                    openDebts,
                                    storageAmount,
                                  ).length;
                                } catch (_) {
                                  setSheetState(() => localError =
                                      'بڕی پارەدانەوە لە کۆی ماوەی کڕیار زیاترە.');
                                  return;
                                }
                              }
                              if (!reviewMode) {
                                FocusScope.of(sheetContext).unfocus();
                                setSheetState(() {
                                  reviewMode = true;
                                  localError = null;
                                });
                                return;
                              }
                              setSheetState(() {
                                saving = true;
                                localError = null;
                              });
'''
          assert old_confirm in s
          s = s.replace(old_confirm, new_confirm, 1)
          old_label = "                      label: Text(\n                        saving ? 'تۆمار دەکرێت...' : 'پێداچوونەوە و تۆمارکردن',\n                      ),"
          new_label = "                      label: Text(\n                        saving\n                            ? 'تۆمار دەکرێت...'\n                            : reviewMode\n                                ? 'تۆمارکردنی پارەدانەوە'\n                                : 'پێداچوونەوە',\n                      ),"
          assert old_label in s
          s = s.replace(old_label, new_label, 1)
          p.write_text(s)

          Path('.github/workflows/finance-ux-cleanup-once.yml').unlink()
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(user): simplify customer finance UX"
          git push origin HEAD:user-source
