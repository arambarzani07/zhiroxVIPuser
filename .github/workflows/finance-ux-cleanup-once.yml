name: Apply finance UX cleanup once

on:
  push:
    branches: [user-source]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: user-source
          fetch-depth: 0

      - name: Apply staged patch
        run: python3 scripts/apply_finance_ux_cleanup.py

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(user): simplify customer finance UX"
          git push origin HEAD:user-source
