name: Apply finance UX cleanup once

on:
  push:
    branches: [user-source]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: user-source
          fetch-depth: 0

      - name: Apply UX cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          helper = Path('lib/services/financial_ui_state.dart')
          helper.write_text(r'''enum FinancialPaymentStep { target, amount, review }

int countActiveFinancialFilters({
  required String query,
  required bool hasDateRange,
  required String typeFilter,
}) {
  var count = 0;
  if (query.trim().isNotEmpty) count++;
  if (hasDateRange) count++;
  final normalizedType = typeFilter.trim();
  if (normalizedType.isNotEmpty && normalizedType != 'all') count++;
  return count;
}

bool shouldExpandFinancialFilters({
  required bool requestedExpanded,
  required int activeFilterCount,
}) =>
    requestedExpanded || activeFilterCount > 0;

FinancialPaymentStep resolveFinancialPaymentStep({
  required bool targetSelected,
  required double amount,
  required double maximum,
  required bool reviewRequested,
}) {
  if (!targetSelected) return FinancialPaymentStep.target;
  final amountValid = amount.isFinite &&
      maximum.isFinite &&
      amount > 0 &&
      maximum > 0 &&
      amount <= maximum + 0.0001;
  if (!amountValid) return FinancialPaymentStep.amount;
  return reviewRequested
      ? FinancialPaymentStep.review
      : FinancialPaymentStep.amount;
}
''')

          p = Path('lib/screens/shared/user_profile_screen.dart')
          s = p.read_text()

          old = "import 'package:zhirox/services/financial_date_range_summary.dart';\n"
          new = old + "import 'package:zhirox/services/financial_ui_state.dart';\n"
          if new not in s:
              assert old in s
              s = s.replace(old, new, 1)

          old = "  String _financialTypeFilter = 'all';\n  _ProfileTimelineItem? _financialReplyTarget;"
          new = "  String _financialTypeFilter = 'all';\n  bool _financialFiltersExpanded = false;\n  _ProfileTimelineItem? _financialReplyTarget;"
          if new not in s:
              assert old in s
              s = s.replace(old, new, 1)

          old = """    setState(() {
      _financialDateRange = null;
      _financialTypeFilter = 'all';
    });
  }

  Widget _buildFinancialChatTools({"""
          new = """    setState(() {
      _financialDateRange = null;
      _financialTypeFilter = 'all';
      _financialFiltersExpanded = false;
    });
  }

  Widget _buildFinancialChatTools({"""
          assert old in s
