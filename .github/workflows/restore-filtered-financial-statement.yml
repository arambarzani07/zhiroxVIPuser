name: Restore Filtered Financial Statement

on:
  push:
    paths:
      - '.github/workflows/restore-filtered-financial-statement.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp scripts/restore_filtered_financial_statement.py /tmp/restore_filtered_financial_statement.py
      - name: Patch Owner
        run: |
          python /tmp/restore_filtered_financial_statement.py
          git add lib/screens/shared/user_profile_screen.dart
          git commit -m "Restore filtered Financial Chat statement export"
          git push origin HEAD:owner-source
      - name: Patch User
        run: |
          git fetch origin user-source
          git checkout -B user-source origin/user-source
          python /tmp/restore_filtered_financial_statement.py
          git add lib/screens/shared/user_profile_screen.dart
          git commit -m "Restore filtered Financial Chat statement export"
          git push origin HEAD:user-source
