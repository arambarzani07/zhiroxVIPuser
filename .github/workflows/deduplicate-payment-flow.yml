name: Deduplicate Payment Flow

on:
  push:
    paths:
      - '.github/workflows/deduplicate-payment-flow.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp scripts/deduplicate_payment_flow.py /tmp/deduplicate_payment_flow.py
      - name: Patch Owner
        run: |
          python /tmp/deduplicate_payment_flow.py
          git add lib/screens/shared/user_profile_screen.dart lib/screens/shared/debt_detail_screen.dart scripts/verify_online_only.py
          git commit -m "Deduplicate payment flow across financial screens"
          git push origin HEAD:owner-source
      - name: Patch User
        run: |
          git fetch origin user-source
          git checkout -B user-source origin/user-source
          python /tmp/deduplicate_payment_flow.py
          git add lib/screens/shared/user_profile_screen.dart lib/screens/shared/debt_detail_screen.dart scripts/verify_online_only.py
          git commit -m "Deduplicate payment flow across financial screens"
          git push origin HEAD:user-source
