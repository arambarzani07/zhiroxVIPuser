              "    for (final item in _items) {\n      final itemCurrency = item['currency'] as String? ?? _currency;\n      final itemTotal = (item['price'] as double) * (item['qty'] as int);\n      if (itemCurrency == 'USD') {\n        totalUSD += itemTotal;\n        if (dollarRate > 0) totalIQD += itemTotal * dollarRate;\n      } else {\n        totalIQD += itemTotal;\n        if (dollarRate > 0) totalUSD += itemTotal / dollarRate;\n      }\n    }\n\n    return Container(\n",
              "    for (final item in _items) {\n      final itemCurrency = item['currency'] as String? ?? _currency;\n      final itemTotal = (item['price'] as double) * (item['qty'] as int);\n      if (itemCurrency == 'USD') {\n        totalUSD += itemTotal;\n        if (dollarRate > 0) totalIQD += itemTotal * dollarRate;\n      } else {\n        totalIQD += itemTotal;\n        if (dollarRate > 0) totalUSD += itemTotal / dollarRate;\n      }\n    }\n    final discountIQD =\n        ((totalIQD * _discountPercent / 100) * 100).roundToDouble() / 100;\n    final grandTotalIQD = (totalIQD - discountIQD).clamp(0.0, double.infinity);\n    final discountUSD = totalUSD * _discountPercent / 100;\n    final grandTotalUSD = (totalUSD - discountUSD).clamp(0.0, double.infinity);\n\n    return Container(\n",
              'bottom totals',
          )
