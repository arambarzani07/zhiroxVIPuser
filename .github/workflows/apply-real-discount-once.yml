name: Apply real discount once

on:
  push:
    paths:
      - .github/workflows/apply-real-discount-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Start real discount rollout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply discount accounting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          def sub_once(text, pattern, repl, label):
              text, count = re.subn(pattern, repl, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text

          # ---------- AddDebtScreen: market default discount becomes real transaction math ----------
          path = Path('lib/screens/shared/add_debt_screen.dart')
          text = path.read_text()
          text = replace_once(
              text,
              "import 'package:zhirox/services/notification_service.dart';\n",
              "import 'package:zhirox/services/notification_service.dart';\nimport 'package:zhirox/services/receipt_settings_service.dart';\n",
              'receipt settings import',
          )
          text = replace_once(
              text,
              "  final _dollarRateController = TextEditingController();\n",
              "  final _dollarRateController = TextEditingController();\n  double _discountPercent = 0;\n  bool _loadingPricingPolicy = true;\n  String? _pricingPolicyError;\n",
              'discount state',
          )
          text = replace_once(
              text,
              "      _dollarRateController.text = widget.debt!\n          .getDoubleValue('dollar_rate')\n          .toString();\n",
              "      _dollarRateController.text = widget.debt!\n          .getDoubleValue('dollar_rate')\n          .toString();\n      _discountPercent = widget.debt!\n          .getDoubleValue('discount_percent')\n          .clamp(0.0, 100.0)\n          .toDouble();\n      _loadingPricingPolicy = false;\n",
              'edit discount restore',
          )
          text = replace_once(
              text,
              "    } else {\n      _selectedCustomerId = widget.customerId;\n    }\n    _loadCustomers();\n",
              "    } else {\n      _selectedCustomerId = widget.customerId;\n      WidgetsBinding.instance.addPostFrameCallback((_) {\n        if (mounted) _loadPricingPolicy();\n      });\n    }\n    _loadCustomers();\n",
              'pricing policy bootstrap',
          )
          pricing_method = r'''  Future<void> _loadPricingPolicy() async {
    if (widget.debt != null) return;
    final auth = context.read<AuthProvider>();
    if (mounted) {
      setState(() {
        _loadingPricingPolicy = true;
        _pricingPolicyError = null;
      });
    }
    try {
      final settings = await ReceiptSettingsService.load(
        adminId: auth.adminId,
        fallbackMarketName: auth.marketName,
        fallbackPhone: auth.user?.getStringValue('phone') ?? '',
      );
      if (!mounted) return;
      setState(() {
        _discountPercent = settings.discountPercent.clamp(0.0, 100.0).toDouble();
        _loadingPricingPolicy = false;
        _pricingPolicyError = null;
      });
    } catch (_) {
      if (!mounted) return;
      setState(() {
        _loadingPricingPolicy = false;
        _pricingPolicyError =
            'نەتوانرا ڕێکخستنی داشکاندنی مارکێت پشتڕاست بکرێتەوە.';
      });
    }
  }

'''
          text = replace_once(
              text,
              "  @override\n  void dispose() {\n",
              pricing_method + "  @override\n  void dispose() {\n",
              'pricing policy method',
          )
          text = replace_once(
              text,
              "  Future<void> _save() async {\n",
              "  Future<void> _save() async {\n    if (widget.debt == null && _loadingPricingPolicy) {\n      AppHelpers.showSnackBar(\n        context,\n        'چاوەڕێ بکە تا ڕێکخستنی داشکاندن پشتڕاست دەکرێتەوە.',\n        isError: true,\n      );\n      return;\n    }\n    if (widget.debt == null && _pricingPolicyError != null) {\n      AppHelpers.showSnackBar(context, _pricingPolicyError!, isError: true);\n      return;\n    }\n",
              'pricing save guard',
          )
          calculation = r'''      // Calculate the undiscounted subtotal in IQD, then apply the
      // market receipt discount once. The discounted result is the financial
      // debt amount used by limits, payments, reports, and receipts.
      double subtotalNewDebt = 0;
      double subtotalUsdAmount = 0;
      for (var item in _items) {
        final itemCurrency = item['currency'] as String? ?? _currency;
        final itemTotal = (item['price'] as double) * (item['qty'] as int);
        if (itemCurrency == 'USD') {
          subtotalUsdAmount += itemTotal;
          subtotalNewDebt += dollarRate > 0 ? itemTotal * dollarRate : itemTotal;
        } else {
          subtotalNewDebt += itemTotal;
        }
      }
      final discountPercent = _discountPercent.clamp(0.0, 100.0).toDouble();
      final discountAmount =
          ((subtotalNewDebt * discountPercent / 100) * 100).roundToDouble() / 100;
