                      'داشکاندنی مارکێت: ${_discountPercent.toStringAsFixed(2)}% • خۆکارانە لە کۆی کۆتایی کەم دەکرێتەوە',
                      style: const TextStyle(fontSize: 11.5, fontWeight: FontWeight.w600),
