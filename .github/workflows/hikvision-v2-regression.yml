name: Hikvision Gateway V2 Regression

on:
  push:
    branches: [user-source]
    paths:
      - 'supabase/migrations/**hikvision**'
      - 'supabase/tests/hikvision_gateway_v2.test.sql'
      - 'supabase/functions/hikvision-gateway/**'
      - 'gateway/hikvision/**'
      - '.github/workflows/hikvision-v2-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hikvision-v2-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify migration uniqueness
        run: python3 scripts/verify_migration_duplicates.py

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start local Supabase
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Run Hikvision v2 fencing regression
        run: supabase test db supabase/tests/hikvision_gateway_v2.test.sql

  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Gateway v2 source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile gateway/hikvision/agent.py gateway/hikvision/common.py gateway/hikvision/setup.py
          grep -q 'gateway_common.GATEWAY_VERSION = "1.1.0"' gateway/hikvision/agent.py
          grep -q 'HEARTBEAT_SECONDS = 30' gateway/hikvision/agent.py
          grep -q '"heartbeat_job"' gateway/hikvision/agent.py
          grep -q 'attempt_token' gateway/hikvision/agent.py
          grep -q 'hikvision_gateway_claim_v2_service' supabase/functions/hikvision-gateway/index.ts
          grep -q 'hikvision_gateway_job_heartbeat_v2_service' supabase/functions/hikvision-gateway/index.ts
          grep -q 'stale_or_invalid_attempt' supabase/functions/hikvision-gateway/index.ts
