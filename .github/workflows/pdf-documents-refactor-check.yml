name: PDF Documents Refactor Check

on:
  push:
    branches: [pdf-documents-refactor-20260925]

permissions:
  contents: read

concurrency:
  group: pdf-documents-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Verify source contracts
        run: |
          python3 scripts/verify_online_only.py
          python3 scripts/verify_receipt_studio_governance.py
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
