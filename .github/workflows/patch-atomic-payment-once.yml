name: Patch Atomic Payment
'on':
  push:
    branches:
      - owner-source
    paths:
      - .github/workflows/patch-atomic-payment-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0
      - name: Switch payment recording to atomic RPC
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('lib/services/pb_service.dart')
          text = path.read_text()
          function_start = text.index('  static Future<RecordModel> createPayment({')
          block_start = text.index("    final payment = await pb.collection('payments').create(", function_start)
          block_end = text.index("    try {\n      final customerId = debt.getStringValue('customer');", block_start)
          new = """    await ensureInitialized();
            final rpcResult = await client.rpc(
              'record_payment',
              params: {
                'p_debt_id': debtId,
                'p_amount': amount,
                'p_note': note ?? '',
              },
            );

            Map<String, dynamic>? paymentRow;
            if (rpcResult is Map) {
              paymentRow = Map<String, dynamic>.from(rpcResult);
            } else if (rpcResult is List && rpcResult.isNotEmpty && rpcResult.first is Map) {
              paymentRow = Map<String, dynamic>.from(rpcResult.first as Map);
            }
            final paymentId = paymentRow?['id']?.toString() ?? '';
            if (paymentId.isEmpty) {
              throw Exception('پارەدانەوە تۆمار نەکرا');
            }

            final payment = await pb.collection('payments').getOne(paymentId);
            final debt = await getDebt(debtId);
            final newRemaining = debt.getDoubleValue('remaining');

"""
          path.write_text(text[:block_start] + new + text[block_end:])
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/pb_service.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Record payments atomically through Supabase RPC'
          git push origin owner-source
