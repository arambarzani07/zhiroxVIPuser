name: Align UI Verifier Once

on:
  push:
    branches:
      - owner-source
      - user-source

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Align verifier
        run: python3 scripts/align_ui_verifier_once.py

      - name: Commit verifier fix
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/align-ui-verifier-once.yml scripts/align_ui_verifier_once.py
          git add scripts/verify_online_only.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Align UI consistency verifier'
          git push origin "HEAD:${GITHUB_REF_NAME}"
