name: Profile Refactor Verification

on:
  push:
    branches: [refactor-user-profile-financial-20260925]

permissions:
  contents: read

concurrency:
  group: profile-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
