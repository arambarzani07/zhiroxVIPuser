name: System Cleanup Once

on:
  push:
    branches: [owner-source, user-source]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Normalize UI and password field
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ui_files = [
              Path('lib/utils/constants.dart'),
              Path('lib/screens/shared/add_debt_screen.dart'),
              Path('lib/screens/shared/add_user_screen.dart'),
              Path('lib/screens/shared/user_profile_screen.dart'),
          ]
          replacements = [
              ('قەرزی نوێ', 'قەرز پێدان'),
              ('پارەدانەوە', 'پارە وەرگرتنەوە'),
              ('بڕی پارە وەرگرتنەوە', 'بڕی پارەی وەرگیراو'),
              ('سنوری قەرز', 'سنووری قەرز'),
              ('بێ سنور', 'بێ سنوور'),
              ('قەرز بە سەرکەوتوویی زیادکرا', 'قەرز پێدان تۆمار کرا ✅'),
          ]

          for path in ui_files:
              text = path.read_text()
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text)

          path = Path('lib/screens/shared/add_user_screen.dart')
          text = path.read_text()

          state_old = '  bool _isLoading = false;\n  int _employeeSection = 0;'
          state_new = '  bool _isLoading = false;\n  bool _showPassword = false;\n  int _employeeSection = 0;'
          if state_old not in text:
              raise SystemExit('AddUserDialog loading state anchor not found')
          text = text.replace(state_old, state_new, 1)

          obscure_old = '      obscureText: isObscure,'
          obscure_new = '      obscureText: isObscure && !_showPassword,'
          if obscure_old not in text:
              raise SystemExit('password obscureText anchor not found')
          text = text.replace(obscure_old, obscure_new, 1)

          direction_old = '      textDirection: isPhone ? TextDirection.ltr : TextDirection.rtl,'
          direction_new = (
              '      textDirection: (isPhone || isObscure)\n'
              '          ? TextDirection.ltr\n'
              '          : TextDirection.rtl,'
          )
          if direction_old not in text:
              raise SystemExit('password direction anchor not found')
          text = text.replace(direction_old, direction_new, 1)

          prefix_old = '        prefixIcon: Icon(icon, color: AppColors.primary),'
          prefix_new = '''        prefixIcon: Icon(icon, color: AppColors.primary),
        suffixIcon: isObscure
            ? IconButton(
                tooltip: _showPassword
                    ? 'شاردنەوەی وشەی نهێنی'
                    : 'نیشاندانی وشەی نهێنی',
                onPressed: () => setState(() => _showPassword = !_showPassword),
                icon: Icon(
                  _showPassword
                      ? Icons.visibility_off_outlined
                      : Icons.visibility_outlined,
                  color: isDark
                      ? AppDarkColors.textSecondary
                      : const Color(0xFF667085),
                ),
              )
            : null,'''
          if prefix_old not in text:
              raise SystemExit('password suffix icon anchor not found')
          text = text.replace(prefix_old, prefix_new, 1)
          path.write_text(text)

          combined = '\n'.join(path.read_text() for path in ui_files)
          for stale in ('قەرزی نوێ', 'پارەدانەوە', 'سنوری قەرز', 'بێ سنور'):
              if stale in combined:
                  raise SystemExit(f'stale UI wording remains: {stale}')
          if 'bool _showPassword = false;' not in text:
              raise SystemExit('password visibility state missing')
          if 'isPhone || isObscure' not in text:
              raise SystemExit('password LTR guard missing')
          if 'Icons.visibility_outlined' not in text:
              raise SystemExit('password visibility button missing')

          print('System cleanup checks passed.')
          PY

      - name: Commit cleanup and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/system-cleanup-once.yml
          git add lib/utils/constants.dart \
                  lib/screens/shared/add_debt_screen.dart \
                  lib/screens/shared/add_user_screen.dart \
                  lib/screens/shared/user_profile_screen.dart
          if git diff --cached --quiet; then
            echo 'No cleanup changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Polish system UI consistency'
          git push origin "HEAD:${GITHUB_REF_NAME}"
