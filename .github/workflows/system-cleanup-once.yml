name: System Cleanup Once

on:
  push:
    branches:
      - owner-source
      - user-source

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply cleanup
        run: python3 scripts/system_cleanup_once.py

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/system-cleanup-once.yml scripts/system_cleanup_once.py
          git add lib/utils/constants.dart lib/screens/shared/add_debt_screen.dart lib/screens/shared/add_user_screen.dart lib/screens/shared/user_profile_screen.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Polish system UI consistency'
          git push origin "HEAD:${GITHUB_REF_NAME}"
