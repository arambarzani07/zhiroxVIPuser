name: Remove Legacy Debt Provider

on:
  push:
    paths:
      - '.github/workflows/remove-legacy-debt-provider.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp scripts/remove_legacy_debt_provider.py /tmp/remove_legacy_debt_provider.py
      - name: Patch Owner
        run: |
          python /tmp/remove_legacy_debt_provider.py
          git add -A
          git commit -m "Remove legacy debt provider and standalone debt screen"
          git push origin HEAD:owner-source
      - name: Patch User
        run: |
          git fetch origin user-source
          git checkout -B user-source origin/user-source
          python /tmp/remove_legacy_debt_provider.py
          git add -A
          git commit -m "Remove legacy debt provider and standalone debt screen"
          git push origin HEAD:user-source
