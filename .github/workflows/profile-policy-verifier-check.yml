name: Profile Policy Verifier Check

on:
  push:
    branches: [profile-verifier-part-aware-20260925]

permissions:
  contents: read

concurrency:
  group: profile-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify online-only policy
        run: python3 scripts/verify_online_only.py
