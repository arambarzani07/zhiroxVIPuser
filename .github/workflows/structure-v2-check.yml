name: Zhirox User Structure V2 Check

on:
  push:
    branches: [zhirox-user-structure-v2]
  workflow_dispatch:

concurrency:
  group: zhirox-user-structure-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-user-app:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify customer-only source boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -d lib/screens/admin
          test ! -d lib/screens/employee
          test ! -e lib/screens/shared/add_debt_screen.dart

          forbidden='package:pocketbase|password_text|telegram_bot_token|telegram_chat_id'
          if grep -R -n -E "$forbidden" lib; then
            echo 'Forbidden legacy/secret surface found in customer source' >&2
            exit 1
          fi

          privileged='PBService\.(registerAdmin|createUser|deleteUser|createDebt|updateDebt|deleteDebt|createPayment|approveCustomer|rejectCustomer|renewAdminSubscription|deleteAdminWithData)'
          if grep -R -n -E "$privileged" lib/screens; then
            echo 'Privileged C-Panel action referenced by customer UI' >&2
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build iOS release without signing
        run: flutter build ios --release --no-codesign

      - name: Verify backend identity
        run: |
          APP=build/ios/iphoneos/Runner.app
          grep -R -a -q 'zfuvnczdqifihsnrhqzj' "$APP"
          if grep -R -a -q 'zhirox.duckdns.org' "$APP"; then
            echo 'Legacy PocketBase backend detected' >&2
            exit 1
          fi
