name: Final Owner Market Loading Polish

on:
  push:
    branches: [owner-source]
    paths:
      - '.github/workflows/final-owner-market-loading.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0
      - name: Use shared Owner loading state in markets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/auth/admin_management_screen.dart')
          s = p.read_text()
          old = '''              const SliverFillRemaining(\n                hasScrollBody: false,\n                child: Center(child: CircularProgressIndicator()),\n              )'''
          new = '''              const SliverFillRemaining(\n                hasScrollBody: false,\n                child: OwnerStatePanel.loading(),\n              )'''
          if old not in s:
              raise SystemExit('markets loading pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/auth/admin_management_screen.dart
          git commit -m "Polish Owner markets loading state"
          git push origin HEAD:owner-source
