name: Route Employee Create

on:
  push:
    branches:
      - user-source
    paths:
      - .github/workflows/route-employee-create.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: user-source
      - name: Route employee account creation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/services/pb_service.dart')
          s = p.read_text()
          old = """  static Future<RecordModel> _invokeCreateAccount(Map<String, dynamic> body) async {
    await ensureInitialized();
    try {
      final response = await client.functions.invoke(
        'account-admin',
        body: {'action': 'create_user', ...body},
      );
      final data = response.data;
      if (data is! Map || data['user'] is! Map) {
        throw _functionError(data);
      }
      return profileRecord(Map<String, dynamic>.from(data['user'] as Map));
    } on FunctionsException catch (e) {
      throw _functionError(e.details ?? e.reasonPhrase ?? e.status);
    }
  }
"""
          new = """  static Future<RecordModel> _invokeCreateAccount(Map<String, dynamic> body) async {
    await ensureInitialized();
    try {
      final isEmployee = body['role']?.toString() == 'employee';
      final response = await client.functions.invoke(
        isEmployee ? 'employee-create' : 'account-admin',
        body: isEmployee ? body : {'action': 'create_user', ...body},
      );
      final data = response.data;
      if (data is! Map || data['user'] is! Map) {
        throw _functionError(data);
      }
      return profileRecord(Map<String, dynamic>.from(data['user'] as Map));
    } on FunctionsException catch (e) {
      throw _functionError(e.details ?? e.reasonPhrase ?? e.status);
    }
  }
"""
          assert old in s, 'create account invocation block not found'
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          grep -q "isEmployee ? 'employee-create' : 'account-admin'" lib/services/pb_service.dart
      - name: Commit route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/pb_service.dart
          git commit -m "Route employee creation through dedicated Edge Function"
          git push origin HEAD:user-source
