name: Daftar Mirror Projection Check

on:
  push:
    branches: [daftar-projection-mirror-fix-20260925]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify_migration_duplicates.py
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: supabase test db supabase/tests/audit40_integrity.test.sql
      - run: supabase db lint --level error
