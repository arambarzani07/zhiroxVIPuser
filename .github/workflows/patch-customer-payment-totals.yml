name: Patch Customer Payment Totals

on:
  push:
    branches:
      - user-source
    paths:
      - .github/workflows/patch-customer-payment-totals.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: user-source
          fetch-depth: 0

      - name: Apply targeted patch
        run: python3 scripts/apply_customer_total_patch.py

      - name: Verify patch
        run: python3 scripts/verify_customer_payment_totals.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/customer/customer_dashboard.dart lib/services/pdf_service.dart scripts/verify_customer_payment_totals.py .github/workflows/ios-unsigned-ipa.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "fix(user): make customer payment totals cumulative everywhere"
          git push origin HEAD:user-source
