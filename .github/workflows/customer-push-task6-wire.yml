name: Customer Push Task 6 Wire

on:
  push:
    branches: [user-source]
    paths:
      - '.github/workflows/customer-push-task6-wire.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: user-source
          fetch-depth: 0
      - name: Wire best-effort debt push
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/services/pb_service.dart')
          text = path.read_text()

          import_anchor = "import 'package:zhirox/services/dashboard_recent_activity.dart';"
          import_line = "import 'package:zhirox/services/debt_push_enqueue.dart';"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('import anchor not found')
              text = text.replace(import_anchor, import_anchor + "\n" + import_line, 1)

          create_anchor = """    try {\n      final formattedAmount =\n"""
          dispatch = """    await enqueueDebtPushBestEffort(\n      debtId: created.id,\n      invoke: (debtId) async {\n        final response = await client.functions.invoke(\n          'customer-push-events',\n          body: {\n            'action': 'enqueue_debt',\n            'debt_id': debtId,\n          },\n        );\n        final data = response.data;\n        if (data is Map && data['error'] != null) {\n          throw _functionError(data);\n        }\n      },\n    );\n\n"""

          created_at = text.find("created = await pb.collection('debts').create(body: body);")
          if created_at < 0:
              raise SystemExit('debt create anchor not found')
          if text.find('await enqueueDebtPushBestEffort(', created_at, created_at + 2500) < 0:
              notification_at = text.find(create_anchor, created_at)
              if notification_at < 0:
                  raise SystemExit('notification anchor not found')
              text = text[:notification_at] + dispatch + text[notification_at:]

          path.write_text(text)
          PY
      - name: Commit wiring
        shell: bash
        run: |
          if git diff --quiet -- lib/services/pb_service.dart; then
            echo 'PBService already wired'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/pb_service.dart
          git commit -m 'feat(user): enqueue push after debt creation'
          git push origin HEAD:user-source
