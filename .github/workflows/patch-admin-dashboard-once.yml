name: Patch Admin Dashboard Lifecycle Once

on:
  push:
    branches: [user-source]
    paths:
      - '.github/workflows/patch-admin-dashboard-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user-source
        uses: actions/checkout@v4
        with:
          ref: user-source
          fetch-depth: 0

      - name: Harden async dialog lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/admin/admin_dashboard.dart')
          text = path.read_text()

          guard = 'if (!ctx.mounted || !mounted) return;'

          def insert_guard_before(anchor, search_end=None):
              global text
              end = len(text) if search_end is None else search_end
              pos = text.rfind(anchor, 0, end) if search_end is not None else text.find(anchor)
              assert pos >= 0, f'anchor not found: {anchor}'
              line_start = text.rfind('\n', 0, pos) + 1
              previous_start = text.rfind('\n', 0, max(0, line_start - 1)) + 1
              previous_line = text[previous_start:line_start].strip()
              if previous_line == guard:
                  return
              indent = text[line_start:pos]
              text = text[:line_start] + indent + guard + '\n' + text[line_start:]

          # Phone uniqueness response can arrive after the dialog has been dismissed.
          insert_guard_before('if (existing.items.isNotEmpty) {')

          # Guard the two post-await success paths before they touch the dialog context.
          for message in ["'ژمارە مۆبایل گۆڕا ✅'", "'وشەی نهێنی گۆڕا ✅'"]:
              msg_pos = text.find(message)
              assert msg_pos >= 0, f'message not found: {message}'
              insert_guard_before('if (mounted) {', msg_pos)

          # Never call StatefulBuilder setState after the dialog has been disposed.
          bare = 'setDialogState(() => isSaving = false);'
          safe = 'if (ctx.mounted) setDialogState(() => isSaving = false);'
          bare_count = text.count(bare)
          if bare_count:
              text = text.replace(bare, safe)
          assert safe in text, 'no safe isSaving reset found'

          path.write_text(text)
          PY

      - name: Commit hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/admin/admin_dashboard.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Harden admin dashboard async dialog lifecycle'
          git push origin user-source
