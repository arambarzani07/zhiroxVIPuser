name: Fix Seen Timestamp Verifier Marker

on:
  push:
    branches: [owner-source]
    paths:
      - 'scripts/fix_seen_timestamp_verifier_marker.py'
      - '.github/workflows/fix-seen-timestamp-verifier-marker.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout owner-source
        uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0

      - name: Preserve helper
        run: cp scripts/fix_seen_timestamp_verifier_marker.py /tmp/fix_seen_timestamp_verifier_marker.py

      - name: Patch Owner verifier
        run: python scripts/fix_seen_timestamp_verifier_marker.py

      - name: Commit Owner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify_online_only.py
          if ! git diff --cached --quiet; then
            git commit -m 'Update seen timestamp verifier marker'
            git push origin HEAD:owner-source
          fi

      - name: Checkout user-source
        run: |
          git fetch origin user-source
          git checkout -B user-source origin/user-source

      - name: Patch User verifier
        run: python /tmp/fix_seen_timestamp_verifier_marker.py

      - name: Commit User
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify_online_only.py
          if ! git diff --cached --quiet; then
            git commit -m 'Update seen timestamp verifier marker'
            git push origin HEAD:user-source
          fi
