name: One-time Intelligence Center fix

on:
  push:
    branches: [user-source]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix unsupported icon and remove fixer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          target = Path('lib/screens/admin/intelligence_center_screen.dart')
          text = target.read_text()
          old = 'Icons.event_upcoming_rounded'
          new = 'Icons.event_note_rounded'
          if old not in text:
              raise SystemExit('expected icon token not found')
          target.write_text(text.replace(old, new))
          Path('.github/workflows/fix-intelligence-icon.yml').unlink()
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Fix Intelligence Center icon"
          git push
