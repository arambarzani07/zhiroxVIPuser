name: Apply dashboard recent activity patch

on:
  push:
    branches:
      - user-source
    paths:
      - scripts/apply_dashboard_recent_activity_patch.py
      - .github/workflows/apply-dashboard-recent-activity-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user-source
        uses: actions/checkout@v4
        with:
          ref: user-source
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/apply_dashboard_recent_activity_patch.py

      - name: Remove temporary patch files
        run: |
          rm -f scripts/apply_dashboard_recent_activity_patch.py
          rm -f .github/workflows/apply-dashboard-recent-activity-patch.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(user): pin 24h dashboard financial activity"
          git push origin HEAD:user-source
