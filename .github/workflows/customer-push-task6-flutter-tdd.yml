name: Customer Push Task 6 Flutter TDD

on:
  push:
    branches: [user-source]
    paths:
      - 'test/debt_push_enqueue_test.dart'
      - 'lib/services/debt_push_enqueue.dart'
      - 'lib/services/pb_service.dart'
      - '.github/workflows/customer-push-task6-flutter-tdd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debt-push-flutter-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run debt push dispatch test
        run: flutter test test/debt_push_enqueue_test.dart
