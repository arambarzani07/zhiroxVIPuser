name: One-time page customer balance
on:
  push:
    branches: [owner-source]
    paths:
      - '.github/workflows/one-time-page-customer-balance.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0
      - name: Sum customer balance server-side
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('lib/services/pb_service.dart')
          text = path.read_text()
          start = text.index('  static Future<double> getCustomerBalance(String customerId) async {')
          end = text.index('  static String _mimeForPath(', start)
          replacement = '''  static Future<double> getCustomerBalance(String customerId) async {
            await ensureInitialized();
            const pageSize = 500;
            var offset = 0;
            var total = 0.0;
            while (true) {
              final raw = await client
                  .from('debts')
                  .select('remaining')
                  .eq('customer_id', customerId)
                  .isFilter('deleted_at', null)
                  .order('id')
                  .range(offset, offset + pageSize - 1);
              for (final row in raw) {
                total += _financeDouble(row['remaining']);
              }
              if (raw.length < pageSize) return total;
              offset += pageSize;
            }
          }

'''
          block = text[start:end]
          if ".select('remaining')" in block:
              raise SystemExit('customer balance paging already present')
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-page-customer-balance.yml
          git add lib/services/pb_service.dart
          git diff --cached --check
          git commit -m 'perf(owner): sum customer balance server-side'
          git push origin owner-source
