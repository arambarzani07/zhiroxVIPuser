name: Apply ZHIROX app icon once

on:
  push:
    paths:
      - .github/workflows/apply-zhirox-icon-once.yml

permissions:
  contents: write

jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Generate Apple-safe app icon assets
        shell: bash
        run: |
          python3 -m pip install --quiet pillow cairosvg
          cat > /tmp/zhirox-icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <defs>
              <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#29B6FF"/><stop offset="1" stop-color="#063BBA"/></linearGradient>
              <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3188F4"/><stop offset="1" stop-color="#0B3C9D"/></linearGradient>
              <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#55E990"/><stop offset="1" stop-color="#008A4D"/></linearGradient>
              <linearGradient id="xg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#155EEF"/></linearGradient>
              <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0A2A66" flood-opacity=".18"/></filter>
            </defs>
            <rect width="1024" height="1024" fill="#FFFFFF"/>
            <g filter="url(#shadow)">
              <path d="M270 233h57l74 322c8 37 39 63 77 63h262" fill="none" stroke="url(#blue)" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M386 447h352l-41 154H425z" fill="url(#blue)" stroke="#D8F5FF" stroke-width="8"/>
              <circle cx="455" cy="674" r="31" fill="#073A98"/><circle cx="649" cy="674" r="31" fill="#073A98"/>
              <path d="M386 169l177-34 46 255-177 34z" fill="#FFFFFF" stroke="#E7EDF7" stroke-width="6"/>
              <text x="448" y="217" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#143A7A">قەرز</text>
              <g stroke="#A8B6CF" stroke-width="15" stroke-linecap="round"><path d="M434 264h105"/><path d="M440 306h105"/><path d="M448 348h94"/></g>
              <rect x="516" y="180" width="248" height="289" rx="36" fill="url(#card)" transform="rotate(8 640 325)"/>
              <circle cx="625" cy="253" r="24" fill="#FFF"/><path d="M586 316c5-35 73-35 78 0z" fill="#FFF"/>
              <g stroke-linecap="round"><path d="M585 356h33" stroke="#35DB78" stroke-width="14"/><path d="M602 339v34" stroke="#35DB78" stroke-width="14"/><path d="M638 355h77" stroke="#35DB78" stroke-width="14"/><path d="M586 399h29" stroke="#FF5A61" stroke-width="14"/><path d="M642 399h66" stroke="#FF5A61" stroke-width="14"/><path d="M591 438h94" stroke="#9FB4D6" stroke-width="12"/></g>
              <path d="M660 438l97-42 97 42v87c0 84-49 137-97 164-48-27-97-80-97-164z" fill="url(#green)" stroke="#B8FFD8" stroke-width="8"/>
              <path d="M713 530l31 31 61-73" fill="none" stroke="#FFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            <text x="512" y="820" text-anchor="middle" font-family="Arial,sans-serif" font-size="118" font-weight="900" letter-spacing="-6" fill="#082C69">ZHIRO<tspan fill="url(#xg)">X</tspan></text>
            <text x="512" y="872" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" letter-spacing="8" fill="#50627E">SMART MARKET MANAGEMENT</text>
          </svg>
          SVG
          python3 - <<'PY'
          import json, math
          from pathlib import Path
          import cairosvg
          from PIL import Image
          icon_dir = Path('ios/Runner/Assets.xcassets/AppIcon.appiconset')
          cfg = json.loads((icon_dir/'Contents.json').read_text())
          master = Path('/tmp/zhirox-master.png')
          cairosvg.svg2png(url='/tmp/zhirox-icon.svg', write_to=str(master), output_width=1024, output_height=1024)
          src = Image.open(master).convert('RGB')
          for item in cfg.get('images', []):
              fn = item.get('filename')
              size = item.get('size')
              scale = item.get('scale')
              if not fn or not size or not scale:
                  continue
              points = float(size.split('x')[0])
              mult = float(scale.rstrip('x'))
              px = int(round(points * mult))
              out = src.resize((px, px), Image.Resampling.LANCZOS)
              out.save(icon_dir/fn, 'PNG', optimize=True)
          # Guarantee the App Store marketing icon is opaque 1024x1024.
          marketing = [i for i in cfg.get('images', []) if i.get('idiom') == 'ios-marketing' and i.get('filename')]
          for item in marketing:
              src.save(icon_dir/item['filename'], 'PNG', optimize=True)
          PY
          rm .github/workflows/apply-zhirox-icon-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/Runner/Assets.xcassets/AppIcon.appiconset .github/workflows/apply-zhirox-icon-once.yml
          git commit -m "Use ZHIROX credit protection app icon"
          git push origin "HEAD:${GITHUB_REF_NAME}"
