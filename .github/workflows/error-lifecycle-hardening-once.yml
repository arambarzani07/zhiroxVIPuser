name: Error Lifecycle Hardening Once

on:
  push:
    branches: [owner-source]

jobs:
  patch-both:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Patch Owner
        run: |
          python3 scripts/error_lifecycle_hardening_once.py .
          git add lib/screens/shared/add_debt_screen.dart lib/screens/shared/debt_detail_screen.dart scripts/verify_online_only.py
          git commit -m 'Normalize debt errors and harden async lifecycle'
          git push origin HEAD:owner-source

      - name: Patch User
        run: |
          git worktree add /tmp/user-source origin/user-source
          python3 "$GITHUB_WORKSPACE/scripts/error_lifecycle_hardening_once.py" /tmp/user-source
          cd /tmp/user-source
          git add lib/screens/shared/add_debt_screen.dart lib/screens/shared/debt_detail_screen.dart scripts/verify_online_only.py
          git commit -m 'Normalize debt errors and harden async lifecycle'
          git push origin HEAD:user-source
