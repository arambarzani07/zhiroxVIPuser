name: A11 Direct Camera Build Check

on:
  push:
    branches:
      - a11-direct-camera
  workflow_dispatch:

permissions:
  contents: read

# Verifies Hikvision + A11 coexistence and publishes the ZHIROX User unsigned IPA.
jobs:
  analyze-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos lib/main_a11.dart lib/services/a11_camera_service.dart lib/services/a11_camera_coordinator.dart lib/services/camera_source_service.dart lib/screens/admin/a11_camera_setup_screen.dart lib/screens/admin/camera_source_settings_screen.dart
      - run: flutter build apk --debug -t lib/main_a11.dart

  ios-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Set ZHIROX User identity
        run: |
          sed -i '' 's/com.karoxghafoor.zhirox/com.karoxghafoor.zhirox.user/g' ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName ZHIROX User' ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleName zhirox_user' ios/Runner/Info.plist
      - run: cd ios && pod install
      - name: Build iOS release without signing
        run: flutter build ios --release --no-codesign -t lib/main_a11.dart
      - name: Verify ZHIROX User identity
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ios/iphoneos/Runner.app/Info.plist | grep -Fx 'com.karoxghafoor.zhirox.user'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' build/ios/iphoneos/Runner.app/Info.plist | grep -Fx 'ZHIROX User'
      - name: Package unsigned IPA
        run: |
          rm -rf Payload ZHIROX-User.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload ZHIROX-User.ipa
          test -s ZHIROX-User.ipa
          shasum -a 256 ZHIROX-User.ipa > ZHIROX-User.ipa.sha256
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhirox-user-a11-dual-camera-unsigned-ipa
          path: |
            ZHIROX-User.ipa
            ZHIROX-User.ipa.sha256
          if-no-files-found: error
          retention-days: 7
