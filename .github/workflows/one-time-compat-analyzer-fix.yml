name: One-time compat analyzer fix

on:
  push:
    branches:
      - user-source
    paths:
      - .github/workflows/one-time-compat-analyzer-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove redundant SDK type check from both branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for branch in user-source owner-source; do
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
            python3 - "$branch" <<'PY'
          from pathlib import Path
          import re
          import sys

          branch = sys.argv[1]
          path = Path('lib/services/supabase_compat.dart')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"(?m)^[ \t]*if \(data is! List\) \{\n"
              r"[ \t]*throw FormatException\('invalid \$table page'\);\n"
              r"[ \t]*\}\n"
          )
          updated, count = pattern.subn('', text, count=1)
          if count == 1:
              path.write_text(updated, encoding='utf-8')
              print(f'{branch}: removed redundant type check')
          elif "throw FormatException('invalid $table page');" not in text:
              print(f'{branch}: already fixed')
          else:
              raise SystemExit(f'{branch}: unexpected analyzer block')
          PY

            if ! git diff --quiet -- lib/services/supabase_compat.dart; then
              git diff --check -- lib/services/supabase_compat.dart
              git add lib/services/supabase_compat.dart
              git commit -m "fix compat analyzer warning"
              git push origin "HEAD:$branch"
            fi
          done
