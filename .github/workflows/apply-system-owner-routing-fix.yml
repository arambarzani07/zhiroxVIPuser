name: Apply System Owner Routing Fix

on:
  push:
    branches: [owner-source]
    paths:
      - 'scripts/apply_system_owner_routing_fix.py'
      - '.github/workflows/apply-system-owner-routing-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout owner-source
        uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0

      - name: Apply targeted routing fix
        run: python scripts/apply_system_owner_routing_fix.py

      - name: Commit Owner routing flow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart lib/screens/auth/login_screen.dart lib/screens/auth/admin_management_screen.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Route System Owner to authenticated admin management'
            git push origin HEAD:owner-source
          fi
