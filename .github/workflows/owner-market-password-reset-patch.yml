name: Patch Owner market password reset UI

on:
  push:
    branches: [owner-source]
    paths:
      - '.github/workflows/owner-market-password-reset-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner-source
      - name: Patch Owner admin management password reset UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/auth/admin_management_screen.dart')
          text = path.read_text()

          old = """                    (context, index) => _AdminCard(\n                      data: _admins[index],\n                      isDark: isDark,\n                      onRenew: _showRenewDialog,\n                    ),\n"""
          new = """                    (context, index) => _AdminCard(\n                      data: _admins[index],\n                      isDark: isDark,\n                      onRenew: _showRenewDialog,\n                      onResetPassword: _showResetPasswordDialog,\n                    ),\n"""
          if old not in text:
              raise SystemExit('admin card construction anchor not found')
          text = text.replace(old, new, 1)

          marker = """  Widget _buildField(\n"""
          method = r'''  Future<void> _showResetPasswordDialog(
    String adminId,
    String marketName,
  ) async {
    final passwordCtrl = TextEditingController();
    final confirmCtrl = TextEditingController();
    final reasonCtrl = TextEditingController();
    final formKey = GlobalKey<FormState>();
    bool loading = false;
    bool obscure = true;

    try {
      await showDialog<void>(
        context: context,
        barrierDismissible: false,
        builder: (ctx) => StatefulBuilder(
          builder: (ctx, setDialogState) {
            final isDark = Theme.of(ctx).brightness == Brightness.dark;
            final textSecondary = isDark
                ? AppDarkColors.textSecondary
                : const Color(0xFF667085);

            return AlertDialog(
              backgroundColor: isDark ? AppDarkColors.card : Colors.white,
              shape: RoundedRectangleBorder(
                borderRadius: BorderRadius.circular(18),
              ),
              title: Row(
                children: [
                  const Icon(
                    Icons.lock_reset_rounded,
                    color: AppColors.primary,
                    size: 22,
                  ),
                  const SizedBox(width: 9),
                  Expanded(
                    child: Text(
                      'گۆڕینی وشەی نهێنی • $marketName',
                      maxLines: 2,
                      overflow: TextOverflow.ellipsis,
                      style: const TextStyle(
                        fontSize: 16,
                        fontWeight: FontWeight.w800,
                      ),
                    ),
                  ),
                ],
              ),
              content: ConstrainedBox(
                constraints: const BoxConstraints(maxWidth: 440),
                child: SingleChildScrollView(
                  child: Form(
                    key: formKey,
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      crossAxisAlignment: CrossAxisAlignment.stretch,
                      children: [
                        Text(
                          'وشەی نهێنی نوێ بۆ هەژماری بەڕێوەبەری ئەم مارکێتە دابنێ. دوای گۆڕین، session و ئامێرە کۆنەکان دەرکرێن.',
                          style: TextStyle(
                            fontSize: 11,
                            height: 1.5,
                            color: textSecondary,
                          ),
                        ),
                        const SizedBox(height: 14),
                        _buildField(
                          passwordCtrl,
                          'وشەی نهێنی نوێ',
                          Icons.lock_outline_rounded,
                          isDark: isDark,
                          obscureText: obscure,
                          isPassword: true,
                          isLtr: true,
                          onToggle: () {
                            if (ctx.mounted) {
                              setDialogState(() => obscure = !obscure);
                            }
                          },
                          validator: (value) {
                            final v = value ?? '';
                            if (v.length < 12 ||
                                !RegExp(r'[a-z]').hasMatch(v) ||
                                !RegExp(r'[A-Z]').hasMatch(v) ||
                                !RegExp(r'[0-9]').hasMatch(v) ||
                                !RegExp(r'[^A-Za-z0-9]').hasMatch(v)) {
                              return 'لانیکەم ١٢ پیت + پیتی گەورە/بچووک + ژمارە + هێما';
                            }
                            if (v.length > 128) {
                              return 'وشەی نهێنی زۆر درێژە';
                            }
                            return null;
                          },
                        ),
                        const SizedBox(height: 12),
                        _buildField(
                          confirmCtrl,
                          'دووبارەکردنەوەی وشەی نهێنی',
                          Icons.lock_reset_rounded,
                          isDark: isDark,
                          obscureText: obscure,
                          isLtr: true,
                          matchCtrl: passwordCtrl,
                        ),
                        const SizedBox(height: 12),
                        _buildField(
                          reasonCtrl,
                          'هۆکاری گۆڕین',
                          Icons.notes_rounded,
                          isDark: isDark,
                          hint: 'بۆ نموونە: لەبیرچوونەوەی وشەی نهێنی',
                          validator: (value) {
                            final v = value?.trim() ?? '';
                            if (v.length < 3) {
                              return 'هۆکاری گۆڕین بنووسە';
                            }
                            if (v.length > 500) {
                              return 'هۆکار زۆر درێژە';
                            }
                            return null;
                          },
                        ),
                      ],
                    ),
                  ),
                ),
              ),
              actions: [
                TextButton(
                  onPressed: loading ? null : () => Navigator.pop(ctx),
                  child: const Text('پاشگەزبوونەوە'),
                ),
                ElevatedButton.icon(
                  onPressed: loading
                      ? null
                      : () async {
                          final form = formKey.currentState;
                          if (form == null || !form.validate()) return;
                          FocusScope.of(ctx).unfocus();
                          setDialogState(() => loading = true);
                          try {
                            await PBService.recoverOwnerAdminAccount(
                              adminId: adminId,
                              newPassword: passwordCtrl.text,
                              reason: reasonCtrl.text.trim(),
                            );
                            if (!ctx.mounted || !mounted) return;
                            Navigator.pop(ctx);
                            AppHelpers.showSnackBar(
                              context,
                              'وشەی نهێنی $marketName نوێکرایەوە و session ـە کۆنەکان دەرکران.',
                            );
                          } catch (e) {
                            if (ctx.mounted) {
                              setDialogState(() => loading = false);
                            }
                            if (mounted) {
                              AppHelpers.showSnackBar(
                                context,
                                _friendlyError(e),
                                isError: true,
                              );
                            }
                          }
                        },
                  icon: loading
                      ? const SizedBox(
                          width: 17,
                          height: 17,
                          child: CircularProgressIndicator(
                            strokeWidth: 2,
                            color: Colors.white,
                          ),
                        )
                      : const Icon(Icons.lock_reset_rounded, size: 19),
                  label: Text(loading ? 'چاوەڕوانبە...' : 'گۆڕینی وشەی نهێنی'),
                ),
              ],
            );
          },
        ),
      );
    } finally {
      passwordCtrl.dispose();
      confirmCtrl.dispose();
      reasonCtrl.dispose();
    }
  }

'''
          if marker not in text:
              raise SystemExit('field helper anchor not found')
          text = text.replace(marker, method + marker, 1)

          old = """  const _AdminCard({\n    required this.data,\n    required this.isDark,\n    required this.onRenew,\n  });\n\n  final Map<String, dynamic> data;\n  final bool isDark;\n  final void Function(String, String) onRenew;\n"""
          new = """  const _AdminCard({\n    required this.data,\n    required this.isDark,\n    required this.onRenew,\n    required this.onResetPassword,\n  });\n\n  final Map<String, dynamic> data;\n  final bool isDark;\n  final void Function(String, String) onRenew;\n  final void Function(String, String) onResetPassword;\n"""
          if old not in text:
              raise SystemExit('card constructor anchor not found')
          text = text.replace(old, new, 1)

          old = """                  onSelected: (value) {\n                    if (value == 'renew') {\n                      onRenew(\n                        admin.id,\n                        subscriptionPlan.isEmpty ? 'custom' : subscriptionPlan,\n                      );\n                    }\n                  },\n                  itemBuilder: (context) => const [\n                    PopupMenuItem(\n                      value: 'renew',\n                      child: Row(\n                        children: [\n                          Icon(\n                            Icons.event_repeat_rounded,\n                            size: 19,\n                            color: AppColors.primary,\n                          ),\n                          SizedBox(width: 10),\n                          Text('نوێکردنەوەی بەشداری'),\n                        ],\n                      ),\n                    ),\n                  ],\n"""
          new = """                  onSelected: (value) {\n                    if (value == 'renew') {\n                      onRenew(\n                        admin.id,\n                        subscriptionPlan.isEmpty ? 'custom' : subscriptionPlan,\n                      );\n                    } else if (value == 'reset_password') {\n                      onResetPassword(\n                        admin.id,\n                        marketName.isEmpty ? 'مارکێت' : marketName,\n                      );\n                    }\n                  },\n                  itemBuilder: (context) => const [\n                    PopupMenuItem(\n                      value: 'renew',\n                      child: Row(\n                        children: [\n                          Icon(\n                            Icons.event_repeat_rounded,\n                            size: 19,\n                            color: AppColors.primary,\n                          ),\n                          SizedBox(width: 10),\n                          Text('نوێکردنەوەی بەشداری'),\n                        ],\n                      ),\n                    ),\n                    PopupMenuItem(\n                      value: 'reset_password',\n                      child: Row(\n                        children: [\n                          Icon(\n                            Icons.lock_reset_rounded,\n                            size: 19,\n                            color: AppColors.primary,\n                          ),\n                          SizedBox(width: 10),\n                          Text('گۆڕینی وشەی نهێنی'),\n                        ],\n                      ),\n                    ),\n                  ],\n"""
          if old not in text:
              raise SystemExit('popup menu anchor not found')
          text = text.replace(old, new, 1)

          # Friendly errors for the protected recovery path.
          anchor = """    if (raw.contains('system_owner_required') ||\n        raw.contains('forbidden') ||\n        raw.contains('unauthorized') ||\n        raw.contains('permission')) {\n      return 'تەنها خاوەن سیستەم دەسەڵاتی ئەم کردارەی هەیە.';\n    }\n"""
          replacement = """    if (raw.contains('owner_permission_denied')) {\n      return 'دەسەڵاتی گۆڕینی وشەی نهێنی ئەم هەژمارەت نییە یان پێویستە دووبارە ناسنامەکەت پشتڕاست بکەیتەوە.';\n    }\n    if (raw.contains('invalid_input')) {\n      return 'وشەی نهێنی دەبێت لانیکەم ١٢ پیت بێت و پیتی گەورە/بچووک، ژمارە و هێمای تێدا بێت.';\n    }\n    if (raw.contains('admin_not_found')) {\n      return 'هەژماری بەڕێوەبەری ئەم مارکێتە نەدۆزرایەوە.';\n    }\n    if (raw.contains('recovery_finalize_failed')) {\n      return 'وشەی نهێنی گۆڕدرا، بەڵام پاککردنەوەی session ـە کۆنەکان تەواو نەبوو؛ دووبارە وشەی نهێنی مەگۆڕە، سەرەتا پشکنین بکە.';\n    }\n    if (raw.contains('system_owner_required') ||\n        raw.contains('forbidden') ||\n        raw.contains('unauthorized') ||\n        raw.contains('permission')) {\n      return 'تەنها خاوەن سیستەم دەسەڵاتی ئەم کردارەی هەیە.';\n    }\n"""
          if anchor not in text:
              raise SystemExit('friendly error anchor not found')
          text = text.replace(anchor, replacement, 1)

          path.write_text(text)
          PY

      - name: Verify patch source contracts
        run: |
          grep -F "onResetPassword: _showResetPasswordDialog" lib/screens/auth/admin_management_screen.dart
          grep -F "PBService.recoverOwnerAdminAccount" lib/screens/auth/admin_management_screen.dart
          grep -F "Text('گۆڕینی وشەی نهێنی')" lib/screens/auth/admin_management_screen.dart
          grep -F "reason: reasonCtrl.text.trim()" lib/screens/auth/admin_management_screen.dart

      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add lib/screens/auth/admin_management_screen.dart
          git commit -m "add Owner market password reset control"
          git push origin owner-source
