name: Patch Owner market password reset UI

on:
  push:
    branches: [owner-source]
    paths:
      - '.github/workflows/owner-market-password-reset-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner-source
      - name: Patch Owner password reset UI
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch_owner_password.py
          python3 /tmp/patch_owner_password.py
      - name: Verify patch
        run: |
          grep -F "onResetPassword: _showResetPasswordDialog" lib/screens/auth/admin_management_screen.dart
          grep -F "PBService.recoverOwnerAdminAccount" lib/screens/auth/admin_management_screen.dart
          grep -F "value: 'reset_password'" lib/screens/auth/admin_management_screen.dart
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add lib/screens/auth/admin_management_screen.dart
          git commit -m "add Owner market password reset control"
          git push origin owner-source
