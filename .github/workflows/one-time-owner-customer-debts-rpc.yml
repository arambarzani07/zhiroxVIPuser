name: One-time owner customer debts RPC
on:
  push:
    branches: [owner-source]
    paths:
      - '.github/workflows/one-time-owner-customer-debts-rpc.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0
      - name: Add customer debt page RPC fast path
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64
          path = Path('lib/services/pb_service.dart')
          text = path.read_text()
          start = text.index('  static Future<Map<String, dynamic>> getDebtsPaginated({')
          end = text.index('  static Future<RecordModel> getDebt(', start)
          block = text[start:end]
          if "get_customer_debts_page" in block:
              raise SystemExit('customer debt RPC fast path already present')
          marker = '  }) async {\n'
          marker_index = text.index(marker, start)
          replacement = base64.b64decode('').decode()
          text = text[:marker_index] + replacement + text[marker_index + len(marker):]
          path.write_text(text)
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-owner-customer-debts-rpc.yml
          git add lib/services/pb_service.dart
          git diff --cached --check
          git commit -m 'perf(owner): page customer debts via RPC'
          git push origin owner-source
