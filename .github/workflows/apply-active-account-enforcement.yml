name: Apply Active Account Enforcement

on:
  push:
    branches: [owner-source]
    paths:
      - 'scripts/apply_active_account_enforcement.py'
      - '.github/workflows/apply-active-account-enforcement.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout owner-source
        uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0

      - name: Preserve helper
        run: cp scripts/apply_active_account_enforcement.py /tmp/apply_active_account_enforcement.py

      - name: Patch Owner
        run: python scripts/apply_active_account_enforcement.py

      - name: Commit Owner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/pb_service.dart lib/providers/auth_provider.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Enforce active accounts across all roles'
            git push origin HEAD:owner-source
          fi

      - name: Checkout user-source
        run: |
          git fetch origin user-source
          git checkout -B user-source origin/user-source

      - name: Patch User
        run: python /tmp/apply_active_account_enforcement.py

      - name: Commit User
        run: |
          git add lib/services/pb_service.dart lib/providers/auth_provider.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Enforce active accounts across all roles'
            git push origin HEAD:user-source
          fi
