name: Customer Dashboard Redesign Once
'on':
  push:
    branches:
      - owner-source
    paths:
      - .github/workflows/customer-dashboard-redesign-once.yml

permissions:
  contents: write

jobs:
  patch-both:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Patch Owner customer dashboard
        run: |
          python scripts/customer_dashboard_redesign.py
          git add lib/screens/customer/customer_dashboard.dart
          git commit -m "Redesign customer finance dashboard"
          git push origin owner-source
      - name: Patch User customer dashboard
        run: |
          cp scripts/customer_dashboard_redesign.py /tmp/customer_dashboard_redesign.py
          git fetch origin user-source
          git checkout user-source
          python /tmp/customer_dashboard_redesign.py
          git add lib/screens/customer/customer_dashboard.dart
          git commit -m "Redesign customer finance dashboard"
          git push origin user-source
