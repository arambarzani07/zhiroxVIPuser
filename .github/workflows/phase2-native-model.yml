name: Zhirox Phase 2 Native Model Migration

on:
  push:
    branches: [zhirox-user-structure-v2]
    paths: [.phase2-trigger]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout structure branch
        uses: actions/checkout@v4
        with:
          ref: zhirox-user-structure-v2
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Remove legacy PocketBase compatibility surface
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          old_import = "import 'package:pocketbase/pocketbase.dart';"
          new_import = "import 'package:zhirox/models/record_model.dart';"

          for path in (root / 'lib').rglob('*.dart'):
              text = path.read_text()
              text = text.replace(old_import, new_import)
              text = text.replace("getStringValue('password_text')", "''")
              path.write_text(text)

          login = root / 'lib/screens/auth/login_screen.dart'
          if login.exists():
              text = login.read_text()
              text = text.replace("import 'package:zhirox/screens/auth/admin_management_screen.dart';\n", '')
              login.write_text(text)

          for rel in (
              'lib/screens/auth/admin_management_screen.dart',
              'lib/screens/auth/register_admin_screen.dart',
          ):
              path = root / rel
              if path.exists():
                  path.unlink()

          pubspec = root / 'pubspec.yaml'
          text = pubspec.read_text()
          text = re.sub(r'(?m)^\s*pocketbase:\s*[^\n]+\n', '', text)
          text = re.sub(r'(?m)^\s*# Temporary UI compatibility type only.*\n', '', text)
          text = re.sub(r'(?m)^\s*# Phase 2 replaces this.*\n', '', text)
          pubspec.write_text(text)

          pbx = root / 'ios/Runner.xcodeproj/project.pbxproj'
          if pbx.exists():
              text = pbx.read_text().replace(
                  'IPHONEOS_DEPLOYMENT_TARGET = 13.0;',
                  'IPHONEOS_DEPLOYMENT_TARGET = 15.0;',
              )
              pbx.write_text(text)

          legacy_imports = []
          password_refs = []
          for path in (root / 'lib').rglob('*.dart'):
              text = path.read_text()
              if 'package:pocketbase/' in text:
                  legacy_imports.append(str(path))
              if 'password_text' in text:
                  password_refs.append(str(path))

          if legacy_imports:
              raise SystemExit('Legacy PocketBase imports remain: ' + ', '.join(legacy_imports))
          if password_refs:
              raise SystemExit('password_text references remain: ' + ', '.join(password_refs))
          PY

      - name: Refresh dependencies
        run: flutter pub get

      - name: Analyze migrated source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Remove one-time trigger and workflow
        run: rm -f .phase2-trigger .github/workflows/phase2-native-model.yml

      - name: Commit phase 2
        run: |
          git config user.name 'zhirox-structure-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Complete phase 2 native model migration'
          git push origin HEAD:zhirox-user-structure-v2
