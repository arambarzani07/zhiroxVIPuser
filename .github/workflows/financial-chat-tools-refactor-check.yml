name: Financial Chat Tools Refactor Check

on:
  push:
    branches: [financial-chat-tools-refactor-20260925]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Verify online-only policy
        run: python3 scripts/verify_online_only.py
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
