name: Patch Empty Debt Date
'on':
  push:
    branches:
      - owner-source
    paths:
      - .github/workflows/patch-empty-debt-date-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0
      - name: Normalize optional debt dates
        run: |
          python3 <<'PY'
          from pathlib import Path

          compat = Path('lib/services/supabase_compat.dart')
          text = compat.read_text()
          anchor = """    if (logicalName == 'debts') {
              if (result.containsKey('customer')) {"""
          replacement = """    if (logicalName == 'debts') {
              // Optional PostgreSQL date/timestamp columns must receive NULL,
              // never an empty string (which raises Postgres error 22007).
              for (final key in const ['due_date', 'custom_date']) {
                final value = result[key];
                if (value is String && value.trim().isEmpty) {
                  result[key] = null;
                }
              }
              if (result.containsKey('customer')) {"""
          assert text.count(anchor) == 1, f'compat anchor count={text.count(anchor)}'
          compat.write_text(text.replace(anchor, replacement, 1))

          service = Path('lib/services/pb_service.dart')
          text = service.read_text()
          old = "      'due_date': dueDate,"
          new = "      'due_date': dueDate.trim().isEmpty ? null : dueDate,"
          assert text.count(old) == 1, f'create due_date anchor count={text.count(old)}'
          text = text.replace(old, new, 1)

          old = """  static Future<void> updateDebt(String id, Map<String, dynamic> data) async {
              await pb.collection('debts').update(id, body: data);
            }"""
          new = """  static Future<void> updateDebt(String id, Map<String, dynamic> data) async {
              final normalized = Map<String, dynamic>.from(data);
              for (final key in const ['due_date', 'custom_date']) {
                final value = normalized[key];
                if (value is String && value.trim().isEmpty) {
                  normalized[key] = null;
                }
              }
              await pb.collection('debts').update(id, body: normalized);
            }"""
          assert text.count(old) == 1, f'updateDebt anchor count={text.count(old)}'
          service.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/pb_service.dart lib/services/supabase_compat.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Normalize empty optional debt dates to null'
          git push origin owner-source
