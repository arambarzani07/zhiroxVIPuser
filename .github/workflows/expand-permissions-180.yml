name: Finalize employee permissions 180

on:
  push:
    branches: [user-source]
    paths:
      - '.github/workflows/expand-permissions-180.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: user-source

      - name: Remove stale AuthProvider import
        shell: bash
        run: sed -i '/customer_directory_snapshot\.dart/d' lib/providers/auth_provider.dart

      - name: Verify 180-permission contract
        run: python3 scripts/verify_employee_permissions_contract.py

      - name: Verify clean patch formatting
        run: git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/providers/auth_provider.dart
          git commit -m 'Remove stale customer snapshot import'
          git push origin HEAD:user-source
