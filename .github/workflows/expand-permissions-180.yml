name: Expand employee permissions to 180

on:
  push:
    branches: [user-source]
    paths:
      - 'scripts/expand_permissions_to_180.py'
      - '.github/workflows/expand-permissions-180.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: user-source

      - name: Apply 180-permission patch
        run: python3 scripts/expand_permissions_to_180.py

      - name: Verify 180-permission contract
        run: python3 scripts/verify_employee_permissions_contract.py

      - name: Verify clean patch formatting
        run: git diff --check

      - name: Commit expansion
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib supabase scripts .github/workflows/employee-permissions-contract.yml
          git commit -m 'Expand employee permissions from 60 to 180'
          git push origin HEAD:user-source
