name: OneSignal integration contract

on:
  push:
    branches: [user-source]
    paths:
      - 'pubspec.yaml'
      - 'lib/main.dart'
      - 'lib/widgets/remote_notification_gate.dart'
      - 'lib/services/notification_service.dart'
      - 'lib/services/onesignal_push_service.dart'
      - 'supabase/functions/_shared/onesignal.ts'
      - 'supabase/functions/onesignal-send/**'
      - 'supabase/functions/customer-push-events/**'
      - 'supabase/functions/record-payment/**'
      - 'supabase/functions/customer-push-worker/**'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'ios/Runner/Info.plist'
      - 'ios/Runner/Runner.entitlements'
      - 'ios/Flutter/Debug.xcconfig'
      - 'ios/Flutter/Release.xcconfig'
      - 'codemagic.yaml'
      - 'scripts/verify_onesignal_integration.py'
      - '.github/workflows/onesignal-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify OneSignal source contracts
        run: python3 scripts/verify_onesignal_integration.py
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check OneSignal sender
        run: deno check supabase/functions/onesignal-send/index.ts
      - name: Type-check debt push pipeline
        run: deno check supabase/functions/customer-push-events/index.ts
      - name: Type-check payment push pipeline
        run: deno check supabase/functions/record-payment/index.ts
      - name: Type-check notification outbox worker
        run: deno check supabase/functions/customer-push-worker/index.ts
