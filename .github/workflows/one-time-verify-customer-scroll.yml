name: Verify customer scrollbar

on:
  push:
    branches:
      - user-source
    paths:
      - .github/workflows/one-time-verify-customer-scroll.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib/screens/shared/user_list_screen.dart
      - name: Remove verifier
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/one-time-verify-customer-scroll.yml
          git add .github/workflows/one-time-verify-customer-scroll.yml
          git commit -m "chore: remove customer scrollbar verifier"
          git push origin HEAD:user-source
