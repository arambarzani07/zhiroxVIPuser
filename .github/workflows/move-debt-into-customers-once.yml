name: Move Debt Into Customers Once

on:
  push:
    branches:
      - owner-source
    paths:
      - '.github/workflows/move-debt-into-customers-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner-source
      - name: Apply navigation migration
        run: python3 scripts/move_debt_into_customers.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/admin/admin_dashboard.dart lib/screens/employee/employee_dashboard.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Move debt navigation into customer section'
          git push origin HEAD:owner-source
