name: Customer Push Task 7 Flutter TDD

on:
  push:
    branches: [user-source]
    paths:
      - 'lib/services/customer_push_service.dart'
      - 'lib/widgets/customer_push_card.dart'
      - 'lib/screens/shared/user_profile_screen.dart'
      - 'test/customer_push_service_test.dart'
      - 'test/customer_push_card_test.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/customer-push-task7-flutter-tdd.yml'

permissions:
  contents: read

jobs:
  customer-push-flutter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Run customer push service tests
        run: flutter test test/customer_push_service_test.dart
