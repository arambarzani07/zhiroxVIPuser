name: Financial Chat Phase 2 Once

on:
  push:
    branches:
      - user-source
    paths:
      - '.github/workflows/financial-chat-phase2-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: user-source
      - name: Apply Financial Chat migration
        run: python3 scripts/financial_chat_phase2.py
      - name: Commit Financial Chat
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/shared/user_profile_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Upgrade customer transactions to Financial Chat'
          git push origin HEAD:user-source
