name: Compact Timeline Redesign Once
'on':
  push:
    branches:
      - owner-source
    paths:
      - .github/workflows/compact-timeline-redesign-once.yml

permissions:
  contents: write

jobs:
  patch-both:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0
      - name: Patch Owner timeline
        run: |
          python3 scripts/compact_timeline_patch.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/shared/user_profile_screen.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Compact debt and payment timeline UI'
            git push origin owner-source
          fi
          cp scripts/compact_timeline_patch.py /tmp/compact_timeline_patch.py
      - name: Patch User timeline
        run: |
          git fetch origin user-source
          git checkout -B user-source origin/user-source
          python3 /tmp/compact_timeline_patch.py
          git diff --check
          git add lib/screens/shared/user_profile_screen.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Compact debt and payment timeline UI'
            git push origin user-source
          fi
