name: Patch Owner admin metadata

on:
  push:
    branches:
      - owner-source
    paths:
      - 'scripts/patch_owner_admin_metadata_only.py'
      - '.github/workflows/patch-owner-admin-metadata.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch account-admin
        run: python3 scripts/patch_owner_admin_metadata_only.py
      - name: Verify privacy boundary
        run: |
          grep -q "platform/account metadata only" supabase/functions/account-admin/index.ts
          ! grep -q "employee_count" supabase/functions/account-admin/index.ts
          ! grep -q "customer_count" supabase/functions/account-admin/index.ts
          python3 scripts/verify_online_only.py
      - name: Commit account-admin privacy fix
        run: |
          if [ -z "$(git status --porcelain -- supabase/functions/account-admin/index.ts)" ]; then
            echo "account-admin already privacy-safe"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/account-admin/index.ts
          git commit -m "Limit Owner admin list to account metadata"
          git push
