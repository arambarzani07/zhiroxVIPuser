name: One-time fix financial event marker
on:
  push:
    branches: [user-source]
    paths:
      - '.github/workflows/one-time-fix-financial-event-marker.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: user-source
          fetch-depth: 0
      - name: Remove accidental marker
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('lib/services/pb_service.dart')
          text = p.read_text()
          needle = "\n  \\\n  static Future<List<RecordModel>> getFinancialEvents(String customerId) async {"
          replacement = "\n  static Future<List<RecordModel>> getFinancialEvents(String customerId) async {"
          if needle not in text:
              raise SystemExit('marker not found')
          p.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-fix-financial-event-marker.yml
          git add lib/services/pb_service.dart
          git commit -m 'fix: clean financial event pagination syntax'
          git push origin user-source
