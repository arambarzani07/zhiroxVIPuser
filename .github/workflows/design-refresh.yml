name: Design refresh verification
on:
  push:
    branches: ['design/**']
  pull_request:
    branches: [user-source, owner-source]
    paths: ['lib/**', 'test/design_refresh_test.dart', '.github/workflows/design-refresh.yml']
permissions:
  contents: read
jobs:
  flutter-design:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test test/design_refresh_test.dart
