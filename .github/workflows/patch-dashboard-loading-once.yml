name: Patch Dashboard Loading Once

on:
  push:
    branches: [user-source]
    paths:
      - '.github/workflows/patch-dashboard-loading-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: user-source
          fetch-depth: 0
      - name: Patch dashboard loading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          d=lambda s: base64.b64decode(s).decode()
          p=Path('lib/screens/admin/admin_dashboard.dart')
          t=p.read_text()
          t=t.replace("import 'dart:convert';\n", '')
          t=t.replace("import 'package:shared_preferences/shared_preferences.dart';\n", '')
          old_fields=d('ICBNYXA8U3RyaW5nLCBkeW5hbWljPiBfc3RhdHMgPSB7fTsKICBib29sIF9pc0xvYWRpbmcgPSB0cnVlOwogIFN0cmVhbVN1YnNjcmlwdGlvbjxib29sPj8gX2Nvbm5lY3Rpdml0eVN1Yjs=')
          new_fields=d('ICBNYXA8U3RyaW5nLCBkeW5hbWljPiBfc3RhdHMgPSB7fTsKICBib29sIF9pc0xvYWRpbmcgPSB0cnVlOwogIFN0cmluZz8gX3N0YXRzRXJyb3I7CiAgRnV0dXJlPHZvaWQ+PyBfc3RhdHNMb2FkOwogIFN0cmVhbVN1YnNjcmlwdGlvbjxib29sPj8gX2Nvbm5lY3Rpdml0eVN1Yjs=')
          assert old_fields in t
          t=t.replace(old_fields,new_fields,1)
          old_init=d('ICAgIF9sb2FkU3RhdHMoKTsKICAgIF9jb25uZWN0aXZpdHlTdWIgPSBDb25uZWN0aXZpdHlTZXJ2aWNlLmluc3RhbmNlLnN0YXR1c1N0cmVhbS5saXN0ZW4oKG9ubGluZSkgewogICAgICBpZiAob25saW5lICYmIG1vdW50ZWQpIF9sb2FkU3RhdHMoKTsKICAgIH0pOw==')
          new_init=d('ICAgIHVuYXdhaXRlZChfbG9hZFN0YXRzKCkpOwogICAgX2Nvbm5lY3Rpdml0eVN1YiA9IENvbm5lY3Rpdml0eVNlcnZpY2UuaW5zdGFuY2Uuc3RhdHVzU3RyZWFtLmxpc3Rlbigob25saW5lKSB7CiAgICAgIGlmIChvbmxpbmUgJiYgbW91bnRlZCkgdW5hd2FpdGVkKF9sb2FkU3RhdHMoKSk7CiAgICB9KTs=')
          assert old_init in t
          t=t.replace(old_init,new_init,1)
          start=t.index('  Future<void> _loadStats() async {')
          end=t.index('\n  @override\n  Widget build',start)
          t=t[:start]+d('')+t[end:]
          old_nav=d('ICAgICAgb25UYXA6ICgpIHsKICAgICAgICBzZXRTdGF0ZSgoKSA9PiBfY3VycmVudEluZGV4ID0gaW5kZXgpOwogICAgICAgIGlmIChpbmRleCA9PSAwKSBfbG9hZFN0YXRzKCk7CiAgICAgIH0s')
          new_nav=d('ICAgICAgb25UYXA6ICgpIHsKICAgICAgICBpZiAoX2N1cnJlbnRJbmRleCA9PSBpbmRleCkgcmV0dXJuOwogICAgICAgIHNldFN0YXRlKCgpID0+IF9jdXJyZW50SW5kZXggPSBpbmRleCk7CiAgICAgICAgaWYgKGluZGV4ID09IDApIHVuYXdhaXRlZChfbG9hZFN0YXRzKCkpOwogICAgICB9LA==')
          assert old_nav in t
          t=t.replace(old_nav,new_nav,1)
          old_dash=d('ICBXaWRnZXQgX2J1aWxkTmV3RGFzaGJvYXJkKEF1dGhQcm92aWRlciBhdXRoKSB7CiAgICBpZiAoX2lzTG9hZGluZykgewogICAgICByZXR1cm4gY29uc3QgQ2VudGVyKGNoaWxkOiBDaXJjdWxhclByb2dyZXNzSW5kaWNhdG9yKCkpOwogICAgfQogICAgZmluYWwgaXNEYXJrID0gVGhlbWUub2YoY29udGV4dCkuYnJpZ2h0bmVzcyA9PSBCcmlnaHRuZXNzLmRhcms7')
          new_dash=d('')
          assert old_dash in t
          t=t.replace(old_dash,new_dash,1)
          assert 'cached_admin_stats_' not in t
          p.write_text(t)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/admin/admin_dashboard.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Make admin dashboard loading online-only and single-flight'
          git push origin user-source
