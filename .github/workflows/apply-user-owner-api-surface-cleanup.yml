name: Apply User Owner API Surface Cleanup

on:
  push:
    branches: [user-source]
    paths:
      - 'scripts/apply_user_owner_api_surface_cleanup.py'
      - '.github/workflows/apply-user-owner-api-surface-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user-source
        uses: actions/checkout@v4
        with:
          ref: user-source
          fetch-depth: 0

      - name: Apply API cleanup
        run: python scripts/apply_user_owner_api_surface_cleanup.py

      - name: Commit User API cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/pb_service.dart scripts/verify_online_only.py
          if ! git diff --cached --quiet; then
            git commit -m 'Remove owner-only APIs from User client'
            git push origin HEAD:user-source
          fi
