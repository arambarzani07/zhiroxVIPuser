name: Auth Security Probe

on:
  push:
    branches: [auth-security-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read password-related Auth config safely
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: hsoyfbtpvwfmjokudznx
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth")"
          printf '%s' "$response" | jq '
            with_entries(
              select(.key | test("password|hibp"; "i"))
              | if (.value|type) == "boolean" or (.value|type) == "number"
                then .
                else .value = "<redacted>"
                end
            )
          '
