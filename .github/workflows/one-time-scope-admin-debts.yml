name: One-time scope admin debts
on:
  push:
    branches: [owner-source]
    paths:
      - '.github/workflows/one-time-scope-admin-debts.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0
      - name: Scope admin debt reports server-side
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64
          path = Path('lib/services/pb_service.dart')
          text = path.read_text()
          start = text.index('  static Future<List<RecordModel>> getAllAdminDebts({')
          end = text.index('  static Future<Map<String, dynamic>> getDebtsPaginated({', start)
          replacement = base64.b64decode('').decode()
          block = text[start:end]
          if ".inFilter('customer_id', chunk)" in block:
              raise SystemExit('admin debt report already tenant-scoped')
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-scope-admin-debts.yml
          git add lib/services/pb_service.dart
          git diff --cached --check
          git commit -m 'perf(owner): scope admin debt reports server-side'
          git push origin owner-source
