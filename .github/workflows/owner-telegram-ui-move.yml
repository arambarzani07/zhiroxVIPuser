name: Move Telegram token UI to Owner

on:
  push:
    branches:
      - owner-source
    paths:
      - '.github/workflows/owner-telegram-ui-move.yml'

permissions:
  contents: write

jobs:
  move_ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Owner
        uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0

      - name: Patch Owner dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('lib/screens/auth/owner_dashboard.dart')
          text = path.read_text()
          old_import = "import 'package:zhirox/screens/auth/owner_operations_center_screen.dart';\n"
          new_import = old_import + "import 'package:zhirox/screens/auth/owner_telegram_bot_settings_screen.dart';\n"
          if 'owner_telegram_bot_settings_screen.dart' not in text:
              if old_import not in text:
                  raise SystemExit('Owner operations import not found')
              text = text.replace(old_import, new_import, 1)
          if 'const OwnerTelegramBotSettingsScreen()' not in text:
              pattern = re.compile(r"(\s+_OwnerRow\(\n\s+title: 'ئۆپەراسیۆن',\n\s+subtitle: 'Maintenance، status و ئاگادارکردنەوەی گشتی',\n\s+icon: Icons\.settings_input_antenna_rounded,\n\s+tint: scheme\.secondary,\n\s+onTap: \(\) =>\n\s+_open\(context, const OwnerOperationsCenterScreen\(\)\),\n\s+\),\n)")
              match = pattern.search(text)
              if not match:
                  raise SystemExit('Owner operations row not found')
              indent = '                '
              row = indent + "_OwnerRow(\n" + indent + "  title: 'Telegram Bot',\n" + indent + "  subtitle: 'Bot Token، Webhook و دۆخی پەیوەندی',\n" + indent + "  icon: Icons.telegram_rounded,\n" + indent + "  tint: const Color(0xFF2AABEE),\n" + indent + "  onTap: () => _open(\n" + indent + "    context,\n" + indent + "    const OwnerTelegramBotSettingsScreen(),\n" + indent + "  ),\n" + indent + "),\n"
              text = text[:match.end()] + row + text[match.end():]
          path.write_text(text)
          PY

      - name: Commit Owner navigation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/auth/owner_dashboard.dart
          if ! git diff --cached --quiet; then
            git commit -m "move Telegram bot token control to Owner app"
            git push origin HEAD:owner-source
          fi

      - name: Cleanup User token UI
        run: |
          git fetch origin user-source
          git checkout -B user-source origin/user-source
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('lib/screens/admin/admin_settings_screen.dart')
          text = path.read_text()
          text = text.replace("import 'package:zhirox/screens/admin/telegram_bot_settings_screen.dart';\n", '')
          pattern = re.compile(r"\s+if \(auth\.user\?\.getBoolValue\('is_system_owner'\) \?\? false\)\n\s+_SettingsRow\(\n\s+icon: Icons\.telegram_rounded,\n\s+title: 'Telegram Bot',\n\s+subtitle: 'Bot Token، Webhook و دۆخی پەیوەندی',\n\s+onTap: \(\) => _open\(\n\s+context,\n\s+const TelegramBotSettingsScreen\(\),\n\s+\),\n\s+\),\n")
          text, count = pattern.subn('\n', text, count=1)
          if count != 1:
              raise SystemExit('User Telegram settings row not found')
          path.write_text(text)
          for name in ('lib/screens/admin/telegram_bot_settings_screen.dart', 'lib/services/telegram_admin_service.dart'):
              file = Path(name)
              if file.exists():
                  file.unlink()
          PY
          git add -A lib/screens/admin/admin_settings_screen.dart lib/screens/admin/telegram_bot_settings_screen.dart lib/services/telegram_admin_service.dart
          if ! git diff --cached --quiet; then
            git commit -m "keep Telegram token management out of User app"
            git push origin HEAD:user-source
          fi
