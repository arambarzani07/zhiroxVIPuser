name: Fix Employee Create Reliability

on:
  push:
    branches:
      - user-source
    paths:
      - .github/workflows/fix-employee-create.yml
      - scripts/fix_employee_create.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: user-source
      - name: Apply patch
        run: python3 scripts/fix_employee_create.py
      - name: Verify patch
        run: |
          git diff --check
          grep -q "can_view_customer_phone: canViewCustomerPhone" supabase/functions/account-admin/index.ts
          grep -q "canViewCustomerPhone: _canViewCustomerPhone" lib/screens/shared/add_user_screen.dart
          grep -q "لانیکەم ١٢ پیت + Aa1!" lib/screens/shared/add_user_screen.dart
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/shared/add_user_screen.dart lib/services/pb_service.dart lib/utils/helpers.dart supabase/functions/account-admin/index.ts test/add_employee_creation_contract_test.dart
          git commit -m "Fix employee creation with all 60 permissions and strong password validation"
          git push origin HEAD:user-source
