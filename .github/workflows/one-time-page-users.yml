name: One-time page users
on:
  push:
    branches: [user-source]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Page profile reads server-side
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/services/pb_service.dart')
          text = path.read_text()
          pattern = re.compile(
              r"  static Future<List<RecordModel>> getUsers\(\{.*?\n  static Future<RecordModel> getUser\(",
              re.S,
          )
          replacement = r'''  static Future<List<RecordModel>> getUsers({
    String? role,
    String? search,
    String? adminId,
    bool? approved,
  }) async {
    if (search != null && search.isNotEmpty) {
      final filters = <String>[];
      if (role != null) filters.add('role = \"${_sanitize(role)}\"');
      if (adminId != null) {
        filters.add('admin_id = \"${_sanitize(adminId)}\"');
      }
      if (approved != null) filters.add('approved = $approved');
      final q = _sanitize(search);
      filters.add('(name ~ \"$q\" || father_name ~ \"$q\" || phone ~ \"$q\")');
      final result = await pb.collection('users').getList(
        filter: filters.join(' && '),
        sort: '-created',
        perPage: 500,
      );
      return result.items;
    }

    await ensureInitialized();
    const pageSize = 500;
    var offset = 0;
    final users = <RecordModel>[];
    while (true) {
      dynamic query = client.from('profiles').select();
      if (role != null) query = query.eq('role', role);
      if (adminId != null) query = query.eq('admin_id', adminId);
      if (approved != null) query = query.eq('approved', approved);
      final raw = await query
          .order('created_at', ascending: false)
          .order('id', ascending: false)
          .range(offset, offset + pageSize - 1);
      final page = (raw as List)
          .map((row) => _profileRecord(Map<String, dynamic>.from(row as Map)))
          .toList(growable: false);
      users.addAll(page);
      if (page.length < pageSize) break;
      offset += pageSize;
    }
    return users;
  }

  static Future<RecordModel> getUser('''
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one getUsers block, found {count}')
          path.write_text(updated)
          PY
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-page-users.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'perf: page profile reads server-side'
          git push
