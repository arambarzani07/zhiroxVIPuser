name: Finalize Owner governance

on:
  push:
    branches:
      - owner-source
    paths:
      - '.github/workflows/finalize-owner-governance.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Owner governance contracts
        run: |
          python3 scripts/verify_owner_permission_registry.py
          python3 scripts/verify_owner_permission_enforcement.py
          python3 scripts/verify_owner_account_admin_governance.py

      - name: Deploy account-admin Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          npx --yes supabase@latest functions deploy account-admin --project-ref "$SUPABASE_PROJECT_REF"

      - name: Remove one-shot patch scaffolding
        run: |
          rm -f scripts/patch_account_admin_owner_governance.py
          rm -f .github/workflows/patch-account-admin-owner-governance.yml
          rm -f .github/workflows/finalize-owner-governance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes"
            exit 0
          fi
          git commit -m "Finalize Owner governance cleanup"
          git push
