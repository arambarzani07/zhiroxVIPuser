name: Deploy Google Vision OCR

on:
  push:
    branches: [user-source]
    paths:
      - 'supabase/functions/google-vision-ocr/**'
      - '.github/workflows/deploy-google-vision-ocr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-google-vision-ocr-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: madoflmbretqghqbqaak
    steps:
      - name: Checkout user source
        uses: actions/checkout@v4
        with:
          ref: user-source

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is missing" >&2; exit 1; }
          test "$SUPABASE_PROJECT_REF" = "madoflmbretqghqbqaak" || { echo "Unexpected project ref" >&2; exit 1; }
          test -s supabase/functions/google-vision-ocr/index.ts || { echo "OCR function source missing" >&2; exit 1; }

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy authenticated OCR function
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy google-vision-ocr \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Record deployment summary
        shell: bash
        run: |
          {
            echo '## Google Vision OCR'
            echo '- Project: `madoflmbretqghqbqaak`'
            echo '- Function: `google-vision-ocr`'
            echo '- JWT verification: enabled'
            echo '- Provider secret expected: `GOOGLE_VISION_API_KEY` (server-side only)'
          } >> "$GITHUB_STEP_SUMMARY"
