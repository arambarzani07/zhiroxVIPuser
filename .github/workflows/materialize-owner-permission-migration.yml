name: Materialize Owner permission migration

on:
  push:
    branches:
      - owner-source
    paths:
      - 'scripts/materialize_owner_permission_migration.py'
      - '.github/workflows/materialize-owner-permission-migration.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize migration
        run: python3 scripts/materialize_owner_permission_migration.py
      - name: Verify generated migration
        run: |
          test -s supabase/migrations/20260930130637_owner_permission_governance_v1.sql
          grep -q "owner_permission_catalog" supabase/migrations/20260930130637_owner_permission_governance_v1.sql
          grep -q "owner_permission_grants" supabase/migrations/20260930130637_owner_permission_governance_v1.sql
      - name: Commit migration
        run: |
          if [ -z "$(git status --porcelain -- supabase/migrations/20260930130637_owner_permission_governance_v1.sql)" ]; then
            echo "Migration already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260930130637_owner_permission_governance_v1.sql
          git commit -m "Persist Owner permission governance migration"
          git push
