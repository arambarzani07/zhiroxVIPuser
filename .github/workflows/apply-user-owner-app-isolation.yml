name: Apply User Owner App Isolation

on:
  push:
    branches: [user-source]
    paths:
      - 'scripts/apply_user_owner_app_isolation.py'
      - '.github/workflows/apply-user-owner-app-isolation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user-source
        uses: actions/checkout@v4
        with:
          ref: user-source
          fetch-depth: 0

      - name: Apply isolation patch
        run: python scripts/apply_user_owner_app_isolation.py

      - name: Commit User isolation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart scripts/verify_online_only.py
          if ! git diff --cached --quiet; then
            git commit -m 'Enforce User app System Owner isolation'
            git push origin HEAD:user-source
          fi
