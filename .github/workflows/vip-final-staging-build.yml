name: VIP final staging build (user)
on:
  push:
    branches: [vip-final-user-staging]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vip-final-staging-user
  cancel-in-progress: true
jobs:
  verify-build:
    if: github.ref_name == 'vip-final-user-staging'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify final project configuration
        run: |
          grep -F 'https://ryzgbajgjctmliwhvezo.supabase.co' lib/utils/constants.dart >/dev/null
          ! grep -F 'madoflmbretqghqbqaak' lib/utils/constants.dart
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Verify unsigned iOS build only
        run: |
          flutter build ios --release --no-codesign \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define=ZHIROX_BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
            --dart-define=ZHIROX_APP_EDITION=user
          test -f build/ios/iphoneos/Runner.app/Info.plist
      - name: Confirm no production release
        run: echo 'Staging compilation only. No release, IPA distribution or database cutover.'
