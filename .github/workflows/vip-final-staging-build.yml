name: VIP final staging build (user)
on:
  push:
    branches: [vip-final-user-staging]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vip-final-staging-user
  cancel-in-progress: true
jobs:
  verify-build:
    if: github.ref_name == 'vip-final-user-staging'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify final project configuration
        run: |
          grep -F 'https://ryzgbajgjctmliwhvezo.supabase.co' lib/utils/constants.dart >/dev/null
          ! grep -F 'madoflmbretqghqbqaak' lib/utils/constants.dart
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Set separate staging app identity
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('ios/Runner.xcodeproj/project.pbxproj')
          s = p.read_text()
          s, n = re.subn(r'PRODUCT_BUNDLE_IDENTIFIER = com\.karoxghafoor\.zhirox(?:\.[a-zA-Z0-9_]+)*;', 'PRODUCT_BUNDLE_IDENTIFIER = com.karoxghafoor.zhirox.user.staging;', s)
          assert n >= 3, 'Expected app bundle identifier settings'
          p.write_text(s)
          PY
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName ZHIROX User Test' ios/Runner/Info.plist
      - name: Build staging app without signing
        run: |
          flutter build ios --release --no-codesign \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define=ZHIROX_BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
            --dart-define=ZHIROX_APP_EDITION=user \
            --dart-define=ZHIROX_STAGING=true
          test -f build/ios/iphoneos/Runner.app/Info.plist
      - name: Package and verify unsigned staging IPA
        run: |
          set -euo pipefail
          APP=build/ios/iphoneos/Runner.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.karoxghafoor.zhirox.user.staging'
          mkdir -p Payload
          cp -R "$APP" Payload/
          find Payload -type d -name _CodeSignature -prune -exec rm -rf {} \;
          find Payload -type f -name embedded.mobileprovision -delete
          /usr/bin/zip -qry 'ZHIROX-User-Staging.ipa' Payload
          unzip -t 'ZHIROX-User-Staging.ipa'
          shasum -a 256 'ZHIROX-User-Staging.ipa' > 'ZHIROX-User-Staging.ipa.sha256'
      - uses: actions/upload-artifact@v4
        with:
          name: ZHIROX-User-Staging-IPA
          path: |
            ZHIROX-User-Staging.ipa
            ZHIROX-User-Staging.ipa.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Confirm no production release
        run: echo 'Staging artifact only. No official release or database cutover.'
