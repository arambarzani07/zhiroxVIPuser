name: Enforce Global Online Gate Once
'on':
  push:
    branches:
      - owner-source
jobs:
  patch-both:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Patch Owner
        run: |
          python scripts/enforce_global_online_gate.py .
          git add lib/main.dart lib/providers/auth_provider.dart pubspec.yaml
          git commit -m 'Enforce global online-only gate'
          git push origin HEAD:owner-source
      - name: Patch User
        run: |
          git worktree add /tmp/user-source origin/user-source
          python scripts/enforce_global_online_gate.py /tmp/user-source
          cd /tmp/user-source
          git add lib/main.dart lib/providers/auth_provider.dart pubspec.yaml
          git commit -m 'Enforce global online-only gate'
          git push origin HEAD:user-source
