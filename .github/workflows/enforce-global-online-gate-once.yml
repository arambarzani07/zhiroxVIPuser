name: Enforce Global Online Gate Once
'on':
  push:
    branches:
      - owner-source
jobs:
  patch-both:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Patch Owner and User
        shell: bash
        run: |
          cat > /tmp/patch_online_gate.py <<'PY'
          from pathlib import Path
          import re, sys

          root = Path(sys.argv[1])

          auth = root / 'lib/providers/auth_provider.dart'
          text = auth.read_text()
          text = text.replace("import 'dart:convert';\n\n", '')
          text = text.replace("import 'package:flutter_secure_storage/flutter_secure_storage.dart';\n", '')
          text = text.replace("  static const _secureStorage = FlutterSecureStorage();\n\n", '')
          text = text.replace("        await _cacheUser();\n", '')
          text = text.replace("      await _cacheUser();\n", '')
          text = re.sub(
              r"\n  Future<void> _cacheUser\(\) async \{.*?\n  \}\n\n  Future<void> _clearLocalUser\(\) async \{\n    _user = null;\n    await _secureStorage\.delete\(key: 'user_id'\);\n    await _secureStorage\.delete\(key: 'user_data'\);\n  \}",
              "\n  Future<void> _clearLocalUser() async {\n    _user = null;\n  }",
              text,
              flags=re.S,
          )
          text = text.replace(
              "      // ZHIROX is online-only: never restore an authenticated app session\n      // from cached profile data when the server profile cannot be verified.\n",
              "      // ZHIROX is online-only: a persisted Supabase session is accepted only\n      // after the current server profile and subscription are verified online.\n",
          )
          auth.write_text(text)

          main = root / 'lib/main.dart'
          text = main.read_text()
          text = text.replace('_ConnectivityBanner(child: child!)', '_OnlineOnlyGate(child: child!)')
          start = text.index('class _ConnectivityBanner extends StatefulWidget')
          replacement = r'''class _OnlineOnlyGate extends StatefulWidget {
  final Widget child;
  const _OnlineOnlyGate({required this.child});

  @override
  State<_OnlineOnlyGate> createState() => _OnlineOnlyGateState();
}

class _OnlineOnlyGateState extends State<_OnlineOnlyGate> {
  late StreamSubscription<bool> _sub;
  bool _isOnline = ConnectivityService.instance.isOnline;
  bool _checking = false;

  @override
  void initState() {
    super.initState();
    _sub = ConnectivityService.instance.statusStream.listen((online) {
      if (mounted) setState(() => _isOnline = online);
    });
  }

  @override
  void dispose() {
    _sub.cancel();
    super.dispose();
  }

  Future<void> _retry() async {
    if (_checking) return;
    setState(() => _checking = true);
    final online = await ConnectivityService.instance.checkNow();
    if (!mounted) return;
    setState(() {
      _isOnline = online;
      _checking = false;
    });
  }

  @override
  Widget build(BuildContext context) {
    if (_isOnline) return widget.child;

    final isDark = Theme.of(context).brightness == Brightness.dark;
    final background = isDark ? AppDarkColors.background : const Color(0xFFF7F8FA);
    final surface = isDark ? AppDarkColors.card : Colors.white;
    final border = isDark ? AppDarkColors.cardBorder : const Color(0xFFEAECF0);
    final primaryText = isDark ? AppDarkColors.textPrimary : const Color(0xFF1D2939);
    final secondaryText = isDark ? AppDarkColors.textSecondary : const Color(0xFF667085);

    return Stack(
      children: [
        Positioned.fill(
          child: IgnorePointer(
            ignoring: true,
            child: widget.child,
          ),
        ),
        Positioned.fill(
          child: Material(
            color: background,
            child: SafeArea(
              child: Center(
                child: SingleChildScrollView(
                  padding: const EdgeInsets.all(24),
                  child: ConstrainedBox(
                    constraints: const BoxConstraints(maxWidth: 420),
                    child: Container(
                      padding: const EdgeInsets.all(22),
                      decoration: BoxDecoration(
                        color: surface,
                        borderRadius: BorderRadius.circular(20),
                        border: Border.all(color: border),
                      ),
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          Container(
                            width: 58,
                            height: 58,
                            alignment: Alignment.center,
                            decoration: BoxDecoration(
                              color: Colors.orange.withValues(alpha: 0.10),
                              borderRadius: BorderRadius.circular(17),
                            ),
                            child: const Icon(
                              Icons.wifi_off_rounded,
                              color: Colors.orange,
                              size: 29,
                            ),
                          ),
                          const SizedBox(height: 16),
                          Text(
                            'پەیوەندی ئینتەرنێت پێویستە',
                            textAlign: TextAlign.center,
                            style: TextStyle(
                              color: primaryText,
                              fontSize: 17,
                              fontWeight: FontWeight.w800,
                            ),
                          ),
                          const SizedBox(height: 8),
                          Text(
                            'ژیرۆکس تەنها بە شێوەی ئۆنلاین کار دەکات. پەیوەندی ئینتەرنێتەکەت بپشکنە و دووبارە هەوڵ بدە.',
                            textAlign: TextAlign.center,
                            style: TextStyle(
                              color: secondaryText,
                              fontSize: 12.5,
                              height: 1.7,
                            ),
                          ),
                          const SizedBox(height: 18),
                          SizedBox(
                            width: double.infinity,
                            child: ElevatedButton.icon(
                              onPressed: _checking ? null : _retry,
                              icon: _checking
                                  ? const SizedBox(
                                      width: 18,
                                      height: 18,
                                      child: CircularProgressIndicator(
                                        strokeWidth: 2,
                                        color: Colors.white,
                                      ),
                                    )
                                  : const Icon(Icons.refresh_rounded, size: 19),
                              label: Text(_checking ? 'دەچێتەوە...' : 'دووبارە هەوڵ بدە'),
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              ),
            ),
          ),
        ),
      ],
    );
  }
}
'''
          text = text[:start] + replacement
          main.write_text(text)

          pub = root / 'pubspec.yaml'
          p = pub.read_text()
          p = p.replace('  flutter_secure_storage: ^10.0.0\n', '')
          pub.write_text(p)
          PY

          python /tmp/patch_online_gate.py .
          git add lib/main.dart lib/providers/auth_provider.dart pubspec.yaml
          git commit -m 'Enforce global online-only gate' || true
          git push origin HEAD:owner-source

          git worktree add /tmp/user-source origin/user-source
          python /tmp/patch_online_gate.py /tmp/user-source
          cd /tmp/user-source
          git add lib/main.dart lib/providers/auth_provider.dart pubspec.yaml
          git commit -m 'Enforce global online-only gate' || true
          git push origin HEAD:user-source
