name: Patch account-admin subscription plans

on:
  push:
    branches:
      - owner-source
    paths:
      - 'scripts/patch_account_admin_subscription_plans.py'
      - '.github/workflows/patch-account-admin-subscription-plans.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch account-admin subscription plans
        run: python3 scripts/patch_account_admin_subscription_plans.py
      - name: Verify account-admin security
        run: |
          grep -q "const subscriptionPlanDays: Record<string, number>" supabase/functions/account-admin/index.ts
          grep -q "function resolveSubscriptionPlan(" supabase/functions/account-admin/index.ts
          grep -q "subscription_plan: resolvedSubscription?.plan ?? null," supabase/functions/account-admin/index.ts
          grep -q "subscription_plan: resolvedSubscription.plan," supabase/functions/account-admin/index.ts
          grep -q "platform/account metadata only" supabase/functions/account-admin/index.ts
          ! grep -q "employee_count" supabase/functions/account-admin/index.ts
          ! grep -q "customer_count" supabase/functions/account-admin/index.ts
          python3 scripts/verify_account_admin_security.py
          python3 scripts/verify_online_only.py
      - name: Commit account-admin hardening
        run: |
          if [ -z "$(git status --porcelain -- supabase/functions/account-admin/index.ts)" ]; then
            echo "account-admin subscription plan hardening already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/account-admin/index.ts
          git commit -m "Enforce backend subscription plan durations"
          git push
