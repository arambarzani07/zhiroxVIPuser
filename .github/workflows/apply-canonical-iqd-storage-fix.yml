name: Apply Canonical IQD Storage Fix

on:
  push:
    branches: [owner-source]
    paths:
      - '.github/workflows/apply-canonical-iqd-storage-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Patch owner-source
        run: |
          set -euo pipefail
          git checkout owner-source
          REPO_ROOT="$PWD" python3 scripts/apply_canonical_iqd_storage_fix.py
          git add lib/utils/helpers.dart lib/screens/shared/user_profile_screen.dart lib/services/pdf_service.dart test/widget_test.dart scripts/verify_online_only.py
          if ! git diff --cached --quiet; then
            git commit -m 'Fix canonical IQD storage and USD display conversion'
            git push origin owner-source
          fi

      - name: Patch user-source
        run: |
          set -euo pipefail
          git show owner-source:scripts/apply_canonical_iqd_storage_fix.py > /tmp/apply_canonical_iqd_storage_fix.py
          git checkout user-source
          REPO_ROOT="$PWD" python3 /tmp/apply_canonical_iqd_storage_fix.py
          git add lib/utils/helpers.dart lib/screens/shared/user_profile_screen.dart lib/services/pdf_service.dart test/widget_test.dart scripts/verify_online_only.py
          if ! git diff --cached --quiet; then
            git commit -m 'Fix canonical IQD storage and USD display conversion'
            git push origin user-source
          fi
