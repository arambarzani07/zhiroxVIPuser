name: Hikvision Production Preflight

on:
  push:
    branches: [user-source]
    paths:
      - '.github/workflows/hikvision-production-preflight.yml'
      - 'supabase/config.toml'
      - 'supabase/functions/hikvision-gateway/**'
      - 'supabase/functions/hikvision-admin/**'
      - 'supabase/migrations/**hikvision**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hikvision-production-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      EXPECTED_PROJECT_REF: madoflmbretqghqbqaak
    steps:
      - uses: actions/checkout@v4
        with:
          ref: user-source

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Verify local Hikvision deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/20261003093000_add_hikvision_transaction_video_gateway.sql
          test -f supabase/migrations/20261003210000_harden_hikvision_gateway_attempt_fencing.sql
          test -f supabase/migrations/20261003213000_add_hikvision_retention_lifecycle.sql
          test -f supabase/functions/hikvision-gateway/index.ts
          test -f supabase/functions/hikvision-admin/index.ts
          grep -q 'hikvision_gateway_claim_v2_service' supabase/functions/hikvision-gateway/index.ts
          grep -q 'hikvision_gateway_retention_due_service' supabase/functions/hikvision-gateway/index.ts
          echo "Local Hikvision deployment bundle is complete."

      - name: Assess remote preflight credentials
        id: remote
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${SUPABASE_ACCESS_TOKEN:-}" && -n "${SUPABASE_DB_PASSWORD:-}" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo "Remote dry-run credentials are available."
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Remote Supabase dry-run skipped: add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD repository secrets.'
          fi

      - name: Link production project for read-only migration preflight
        if: steps.remote.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          supabase link \
            --project-ref "$EXPECTED_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Capture remote migration state
        if: steps.remote.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight
          supabase migration list --linked 2>&1 | tee preflight/migration-list.txt

      - name: Dry-run pending database migrations
        if: steps.remote.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --dry-run 2>&1 | tee preflight/db-push-dry-run.txt

      - name: Summarize Hikvision readiness
        if: always()
        shell: bash
        run: |
          {
            echo '## Hikvision production preflight'
            echo '- Expected project: `madoflmbretqghqbqaak`'
            echo '- Database mutation: **none** (dry-run only)'
            echo '- Required Hikvision migrations:'
            echo '  - `20261003093000_add_hikvision_transaction_video_gateway.sql`'
            echo '  - `20261003210000_harden_hikvision_gateway_attempt_fencing.sql`'
            echo '  - `20261003213000_add_hikvision_retention_lifecycle.sql`'
            echo '- Gateway Edge Function uses custom machine-token auth (`verify_jwt=false`).'
            if [[ '${{ steps.remote.outputs.ready }}' == 'true' ]]; then
              echo '- Remote migration dry-run: **executed**'
            else
              echo '- Remote migration dry-run: **blocked — repository Supabase credentials are missing**'
            fi
            echo ''
            echo '### Pending migration dry-run'
            echo '```text'
            if [[ -f preflight/db-push-dry-run.txt ]]; then
              tail -n 120 preflight/db-push-dry-run.txt
            else
              echo 'remote dry-run not executed'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hikvision-production-preflight-${{ github.run_id }}
          path: preflight/
          if-no-files-found: warn
          retention-days: 30
