name: Secure Profile Password Flow Once
'on':
  push:
    branches:
      - owner-source
jobs:
  patch-both:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Patch Owner
        run: |
          python scripts/secure_profile_password_flow.py .
          git add lib/services/pb_service.dart lib/screens/shared/user_profile_screen.dart
          git commit -m 'Use secure profile password flows'
          git push origin HEAD:owner-source
      - name: Patch User
        run: |
          git worktree add /tmp/user-source origin/user-source
          python scripts/secure_profile_password_flow.py /tmp/user-source
          cd /tmp/user-source
          git add lib/services/pb_service.dart lib/screens/shared/user_profile_screen.dart
          git commit -m 'Use secure profile password flows'
          git push origin HEAD:user-source
