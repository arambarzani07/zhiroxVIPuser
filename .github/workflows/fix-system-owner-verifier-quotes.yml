name: Fix System Owner Verifier Quotes

on:
  push:
    branches: [owner-source]
    paths:
      - 'scripts/fix_system_owner_verifier_quotes.py'
      - '.github/workflows/fix-system-owner-verifier-quotes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout owner-source
        uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0

      - name: Preserve fixer
        run: cp scripts/fix_system_owner_verifier_quotes.py /tmp/fix_system_owner_verifier_quotes.py

      - name: Patch Owner
        run: python scripts/fix_system_owner_verifier_quotes.py

      - name: Commit Owner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify_online_only.py
          if ! git diff --cached --quiet; then
            git commit -m 'Fix System Owner verifier quote guard'
            git push origin HEAD:owner-source
          fi

      - name: Checkout user-source
        run: |
          git fetch origin user-source
          git checkout -B user-source origin/user-source

      - name: Patch User
        run: python /tmp/fix_system_owner_verifier_quotes.py

      - name: Commit User
        run: |
          git add scripts/verify_online_only.py
          if ! git diff --cached --quiet; then
            git commit -m 'Fix System Owner verifier quote guard'
            git push origin HEAD:user-source
          fi
