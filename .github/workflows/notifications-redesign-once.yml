name: Notifications Redesign Once
'on':
  push:
    branches:
      - owner-source
    paths:
      - .github/workflows/notifications-redesign-once.yml

permissions:
  contents: write

jobs:
  patch-both:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Patch Owner notifications
        run: |
          python scripts/notifications_redesign.py
          git add lib/screens/customer/notifications_screen.dart
          git commit -m "Redesign notifications experience"
          git push origin owner-source
      - name: Patch User notifications
        run: |
          cp scripts/notifications_redesign.py /tmp/notifications_redesign.py
          git fetch origin user-source
          git checkout user-source
          python /tmp/notifications_redesign.py
          git add lib/screens/customer/notifications_screen.dart
          git commit -m "Redesign notifications experience"
          git push origin user-source
