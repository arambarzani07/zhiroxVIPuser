name: Deduplicate Financial Documents

on:
  push:
    paths:
      - '.github/workflows/deduplicate-financial-documents.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp scripts/deduplicate_financial_documents.py /tmp/deduplicate_financial_documents.py
      - name: Patch Owner
        run: |
          python /tmp/deduplicate_financial_documents.py
          git add -A
          git commit -m "Deduplicate invoice and receipt actions"
          git push origin HEAD:owner-source
      - name: Patch User
        run: |
          git fetch origin user-source
          git checkout -B user-source origin/user-source
          python /tmp/deduplicate_financial_documents.py
          git add -A
          git commit -m "Deduplicate invoice and receipt actions"
          git push origin HEAD:user-source
