name: Finalize Owner UI States

on:
  push:
    branches: [owner-source]
    paths:
      - 'scripts/finalize_owner_ui_states.py'
      - '.github/workflows/finalize-owner-ui-states.yml'

permissions:
  contents: write

jobs:
  finalize-owner-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0

      - name: Finalize Owner UI states
        run: python3 scripts/finalize_owner_ui_states.py

      - name: Verify patch hygiene
        run: git diff --check

      - name: Commit final Owner UI state polish
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No UI state changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/auth
          git commit -m "Finalize Owner error and empty states"
          git push origin HEAD:owner-source
