name: Redesign UI Foundation
'on':
  push:
    branches:
      - owner-source
    paths:
      - .github/workflows/redesign-foundation-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0
      - name: Apply redesign patch
        run: python3 scripts/redesign_foundation_patch.py
      - name: Verify diff
        run: git diff --check
      - name: Commit redesign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/admin/admin_dashboard.dart lib/screens/shared/user_list_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Simplify navigation and customer list UI'
          git push origin owner-source
