name: Redesign UI Foundation
'on':
  push:
    branches:
      - user-source
    paths:
      - .github/workflows/redesign-foundation-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: user-source
          fetch-depth: 0
      - name: Simplify navigation and customer cards
        run: |
          python3 <<'PY'
          from pathlib import Path

          dashboard = Path('lib/screens/admin/admin_dashboard.dart')
          text = dashboard.read_text()
          start = text.index('  Widget _buildNavItem(')
          end = text.index('  Widget _buildNewDashboard(', start)
          replacement = r'''  Widget _buildNavItem(
    int index,
    IconData icon,
    IconData activeIcon,
    String label,
  ) {
    final isSelected = _currentIndex == index;
    final isDark = Theme.of(context).brightness == Brightness.dark;
    final inactiveColor =
        isDark ? AppDarkColors.textSecondary : const Color(0xFF98A2B3);

    return Expanded(
      child: Padding(
        padding: const EdgeInsets.symmetric(horizontal: 2),
        child: Material(
          color: Colors.transparent,
          borderRadius: BorderRadius.circular(14),
          child: InkWell(
            borderRadius: BorderRadius.circular(14),
            onTap: () {
              if (_currentIndex == index) return;
              setState(() {
                _visitedTabs.add(index);
                _currentIndex = index;
              });
              if (index == 0) unawaited(_loadStats());
            },
            child: AnimatedContainer(
              duration: const Duration(milliseconds: 220),
              curve: Curves.easeOutCubic,
              padding: const EdgeInsets.symmetric(vertical: 8),
              decoration: BoxDecoration(
                color: isSelected
                    ? AppColors.primary.withOpacity(isDark ? 0.18 : 0.10)
                    : Colors.transparent,
                borderRadius: BorderRadius.circular(14),
              ),
              child: Column(
                mainAxisSize: MainAxisSize.min,
                children: [
                  Icon(
                    isSelected ? activeIcon : icon,
                    size: 22,
                    color: isSelected ? AppColors.primary : inactiveColor,
                  ),
                  const SizedBox(height: 4),
                  Text(
                    label,
                    maxLines: 1,
                    overflow: TextOverflow.ellipsis,
                    style: TextStyle(
                      color: isSelected ? AppColors.primary : inactiveColor,
                      fontSize: 11,
                      fontWeight:
                          isSelected ? FontWeight.w700 : FontWeight.w500,
                    ),
                  ),
                ],
              ),
            ),
          ),
        ),
      ),
    );
  }

'''
          dashboard.write_text(text[:start] + replacement + text[end:])

          users = Path('lib/screens/shared/user_list_screen.dart')
          text = users.read_text()
          start = text.index('  Widget _buildUserCard(')
          end = text.index('  List<Color> _getAvatarGradient(', start)
          replacement = r'''  Widget _buildUserCard(RecordModel user, int index, AuthProvider auth) {
    final isDark = Theme.of(context).brightness == Brightness.dark;
    final name = user.getStringValue('name');
    final approved = user.getBoolValue('approved');
    final accentColor = _isEmployee
        ? const Color(0xFF4A6CF7)
        : AppColors.primary;
    final balance = _balances[user.id] ?? 0;
    final canManageCustomer = widget.role == 'customer' &&
        (auth.userRole == 'admin' || auth.userRole == 'employee');

    return Container(
      margin: const EdgeInsets.only(bottom: 10),
      decoration: BoxDecoration(
        color: isDark ? AppDarkColors.card : Colors.white,
        borderRadius: BorderRadius.circular(16),
        border: Border.all(
          color: isDark
              ? Colors.white.withOpacity(0.06)
              : const Color(0xFFE9EDF3),
        ),
      ),
      child: Material(
        color: Colors.transparent,
        borderRadius: BorderRadius.circular(16),
        child: InkWell(
          borderRadius: BorderRadius.circular(16),
          onTap: () {
            Navigator.push(
              context,
              MaterialPageRoute(
                builder: (_) => UserProfileScreen(userId: user.id),
              ),
            ).then((_) => _loadUsers());
          },
          child: Padding(
            padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 13),
            child: Row(
              children: [
                Container(
                  width: 48,
                  height: 48,
                  decoration: BoxDecoration(
                    color: accentColor.withOpacity(0.10),
                    borderRadius: BorderRadius.circular(14),
                  ),
                  alignment: Alignment.center,
                  child: Text(
                    name.isNotEmpty ? name[0].toUpperCase() : '?',
                    style: TextStyle(
                      color: accentColor,
                      fontWeight: FontWeight.w800,
                      fontSize: 20,
                    ),
                  ),
                ),
                const SizedBox(width: 12),
                Expanded(
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Row(
                        children: [
                          Expanded(
                            child: Text(
                              name,
                              maxLines: 1,
                              overflow: TextOverflow.ellipsis,
                              style: TextStyle(
                                fontWeight: FontWeight.w700,
                                fontSize: 15,
                                color: isDark
                                    ? AppDarkColors.textPrimary
                                    : const Color(0xFF1F2937),
                              ),
                            ),
                          ),
                          if (_isEmployee && approved)
                            Container(
                              padding: const EdgeInsets.symmetric(
                                horizontal: 7,
                                vertical: 3,
                              ),
                              decoration: BoxDecoration(
                                color: Colors.green.withOpacity(0.10),
                                borderRadius: BorderRadius.circular(8),
                              ),
                              child: const Text(
                                'چالاک',
                                style: TextStyle(
                                  color: Colors.green,
                                  fontSize: 10,
                                  fontWeight: FontWeight.w700,
                                ),
                              ),
                            ),
                        ],
                      ),
                      if (!_isEmployee) ...[
                        const SizedBox(height: 5),
                        Text(
                          _balances.containsKey(user.id)
                              ? 'ماوە: ${AppHelpers.formatCurrency(balance)}'
                              : 'ماوە: ...',
                          style: TextStyle(
                            color: !_balances.containsKey(user.id)
                                ? Colors.grey[400]
                                : balance > 0
                                    ? Colors.red[500]
                                    : Colors.green[500],
                            fontSize: 12.5,
                            fontWeight: FontWeight.w600,
                          ),
                        ),
                      ],
                    ],
                  ),
                ),
                const SizedBox(width: 8),
                if (canManageCustomer)
                  PopupMenuButton<String>(
                    tooltip: 'کردارەکان',
                    padding: EdgeInsets.zero,
                    onSelected: (value) {
                      if (value == 'debt') {
                        Navigator.push(
                          context,
                          MaterialPageRoute(
                            builder: (_) => AddDebtScreen(customerId: user.id),
                          ),
                        ).then((_) => _loadUsers());
                      } else if (value == 'payment') {
                        _showPaymentDialog(user);
                      }
                    },
                    itemBuilder: (_) => [
                      const PopupMenuItem<String>(
                        value: 'debt',
                        child: Row(
                          children: [
                            Icon(Icons.add_card_rounded, size: 20),
                            SizedBox(width: 10),
                            Text('قەرز زیاد بکە'),
                          ],
                        ),
                      ),
                      if (balance > 0)
                        const PopupMenuItem<String>(
                          value: 'payment',
                          child: Row(
                            children: [
                              Icon(Icons.payments_outlined, size: 20),
                              SizedBox(width: 10),
                              Text('پارەدانەوە'),
                            ],
                          ),
                        ),
                    ],
                    icon: Container(
                      width: 38,
                      height: 38,
                      decoration: BoxDecoration(
                        color: accentColor.withOpacity(0.08),
                        borderRadius: BorderRadius.circular(11),
                      ),
                      alignment: Alignment.center,
                      child: Icon(
                        Icons.more_horiz_rounded,
                        color: accentColor,
                        size: 22,
                      ),
                    ),
                  )
                else
                  Icon(
                    Icons.chevron_left_rounded,
                    color: isDark ? Colors.grey[600] : Colors.grey[350],
                    size: 22,
                  ),
              ],
            ),
          ),
        ),
      ),
    );
  }

'''
          users.write_text(text[:start] + replacement + text[end:])
          PY
          git diff --check
      - name: Commit redesign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/admin/admin_dashboard.dart lib/screens/shared/user_list_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Simplify navigation and customer list UI'
          git push origin user-source
