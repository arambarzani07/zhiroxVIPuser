name: Fix Owner permission center import

on:
  push:
    branches:
      - owner-source
    paths:
      - '.github/workflows/fix-owner-permission-center-import.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add constants import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/screens/auth/owner_permission_center_screen.dart')
          text = path.read_text(encoding='utf-8')
          line = "import 'package:zhirox/utils/constants.dart';\n"
          anchor = "import 'package:zhirox/services/owner_permission_service.dart';\n"
          if line not in text:
              if anchor not in text:
                  raise SystemExit('import anchor missing')
              text = text.replace(anchor, anchor + line, 1)
              path.write_text(text, encoding='utf-8')
          PY
          grep -q "package:zhirox/utils/constants.dart" lib/screens/auth/owner_permission_center_screen.dart
      - name: Commit import fix
        run: |
          if [ -z "$(git status --porcelain -- lib/screens/auth/owner_permission_center_screen.dart)" ]; then
            echo "Import already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/auth/owner_permission_center_screen.dart
          git commit -m "Fix Owner permission center color import"
          git push
