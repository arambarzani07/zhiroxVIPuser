name: Modern Record API Cleanup Once

on:
  push:
    branches: [owner-source]

jobs:
  patch-both:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Patch Owner
        run: |
          python3 scripts/modern_record_api_cleanup_once.py .
          git add lib
          git commit -m 'Migrate deprecated record APIs and async contexts'
          git push origin HEAD:owner-source

      - name: Patch User
        run: |
          git worktree add /tmp/user-source origin/user-source
          python3 "$GITHUB_WORKSPACE/scripts/modern_record_api_cleanup_once.py" /tmp/user-source
          cd /tmp/user-source
          git add lib
          git commit -m 'Migrate deprecated record APIs and async contexts'
          git push origin HEAD:user-source
