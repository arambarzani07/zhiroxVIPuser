name: Official Receipt UI Once

on:
  push:
    branches:
      - owner-source
      - user-source

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          dashboard = Path('lib/screens/admin/admin_dashboard.dart')
          text = dashboard.read_text()
          anchor = "import 'package:zhirox/screens/admin/subscription_payment_screen.dart';\n"
          imp = "import 'package:zhirox/screens/admin/receipt_settings_screen.dart';\n"
          if imp not in text:
              if anchor not in text:
                  raise SystemExit('import anchor missing')
              text = text.replace(anchor, anchor + imp, 1)
          report = """                _settingsTile(
                  isDark: isDark,
                  icon: Icons.summarize_outlined,
                  iconColor: AppColors.primary,
                  title: 'کەشفی حیساب و ڕاپۆرت',"""
          tile = """                _settingsTile(
                  isDark: isDark,
                  icon: Icons.receipt_long_outlined,
                  iconColor: Colors.teal,
                  title: 'ڕێکخستنی پسوولەی فەرمی',
                  subtitle: 'ناونیشان، ژمارە، قەبارە و شێوازی پسوولە دیاری بکە',
                  onTap: () {
                    Navigator.pop(ctx);
                    Navigator.push(
                      context,
                      MaterialPageRoute(
                        builder: (_) => const ReceiptSettingsScreen(),
                      ),
                    );
                  },
                ),
"""
          if "title: 'ڕێکخستنی پسوولەی فەرمی'" not in text:
              if report not in text:
                  raise SystemExit('menu anchor missing')
              text = text.replace(report, tile + report, 1)
          dashboard.write_text(text)
          verifier = Path('scripts/verify_online_only.py')
          v = verifier.read_text()
          old = "        'PdfService.generateInvoice(',"
          new = "        'OfficialReceiptService.generateDebtReceipt(',"
          if old in v:
              v = v.replace(old, new, 1)
          elif new not in v:
              raise SystemExit('verifier anchor missing')
          verifier.write_text(v)
          PY

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/official-receipt-ui-once.yml
          git add lib/screens/admin/admin_dashboard.dart scripts/verify_online_only.py
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m 'Wire official receipt settings UI'
          git push
