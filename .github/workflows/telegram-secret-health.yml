name: Telegram Secret Health

on:
  push:
    branches:
      - user-source
    paths:
      - '.github/workflows/telegram-secret-health.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-secret-health:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check and repair Telegram bot secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo 'SUPABASE_CI_CREDENTIALS=missing'
            exit 1
          fi

          secret_present() {
            supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" --output json 2>/dev/null \
              | jq -e 'if type == "array" then any(.[]; .name == "TELEGRAM_BOT_TOKEN") else false end' >/dev/null
          }

          if secret_present; then
            echo 'TELEGRAM_BOT_TOKEN=present'
            exit 0
          fi

          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" >/dev/null
            if secret_present; then
              echo 'TELEGRAM_BOT_TOKEN=repaired_from_github_secret'
              exit 0
            fi
          fi

          echo 'TELEGRAM_BOT_TOKEN=missing'
          exit 2
