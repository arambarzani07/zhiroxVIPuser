name: Patch employee 60 permission submission

on:
  push:
    branches:
      - user-source
    paths:
      - .github/workflows/patch-employee-60-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: user-source
          fetch-depth: 0
      - name: Submit all 60 permissions from employee dialog
        run: python3 scripts/patch_employee_60_submission.py
      - name: Commit hotfix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/shared/add_user_screen.dart
          git commit -m "Submit all 60 employee permissions during creation"
          git push origin HEAD:user-source
