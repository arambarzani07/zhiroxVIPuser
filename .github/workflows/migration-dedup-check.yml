name: Migration Dedup Verification

on:
  push:
    branches: [migration-dedup-20260925]

permissions:
  contents: read

concurrency:
  group: migration-dedup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify executable migration uniqueness
        run: python3 scripts/verify_migration_duplicates.py

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start fresh local database
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Run database regression
        run: supabase test db supabase/tests/audit40_integrity.test.sql

      - name: Lint database functions
        run: supabase db lint --level error
