name: Final Integrity Patch

on:
  push:
    branches:
      - owner-source
    paths:
      - '.github/workflows/final-integrity-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner-source
      - name: Apply integrity fixes
        run: python3 scripts/final_integrity_patch.py
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/pb_service.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Harden login and debt transaction integrity'
          git push origin HEAD:owner-source
