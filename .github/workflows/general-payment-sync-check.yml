name: General Payment Sync Check

on:
  push:
    branches: [general-payment-outbound-sync-20260925]

permissions:
  contents: read

concurrency:
  group: general-payment-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source contract
        run: |
          python3 scripts/verify_migration_duplicates.py
          python3 scripts/verify_general_payment_outbound_sync.py
          python3 scripts/verify_daftar_outbound_sync.py
          python3 scripts/verify_daftar_bidirectional_mutations.py

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start fresh local Supabase
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Run database regression
        run: supabase test db supabase/tests/audit40_integrity.test.sql

      - name: Lint database
        run: supabase db lint --level error

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check sync workers
        run: |
          deno check supabase/functions/daftar-outbound-sync/index.ts
          deno check supabase/functions/daftar-sync/index.ts
