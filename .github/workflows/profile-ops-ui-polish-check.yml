name: Profile Ops UI Polish Check

on:
  push:
    branches: [profile-ops-ui-polish-20260925]

permissions:
  contents: read

concurrency:
  group: profile-ops-ui-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Verify update and push contracts
        run: |
          python3 scripts/verify_auto_update.py
          python3 scripts/verify_customer_push.py
      - name: Analyze
        run: flutter analyze
      - name: Test customer push card
        run: flutter test test/customer_push_card_test.dart
      - name: Run Flutter tests
        run: flutter test
