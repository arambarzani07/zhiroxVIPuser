name: Hikvision Gateway Windows

on:
  workflow_dispatch:
  push:
    branches: [user-source, gateway-build-20261003, hikvision-gateway-resilience]
    paths:
      - 'gateway/hikvision/**'
      - '.github/workflows/hikvision-gateway-windows.yml'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: hikvision-gateway-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: gateway/hikvision/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: pip install -r gateway/hikvision/requirements.txt

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-tesseract-ocr mingw-w64-ucrt-x86_64-tesseract-data-eng

      - name: Stage standalone OCR resources
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        shell: pwsh
        working-directory: gateway/hikvision
        run: |
          python bundle_ocr.py "$env:MSYS2_LOCATION/ucrt64"
          & "$env:MSYS2_LOCATION/usr/bin/bash.exe" -lc "pacman -Q" | Out-File OCR-PACKAGES.txt -Encoding utf8

      - name: Verify resilient task definition
        shell: pwsh
        working-directory: gateway/hikvision
        run: |
          python -c "import pathlib, xml.etree.ElementTree as ET; from autostart import task_xml; x=task_xml(pathlib.Path(r'C:\ZHIROX\zhirox-hikvision-gateway.exe'), r'TEST\gateway'); ET.fromstring(x); assert '<RestartOnFailure>' in x and '<Count>999</Count>' in x and '<ExecutionTimeLimit>PT0S</ExecutionTimeLimit>' in x; print('resilient task XML passed')"

      - name: Build setup wizard
        shell: pwsh
        working-directory: gateway/hikvision
        run: pyinstaller --clean --onefile --name zhirox-hikvision-setup setup.py

      - name: Build auto-start repair helper
        shell: pwsh
        working-directory: gateway/hikvision
        run: pyinstaller --clean --onefile --name zhirox-hikvision-autostart autostart.py

      - name: Test recorder and evergreen updater diagnostics
        shell: pwsh
        working-directory: gateway/hikvision
        run: python -m unittest discover -p "test_*.py"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ocr-fixture
          path: gateway/hikvision/native-ocr-fixture.png

      - name: Build recorder diagnostics
        shell: pwsh
        working-directory: gateway/hikvision
        run: pyinstaller --clean --onefile --name zhirox-hikvision-diagnose diagnose.py

      - name: Build NVR and IPC time sync utility
        shell: pwsh
        working-directory: gateway/hikvision
        run: pyinstaller --clean --onefile --add-data "ocr;ocr" --name zhirox-hikvision-time-sync time_sync.py

      - name: Build evergreen self-update helper
        shell: pwsh
        working-directory: gateway/hikvision
        run: pyinstaller --clean --onefile --noconsole --name zhirox-hikvision-updater updater.py

      - name: Build background gateway
        shell: pwsh
        working-directory: gateway/hikvision
        run: pyinstaller --clean --onefile --noconsole --add-data "ocr;ocr" --name zhirox-hikvision-gateway bootstrap.py

      - name: Check Windows executables and DPAPI
        shell: pwsh
        working-directory: gateway/hikvision
        run: |
          .\dist\zhirox-hikvision-diagnose.exe --help
          if ($LASTEXITCODE -ne 0) { throw "diagnostic executable smoke test failed" }
          .\dist\zhirox-hikvision-time-sync.exe --help
          if ($LASTEXITCODE -ne 0) { throw "time sync executable smoke test failed" }
          .\dist\zhirox-hikvision-updater.exe --help
          if ($LASTEXITCODE -ne 0) { throw "updater executable smoke test failed" }
          python -c "from common import protect_secret, unprotect_secret; assert unprotect_secret(protect_secret('windows-build-test')) == 'windows-build-test'; print('DPAPI round-trip passed')"
          if ($LASTEXITCODE -ne 0) { throw "DPAPI smoke test failed" }
          $image = (Resolve-Path native-ocr-fixture.png).Path
          $test = Start-Process -FilePath .\dist\zhirox-hikvision-gateway.exe -ArgumentList @('--verify-ocr-fixture', $image) -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Frozen gateway OCR smoke test failed" }

      - name: Generate evergreen update manifest
        shell: pwsh
        working-directory: gateway/hikvision
        run: |
          $version = (python -c "import bootstrap; print(bootstrap.GATEWAY_VERSION)").Trim()
          if (-not $version) { throw "Gateway version missing" }
          $manifest = [ordered]@{
            schema = 1
            protocol = 1
            version = $version
            health_timeout_seconds = 300
            assets = @(
              [ordered]@{ name = "zhirox-hikvision-updater.exe"; target = "zhirox-hikvision-updater.exe"; role = "updater" },
              [ordered]@{ name = "zhirox-hikvision-setup.exe"; target = "zhirox-hikvision-setup.exe"; role = "companion" },
              [ordered]@{ name = "zhirox-hikvision-autostart.exe"; target = "zhirox-hikvision-autostart.exe"; role = "companion" },
              [ordered]@{ name = "zhirox-hikvision-diagnose.exe"; target = "zhirox-hikvision-diagnose.exe"; role = "companion" },
              [ordered]@{ name = "zhirox-hikvision-time-sync.exe"; target = "zhirox-hikvision-time-sync.exe"; role = "companion" },
              [ordered]@{ name = "zhirox-hikvision-gateway.exe"; target = "zhirox-hikvision-gateway.exe"; role = "gateway" }
            )
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content .\dist\gateway-update.json -Encoding utf8
          python -c "import json, pathlib; p=json.loads(pathlib.Path('dist/gateway-update.json').read_text(encoding='utf-8-sig')); assert p['schema']==1 and p['protocol']==1 and p['version']; assert p['health_timeout_seconds']==300; assert {a['role'] for a in p['assets']} >= {'gateway','updater'}; print('evergreen manifest validated')"

      - name: Attest production Gateway payload
        if: github.event_name == 'push' && github.ref == 'refs/heads/user-source'
        uses: actions/attest@v4
        with:
          subject-path: 'gateway/hikvision/dist/*'

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/hikvision-gateway | Out-Null
          Copy-Item gateway/hikvision/dist/zhirox-hikvision-setup.exe artifacts/hikvision-gateway/
          Copy-Item gateway/hikvision/dist/zhirox-hikvision-autostart.exe artifacts/hikvision-gateway/
          Copy-Item gateway/hikvision/dist/zhirox-hikvision-diagnose.exe artifacts/hikvision-gateway/
          Copy-Item gateway/hikvision/dist/zhirox-hikvision-time-sync.exe artifacts/hikvision-gateway/
          Copy-Item gateway/hikvision/dist/zhirox-hikvision-updater.exe artifacts/hikvision-gateway/
          Copy-Item gateway/hikvision/dist/zhirox-hikvision-gateway.exe artifacts/hikvision-gateway/
          Copy-Item gateway/hikvision/dist/gateway-update.json artifacts/hikvision-gateway/
          Copy-Item gateway/hikvision/README.md artifacts/hikvision-gateway/ -ErrorAction SilentlyContinue
          Copy-Item gateway/hikvision/01-check-nvr.cmd artifacts/hikvision-gateway/
          Copy-Item gateway/hikvision/02-setup.cmd artifacts/hikvision-gateway/
          Copy-Item gateway/hikvision/OCR-PACKAGES.txt artifacts/hikvision-gateway/
          Copy-Item gateway/hikvision/ocr/SOURCES.txt artifacts/hikvision-gateway/
          Copy-Item gateway/hikvision/ocr/licenses artifacts/hikvision-gateway/ -Recurse
          Get-FileHash artifacts/hikvision-gateway/*.exe -Algorithm SHA256 | Format-Table -AutoSize | Out-File artifacts/hikvision-gateway/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: zhirox-hikvision-gateway-windows
          path: artifacts/hikvision-gateway
          if-no-files-found: error
          retention-days: 30

      - name: Publish ID-pinned Evergreen Gateway release
        if: github.event_name == 'push' && github.ref == 'refs/heads/user-source'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        working-directory: gateway/hikvision
        run: |
          $repo = "arambarzani07/zhiroxVIPuser"
          $version = (python -c "import bootstrap; print(bootstrap.GATEWAY_VERSION)").Trim()
          if (-not $version) { throw "Gateway version missing" }
          $tag = "hikvision-gateway-v$version"
          $title = "ZHIROX Hikvision Gateway $version"
          $notes = "Evergreen Windows Gateway release. Clients verify SHA-256 digests and successful production CI provenance. The build is attested with GitHub Artifact Attestations, stages required companion files, runs NVR/cloud preflight, atomically replaces files, recovers after power loss, verifies post-restart health, quarantines bad releases, and rolls back automatically on failure."

          function Get-ReleaseByTag {
            $releases = gh api "repos/$repo/releases?per_page=100" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Gateway release list failed" }
            return $releases | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
          }

          $release = Get-ReleaseByTag
          if ($release) {
            if ($release.target_commitish -ne $env:GITHUB_SHA) {
              throw "Gateway version $version already belongs to another commit. Bump GATEWAY_VERSION."
            }
          } else {
            $release = gh api --method POST "repos/$repo/releases" `
              -f tag_name="$tag" `
              -f target_commitish="$env:GITHUB_SHA" `
              -f name="$title" `
              -f body="$notes" `
              -F draft=true `
              -F prerelease=false | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or -not $release.id) {
              throw "Gateway draft release create failed"
            }
          }

          $releaseId = [string]$release.id
          function Get-ReleaseById {
            $value = gh api "repos/$repo/releases/$releaseId" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Gateway release lookup failed" }
            return $value
          }

          function Upload-AssetById([string]$Path) {
            $name = Split-Path $Path -Leaf
            $localDigest = "sha256:" + (Get-FileHash $Path -Algorithm SHA256).Hash.ToLowerInvariant()
            $current = Get-ReleaseById
            $existingAsset = $current.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if ($existingAsset) {
              if ($existingAsset.digest -ne $localDigest) {
                throw "Release asset differs for $name. Bump GATEWAY_VERSION; never replace bytes under an existing version."
              }
              Write-Host "Release asset already matches: $name"
              return
            }
            if (-not $current.draft) {
              throw "Published Gateway release is missing $name. Never mutate a published version; bump GATEWAY_VERSION."
            }

            $encodedName = [System.Uri]::EscapeDataString($name)
            $uploadUrl = "https://uploads.github.com/repos/$repo/releases/$releaseId/assets?name=$encodedName"
            for ($attempt = 1; $attempt -le 6; $attempt++) {
              & curl.exe --silent --show-error --fail-with-body --output NUL `
                -X POST `
                -H "Accept: application/vnd.github+json" `
                -H "Authorization: Bearer $env:GH_TOKEN" `
                -H "X-GitHub-Api-Version: 2026-03-10" `
                -H "Content-Type: application/octet-stream" `
                --data-binary "@$Path" `
                $uploadUrl
              if ($LASTEXITCODE -eq 0) { return }
              if ($attempt -lt 6) { Start-Sleep -Seconds ([Math]::Min(30, [Math]::Pow(2, $attempt))) }
            }
            throw "Gateway release upload failed: $Path"
          }

          $releaseAssets = @(
            ".\dist\gateway-update.json",
            ".\dist\zhirox-hikvision-updater.exe",
            ".\dist\zhirox-hikvision-setup.exe",
            ".\dist\zhirox-hikvision-autostart.exe",
            ".\dist\zhirox-hikvision-diagnose.exe",
            ".\dist\zhirox-hikvision-time-sync.exe",
            ".\dist\zhirox-hikvision-gateway.exe"
          )
          foreach ($assetPath in $releaseAssets) { Upload-AssetById $assetPath }

          $release = Get-ReleaseById
          $expectedNames = $releaseAssets | ForEach-Object { Split-Path $_ -Leaf }
          foreach ($name in $expectedNames) {
            $asset = $release.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if (-not $asset) { throw "Gateway asset missing before publish: $name" }
            if ($asset.state -ne "uploaded") { throw "Gateway asset incomplete before publish: $name" }
            if ($asset.digest -notmatch '^sha256:[0-9a-fA-F]{64}$') { throw "Gateway digest missing before publish: $name" }
          }

          if ($release.draft) {
            $published = gh api --method PATCH "repos/$repo/releases/$releaseId" `
              -F draft=false `
              -f name="$title" `
              -f body="$notes" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or -not $published.id) {
              throw "Gateway release publish failed"
            }
          }

          $published = Get-ReleaseById
          if ($published.draft) { throw "Gateway release did not publish" }
          if ($published.target_commitish -ne $env:GITHUB_SHA) { throw "Published Gateway commit mismatch" }
          Write-Host "Evergreen Gateway release published: $tag immutable=$($published.immutable)"

  playback-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install playback test dependencies
        run: |
          pip install requests
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr
      - name: Test HEVC conversion and failure handling
        working-directory: gateway/hikvision
        run: python -m unittest test_playback.py test_osd_short_year.py test_local_clock_fallback.py test_rtsp_codec_relay.py test_playback_transport.py test_time_window.py
