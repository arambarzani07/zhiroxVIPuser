name: Currency Safe Financial Summary Once

on:
  push:
    branches:
      - owner-source
    paths:
      - '.github/workflows/currency-safe-financial-summary-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner-source
          fetch-depth: 0

      - name: Preserve migration helper
        run: cp scripts/currency_safe_financial_summary.py /tmp/currency_safe_financial_summary.py

      - name: Patch Owner source
        run: |
          python3 /tmp/currency_safe_financial_summary.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/utils/helpers.dart lib/screens/shared/user_profile_screen.dart lib/screens/customer/customer_dashboard.dart test/widget_test.dart scripts/verify_online_only.py
          if ! git diff --cached --quiet; then
            git commit -m 'Make financial summaries currency safe'
            git push origin HEAD:owner-source
          fi

      - name: Patch User source
        run: |
          git fetch origin user-source
          git checkout -B user-source origin/user-source
          python3 /tmp/currency_safe_financial_summary.py
          git add lib/utils/helpers.dart lib/screens/shared/user_profile_screen.dart lib/screens/customer/customer_dashboard.dart test/widget_test.dart scripts/verify_online_only.py
          if ! git diff --cached --quiet; then
            git commit -m 'Make financial summaries currency safe'
            git push origin HEAD:user-source
          fi
