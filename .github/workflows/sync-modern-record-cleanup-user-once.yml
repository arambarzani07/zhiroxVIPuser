name: Sync Modern Record Cleanup User Once

on:
  push:
    branches: [user-source]

jobs:
  sync-shared-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Copy migrated shared files from Owner
        run: |
          git fetch origin owner-source
          git checkout 977e170 -- \
            lib/utils/helpers.dart \
            lib/services/supabase_compat.dart \
            lib/services/pdf_service.dart \
            lib/screens/admin/admin_dashboard.dart \
            lib/screens/admin/pending_requests_screen.dart \
            lib/screens/shared/debt_detail_screen.dart \
            lib/screens/shared/debt_list_screen.dart \
            lib/screens/shared/user_profile_screen.dart
          git add lib
          git commit -m 'Sync modern RecordModel cleanup to User'
          git push origin HEAD:user-source
